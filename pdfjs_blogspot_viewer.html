<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               viewport-fit=cover">

<title>PDF Reader</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;

  background:#0b0b0b;
  color:#fff;

  font-family:Arial,sans-serif;

  overflow-x:hidden;
}


/* =====================================================
   TOOLBAR
===================================================== */

#top{
  position:fixed;

  top:0;
  left:0;
  right:0;

  height:56px;

  background:#111;

  display:flex;
  justify-content:flex-end;
  align-items:center;

  gap:8px;

  padding:8px 12px;

  z-index:10000;
}

.btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:8px;

  background:#2563EB;

  color:#fff;

  font-size:18px;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   PROGRESS
===================================================== */

#progress{
  position:fixed;

  top:56px;
  left:0;
  right:0;

  height:3px;

  background:#222;

  z-index:9999;
}

#bar{
  width:0;
  height:100%;

  background:#60A5FA;
}


/* =====================================================
   NORMAL READER
===================================================== */

#normalReader{
  margin-top:59px;

  width:100%;

  background:#0b0b0b;
}

#normalPages{
  width:100%;
  max-width:780px;

  margin:auto;
}

.normalPage{
  display:block;

  width:100%;
  height:auto;

  background:#fff;

  margin-bottom:2px;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  pointer-events:none;
}


/* =====================================================
   ZOOM VIEWPORT

   PENTING:
   mode normal = display:none
   mode zoom   = display:block
===================================================== */

#zoomViewport{
  display:none;

  position:fixed;

  top:59px;
  left:0;
  right:0;
  bottom:0;

  overflow:hidden;

  background:#0b0b0b;

  z-index:50;

  touch-action:none;

  overscroll-behavior:none;
}

body.zooming #zoomViewport{
  display:block;
}

body.zooming #normalReader{
  display:none;
}


/* =====================================================
   ZOOM PAGES
===================================================== */

#zoomPages{
  position:absolute;

  left:0;
  top:0;

  transform-origin:0 0;

  will-change:transform;
}

.zoomPage{
  display:block;

  background:#fff;

  margin-bottom:2px;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  pointer-events:none;
}


/* =====================================================
   DARK MODE
===================================================== */

body.dark .normalPage,
body.dark .zoomPage{
  filter:invert(1) hue-rotate(180deg);
}


/* =====================================================
   THUMBNAILS
===================================================== */

#thumbs{
  position:fixed;

  top:70px;
  right:-140px;

  width:130px;
  height:calc(100vh - 90px);

  padding:6px;

  background:#111;

  border-left:1px solid #333;

  overflow-y:auto;

  transition:.25s;

  z-index:10001;

  -webkit-overflow-scrolling:touch;
}

#thumbs.show{
  right:0;
}

.thumb{
  width:100%;
  height:auto;

  display:block;

  margin-bottom:6px;

  border:1px solid #333;
  border-radius:4px;

  cursor:pointer;

  touch-action:manipulation;
}


/* =====================================================
   THUMB BUTTON
===================================================== */

#thumbBtn{
  position:fixed;

  right:14px;
  bottom:18px;

  width:52px;
  height:52px;

  border:0;
  border-radius:50%;

  background:#2563EB;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  z-index:10002;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  padding:10px 16px;

  background:#111;

  color:#fff;

  border-radius:20px;

  display:none;

  z-index:10003;

  white-space:nowrap;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  #top{
    height:52px;

    padding:6px 8px;

    gap:6px;
  }

  .btn{
    width:38px;
    height:38px;

    font-size:17px;
  }

  #progress{
    top:52px;
  }

  #normalReader{
    margin-top:55px;
  }

  #zoomViewport{
    top:55px;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:380px){

  #top{
    gap:4px;

    padding-left:5px;
    padding-right:5px;
  }

  .btn{
    width:36px;
    height:36px;

    font-size:16px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     TOOLBAR
===================================================== -->

<div id="top">

  <button class="btn"
          id="zoomOutBtn"
          type="button">
    −
  </button>

  <button class="btn"
          id="zoomInBtn"
          type="button">
    +
  </button>

  <button class="btn"
          id="darkBtn"
          type="button">
    🌙
  </button>

  <button class="btn"
          id="bookmarkBtn"
          type="button">
    🔖
  </button>

  <button class="btn"
          id="fullscreenBtn"
          type="button">
    ⛶
  </button>

</div>


<!-- =====================================================
     PROGRESS
===================================================== -->

<div id="progress">
  <div id="bar"></div>
</div>


<!-- =====================================================
     NORMAL
===================================================== -->

<div id="normalReader">

  <div id="normalPages"></div>

</div>


<!-- =====================================================
     ZOOM
===================================================== -->

<div id="zoomViewport">

  <div id="zoomPages"></div>

</div>


<!-- =====================================================
     THUMBNAILS
===================================================== -->

<div id="thumbs"></div>

<button id="thumbBtn"
        type="button">
  ☰
</button>


<div id="toast"></div>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";


/* =====================================================
   WORKER
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";


/* =====================================================
   PDF
===================================================== */

const comic =
new URLSearchParams(location.search).get("comic")
|| "Dwikora.pdf";


/* =====================================================
   ELEMENT
===================================================== */

const normalPages =
document.getElementById("normalPages");

const zoomPages =
document.getElementById("zoomPages");

const thumbs =
document.getElementById("thumbs");


/* =====================================================
   LOAD
===================================================== */

let pdf;

try{

  pdf =
    await pdfjsLib
      .getDocument(comic)
      .promise;

}catch(error){

  document.body.innerHTML =
    "<div style='padding:40px;color:white;font-family:Arial'>"+
    "<h2>PDF tidak dapat dibuka</h2>"+
    "<p>Pastikan nama file PDF dan lokasi GitHub benar.</p>"+
    "</div>";

  throw error;

}


/* =====================================================
   PAGE DATA
===================================================== */

const pageData=[];


/* =====================================================
   RENDER NORMAL + THUMB
===================================================== */

for(
  let i=1;
  i<=pdf.numPages;
  i++
){

  const page =
    await pdf.getPage(i);


  pageData.push({
    page:page
  });


  /* NORMAL */

  const vp =
    page.getViewport({
      scale:1.6
    });


  const canvas =
    document.createElement("canvas");


  canvas.width=vp.width;
  canvas.height=vp.height;

  canvas.className="normalPage";

  canvas.dataset.page=i;


  await page.render({

    canvasContext:
      canvas.getContext("2d"),

    viewport:vp

  }).promise;


  normalPages.appendChild(canvas);


  /* THUMB */

  const tv =
    page.getViewport({
      scale:.22
    });


  const thumb =
    document.createElement("canvas");


  thumb.width=tv.width;
  thumb.height=tv.height;

  thumb.className="thumb";

  thumb.dataset.page=i;


  await page.render({

    canvasContext:
      thumb.getContext("2d"),

    viewport:tv

  }).promise;


  thumb.addEventListener(
    "click",
    ()=>{

      goToPage(i);

      thumbs.classList.remove("show");

    }
  );


  thumbs.appendChild(thumb);

}


/* =====================================================
   STATE
===================================================== */

let zoom=1;

let offsetX=0;
let offsetY=0;

let normalScrollY=0;

let currentPage=1;


/* TOUCH */

let pinching=false;
let panning=false;

let pinchStartDistance=0;
let pinchStartZoom=1;

let pinchPdfX=0;
let pinchPdfY=0;

let panStartX=0;
let panStartY=0;

let panStartOffsetX=0;
let panStartOffsetY=0;

let lastTap=0;


/* MOUSE */

let mouseDown=false;

let mouseStartX=0;
let mouseStartY=0;

let mouseStartOffsetX=0;
let mouseStartOffsetY=0;


/* =====================================================
   ELEMENT
===================================================== */

const zoomViewport =
document.getElementById(
  "zoomViewport"
);

const toast =
document.getElementById(
  "toast"
);

const bar =
document.getElementById(
  "bar"
);


/* =====================================================
   TOAST
===================================================== */

function show(text){

  toast.textContent=text;

  toast.style.display="block";

  clearTimeout(
    window.__toast
  );

  window.__toast =
    setTimeout(
      ()=>{
        toast.style.display="none";
      },
      1000
    );

}


/* =====================================================
   CURRENT PAGE
===================================================== */

function getCurrentPage(){

  const pages =
    normalPages.querySelectorAll(
      ".normalPage"
    );


  const y =
    window.scrollY + 100;


  let page=1;


  for(
    let i=0;
    i<pages.length;
    i++
  ){

    if(
      pages[i].offsetTop <= y
    ){

      page=i+1;

    }else{

      break;

    }

  }


  return page;

}


/* =====================================================
   BUILD ZOOM
===================================================== */

async function buildZoom(){

  zoomPages.innerHTML="";


  for(
    let i=0;
    i<pageData.length;
    i++
  ){

    const page =
      pageData[i].page;


    const vp =
      page.getViewport({
        scale:1.6
      });


    const canvas =
      document.createElement("canvas");


    canvas.width=vp.width;
    canvas.height=vp.height;

    canvas.className="zoomPage";

    canvas.dataset.page=i+1;


    await page.render({

      canvasContext:
        canvas.getContext("2d"),

      viewport:vp

    }).promise;


    zoomPages.appendChild(canvas);

  }

}


/* =====================================================
   ENTER ZOOM
===================================================== */

async function enterZoom(){

  if(
    document.body.classList.contains(
      "zooming"
    )
  ){

    return;

  }


  currentPage =
    getCurrentPage();


  normalScrollY =
    window.scrollY;


  await buildZoom();


  document.body.classList.add(
    "zooming"
  );


  const pages =
    zoomPages.querySelectorAll(
      ".zoomPage"
    );


  const page =
    pages[currentPage-1];


  const pageTop =
    page
      ? page.offsetTop
      : 0;


  /*
   * Mulai di posisi halaman yang sama.
   */

  offsetX =
    (
      zoomViewport.clientWidth -
      zoomPages.offsetWidth * zoom
    ) / 2;


  offsetY =
    -pageTop * zoom;


  applyZoom();

}


/* =====================================================
   EXIT ZOOM
===================================================== */

function exitZoom(){

  if(
    !document.body.classList.contains(
      "zooming"
    )
  ){

    return;

  }


  /*
   * Posisi PDF saat ini.
   */

  const pdfY =
    Math.max(
      0,
      -offsetY / zoom
    );


  const pages =
    zoomPages.querySelectorAll(
      ".zoomPage"
    );


  let pageNumber=1;
  let pageTop=0;


  for(
    let i=0;
    i<pages.length;
    i++
  ){

    if(
      pages[i].offsetTop <= pdfY
    ){

      pageNumber=i+1;
      pageTop=pages[i].offsetTop;

    }else{

      break;

    }

  }


  const relativeY =
    pdfY-pageTop;


  document.body.classList.remove(
    "zooming"
  );


  zoomPages.style.transform="none";


  zoom=1;

  offsetX=0;
  offsetY=0;


  requestAnimationFrame(()=>{

    const pagesNormal =
      normalPages.querySelectorAll(
        ".normalPage"
      );


    const page =
      pagesNormal[pageNumber-1];


    if(page){

      window.scrollTo(
        0,
        page.offsetTop + relativeY
      );

    }else{

      window.scrollTo(
        0,
        normalScrollY
      );

    }


    updateProgress();

  });

}


/* =====================================================
   LIMIT
===================================================== */

function limitOffset(){

  const width =
    zoomPages.offsetWidth * zoom;

  const height =
    zoomPages.offsetHeight * zoom;


  const vw =
    zoomViewport.clientWidth;

  const vh =
    zoomViewport.clientHeight;


  if(width <= vw){

    offsetX =
      (vw-width)/2;

  }else{

    offsetX =
      Math.min(
        0,
        Math.max(
          vw-width,
          offsetX
        )
      );

  }


  if(height <= vh){

    offsetY =
      (vh-height)/2;

  }else{

    offsetY =
      Math.min(
        0,
        Math.max(
          vh-height,
          offsetY
        )
      );

  }

}


/* =====================================================
   APPLY
===================================================== */

function applyZoom(){

  limitOffset();


  zoomPages.style.transform =
    "translate3d("+
    offsetX+"px,"+
    offsetY+"px,0) "+
    "scale("+zoom+")";


  updateProgress();

}


/* =====================================================
   ZOOM AT POINT
===================================================== */

async function zoomAt(
  newZoom,
  x,
  y
){

  /*
   * Masuk dari 100%.
   */

  if(zoom<=1){

    currentPage =
      getCurrentPage();


    normalScrollY =
      window.scrollY;


    await buildZoom();


    document.body.classList.add(
      "zooming"
    );


    const pages =
      zoomPages.querySelectorAll(
        ".zoomPage"
      );


    const page =
      pages[currentPage-1];


    const pageTop =
      page
        ? page.offsetTop
        : 0;


    /*
     * Posisi relatif di halaman.
     */

    const normalPages =
      normalPagesList();


    const normalPage =
      normalPages[currentPage-1];


    let relativeY=0;


    if(normalPage){

      relativeY =
        Math.max(
          0,
          normalScrollY -
          normalPage.offsetTop
        );

    }


    const pdfX =
      zoomPages.offsetWidth/2;


    const pdfY =
      pageTop+
      relativeY;


    zoom =
      Math.max(
        1.01,
        Math.min(
          3,
          newZoom
        )
      );


    offsetX =
      x -
      pdfX * zoom;


    offsetY =
      y -
      pdfY * zoom;


    applyZoom();


    return;

  }


  /*
   * Sudah zoom.
   */

  const pdfX =
    (x-offsetX)/zoom;

  const pdfY =
    (y-offsetY)/zoom;


  zoom =
    Math.max(
      1,
      Math.min(
        3,
        newZoom
      )
    );


  if(zoom<=1){

    exitZoom();

    return;

  }


  offsetX =
    x-pdfX*zoom;

  offsetY =
    y-pdfY*zoom;


  applyZoom();

}


/* =====================================================
   NORMAL PAGE LIST
===================================================== */

function normalPagesList(){

  return normalPages.querySelectorAll(
    ".normalPage"
  );

}


/* =====================================================
   ZOOM IN
===================================================== */

async function zoomIn(){

  const rect =
    zoomViewport.getBoundingClientRect();


  const x =
    rect.width/2;

  const y =
    rect.height/2;


  await zoomAt(
    zoom<=1
      ? 1.25
      : zoom+0.25,
    x,
    y
  );


  show(
    Math.round(zoom*100)+"%"
  );

}


/* =====================================================
   ZOOM OUT
===================================================== */

function zoomOut(){

  if(zoom<=1){

    show("100%");

    return;

  }


  const rect =
    zoomViewport.getBoundingClientRect();


  const x =
    rect.width/2;

  const y =
    rect.height/2;


  const next =
    zoom-0.25;


  if(next<=1){

    exitZoom();

    show("100%");

    return;

  }


  zoomAt(
    next,
    x,
    y
  );


  show(
    Math.round(next*100)+"%"
  );

}


/* =====================================================
   DARK
===================================================== */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );


  const isDark =
    document.body.classList.contains(
      "dark"
    );


  localStorage.setItem(
    "darkMode",
    isDark ? "1" : "0"
  );

}


if(
  localStorage.getItem(
    "darkMode"
  )==="1"
){

  document.body.classList.add(
    "dark"
  );

}


/* =====================================================
   THUMB
===================================================== */

function toggleThumbs(){

  thumbs.classList.toggle(
    "show"
  );

}


/* =====================================================
   GO PAGE
===================================================== */

function goToPage(pageNumber){

  if(zoom<=1){

    const pages =
      normalPagesList();


    const page =
      pages[pageNumber-1];


    if(page){

      window.scrollTo({

        top:page.offsetTop,

        behavior:"smooth"

      });

    }


    return;

  }


  const pages =
    zoomPages.querySelectorAll(
      ".zoomPage"
    );


  const page =
    pages[pageNumber-1];


  if(page){

    offsetY =
      -page.offsetTop * zoom;

    applyZoom();

  }

}


/* =====================================================
   BOOKMARK SAVE
===================================================== */

function saveBookmark(){

  const data={

    page:getCurrentPage(),

    scrollY:window.scrollY,

    zoom:zoom,

    offsetX:offsetX,

    offsetY:offsetY

  };


  localStorage.setItem(

    "bookmark_"+comic,

    JSON.stringify(data)

  );


  show(
    "Bookmark tersimpan"
  );

}


/* =====================================================
   BOOKMARK LOAD
===================================================== */

async function loadBookmark(){

  const saved =
    localStorage.getItem(
      "bookmark_"+comic
    );


  if(!saved){

    return;

  }


  try{

    const data =
      JSON.parse(saved);


    /*
     * Normal bookmark.
     */

    if(
      data &&
      data.zoom &&
      data.zoom>1
    ){

      /*
       * Untuk keamanan,
       * masuk ke halaman terlebih dahulu.
       */

      if(
        data.page &&
        data.page>1
      ){

        const pages =
          normalPagesList();


        const page =
          pages[data.page-1];


        if(page){

          window.scrollTo(
            0,
            page.offsetTop
          );

        }

      }


      /*
       * Build zoom.
       */

      await enterZoom();


      zoom =
        Math.max(
          1,
          Math.min(
            3,
            Number(data.zoom)
          )
        );


      offsetX =
        Number(data.offsetX)||0;

      offsetY =
        Number(data.offsetY)||0;


      applyZoom();


      return;

    }


    /*
     * Bookmark normal.
     */

    if(
      data &&
      typeof data.scrollY==="number"
    ){

      setTimeout(()=>{

        window.scrollTo(
          0,
          data.scrollY
        );

      },100);

    }

  }catch(e){

    console.log(
      "Bookmark error:",
      e
    );

  }

}


/* =====================================================
   FULLSCREEN
===================================================== */

async function goFull(){

  /*
   * Sudah fullscreen?
   */

  if(
    document.fullscreenElement ||
    document.webkitFullscreenElement
  ){

    try{

      if(
        document.exitFullscreen
      ){

        await document.exitFullscreen();

      }else if(
        document.webkitExitFullscreen
      ){

        document.webkitExitFullscreen();

      }

    }catch(e){}

    return;

  }


  /*
   * Chrome / Edge / Firefox / desktop
   */

  try{

    if(
      document.documentElement.requestFullscreen
    ){

      await document.documentElement
        .requestFullscreen();

      show("Fullscreen");

      return;

    }

  }catch(e){}


  /*
   * Safari / beberapa browser Apple
   */

  try{

    if(
      document.documentElement.webkitRequestFullscreen
    ){

      document.documentElement
        .webkitRequestFullscreen();

      show("Fullscreen");

      return;

    }

  }catch(e){}


  /*
   * Browser HP tertentu tidak mengizinkan
   * fullscreen dari JavaScript.
   */

  show(
    "Fullscreen tidak didukung browser"
  );

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

  if(zoom<=1){

    const doc =
      document.documentElement;


    const max =
      doc.scrollHeight -
      doc.clientHeight;


    const value =
      max>0
        ? doc.scrollTop/max*100
        : 0;


    bar.style.width =
      value+"%";


    return;

  }


  const height =
    zoomPages.offsetHeight*zoom;


  const visible =
    zoomViewport.clientHeight;


  const max =
    Math.max(
      0,
      height-visible
    );


  const current =
    Math.max(
      0,
      Math.min(
        max,
        -offsetY
      )
    );


  const value =
    max>0
      ? current/max*100
      : 0;


  bar.style.width =
    value+"%";

}


/* =====================================================
   NORMAL SCROLL
===================================================== */

window.addEventListener(
  "scroll",
  ()=>{
    if(zoom<=1){
      updateProgress();
    }
  },
  {
    passive:true
  }
);


/* =====================================================
   TOUCH DISTANCE
===================================================== */

function distance(a,b){

  return Math.hypot(

    a.clientX-b.clientX,

    a.clientY-b.clientY

  );

}


/* =====================================================
   TOUCH CENTER
===================================================== */

function center(a,b){

  return {

    x:
      (a.clientX+b.clientX)/2,

    y:
      (a.clientY+b.clientY)/2

  };

}


/* =====================================================
   TOUCH START
===================================================== */

zoomViewport.addEventListener(
  "touchstart",
  async e=>{

    if(
      e.touches.length===2
    ){

      if(zoom<=1){

        await enterZoom();

      }


      pinching=true;
      panning=false;


      pinchStartDistance =
        distance(
          e.touches[0],
          e.touches[1]
        );


      pinchStartZoom=zoom;


      const c =
        center(
          e.touches[0],
          e.touches[1]
        );


      pinchPdfX =
        (c.x-offsetX)/zoom;


      pinchPdfY =
        (c.y-offsetY)/zoom;


      lastTap=0;


      e.preventDefault();


      return;

    }


    if(
      e.touches.length===1 &&
      zoom>1
    ){

      panning=true;


      panStartX =
        e.touches[0].clientX;

      panStartY =
        e.touches[0].clientY;


      panStartOffsetX =
        offsetX;

      panStartOffsetY =
        offsetY;


      lastTap=0;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH MOVE
===================================================== */

zoomViewport.addEventListener(
  "touchmove",
  e=>{

    /*
     * PINCH
     */

    if(
      pinching &&
      e.touches.length===2
    ){

      e.preventDefault();


      const d =
        distance(
          e.touches[0],
          e.touches[1]
        );


      if(
        pinchStartDistance<=0
      ){

        return;

      }


      const c =
        center(
          e.touches[0],
          e.touches[1]
        );


      zoom =
        Math.max(
          1.01,
          Math.min(
            3,
            pinchStartZoom *
            d /
            pinchStartDistance
          )
        );


      offsetX =
        c.x -
        pinchPdfX*zoom;


      offsetY =
        c.y -
        pinchPdfY*zoom;


      applyZoom();


      return;

    }


    /*
     * PAN
     */

    if(
      panning &&
      e.touches.length===1 &&
      zoom>1
    ){

      e.preventDefault();


      offsetX =
        panStartOffsetX +
        (
          e.touches[0].clientX-
          panStartX
        );


      offsetY =
        panStartOffsetY +
        (
          e.touches[0].clientY-
          panStartY
        );


      applyZoom();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH END
===================================================== */

zoomViewport.addEventListener(
  "touchend",
  async e=>{

    if(pinching){

      if(
        e.touches.length<2
      ){

        pinching=false;

        pinchStartDistance=0;


        show(
          Math.round(
            zoom*100
          )+"%"
        );

      }


      return;

    }


    if(panning){

      panning=false;

      return;

    }


    /*
     * DOUBLE TAP
     */

    if(
      e.changedTouches.length!==1
    ){

      return;

    }


    const now=Date.now();


    if(
      now-lastTap<300
    ){

      const t =
        e.changedTouches[0];


      const rect =
        zoomViewport
          .getBoundingClientRect();


      if(zoom<=1){

        await zoomAt(
          2,
          t.clientX-rect.left,
          t.clientY-rect.top
        );

        show("200%");

      }else{

        exitZoom();

        show("100%");

      }


      lastTap=0;

    }else{

      lastTap=now;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   MOUSE PAN
===================================================== */

zoomViewport.addEventListener(
  "mousedown",
  e=>{

    if(
      zoom<=1 ||
      e.button!==0
    ){

      return;

    }


    mouseDown=true;


    mouseStartX=e.clientX;
    mouseStartY=e.clientY;


    mouseStartOffsetX=offsetX;
    mouseStartOffsetY=offsetY;


    zoomViewport.style.cursor=
      "grabbing";

  }
);


window.addEventListener(
  "mousemove",
  e=>{

    if(
      !mouseDown ||
      zoom<=1
    ){

      return;

    }


    offsetX =
      mouseStartOffsetX +
      e.clientX -
      mouseStartX;


    offsetY =
      mouseStartOffsetY +
      e.clientY -
      mouseStartY;


    applyZoom();

  }
);


window.addEventListener(
  "mouseup",
  ()=>{

    mouseDown=false;

    zoomViewport.style.cursor=
      "default";

  }
);


/* =====================================================
   WHEEL ZOOM
===================================================== */

zoomViewport.addEventListener(
  "wheel",
  e=>{

    if(!e.ctrlKey){

      return;

    }


    e.preventDefault();


    const rect =
      zoomViewport
        .getBoundingClientRect();


    const x =
      e.clientX-rect.left;

    const y =
      e.clientY-rect.top;


    zoomAt(
      zoom+
      (
        e.deltaY<0
          ? .1
          : -.1
      ),
      x,
      y
    );

  },
  {
    passive:false
  }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      zoom>1
    ){

      const amount=60;


      if(e.key==="ArrowLeft"){

        offsetX+=amount;

        applyZoom();

        e.preventDefault();

      }


      if(e.key==="ArrowRight"){

        offsetX-=amount;

        applyZoom();

        e.preventDefault();

      }


      if(e.key==="ArrowUp"){

        offsetY+=amount;

        applyZoom();

        e.preventDefault();

      }


      if(e.key==="ArrowDown"){

        offsetY-=amount;

        applyZoom();

        e.preventDefault();

      }

    }


    /*
     * Blok print/save shortcut.
     */

    if(
      (e.ctrlKey||e.metaKey) &&
      ["p","s"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{

    if(zoom>1){

      limitOffset();

      applyZoom();

    }else{

      updateProgress();

    }

  }
);


/* =====================================================
   BUTTON EVENTS
===================================================== */

document
  .getElementById("zoomInBtn")
  .addEventListener(
    "click",
    zoomIn
  );


document
  .getElementById("zoomOutBtn")
  .addEventListener(
    "click",
    zoomOut
  );


document
  .getElementById("darkBtn")
  .addEventListener(
    "click",
    toggleDark
  );


document
  .getElementById("bookmarkBtn")
  .addEventListener(
    "click",
    saveBookmark
  );


document
  .getElementById("fullscreenBtn")
  .addEventListener(
    "click",
    goFull
  );


document
  .getElementById("thumbBtn")
  .addEventListener(
    "click",
    toggleThumbs
  );


/* =====================================================
   FULLSCREEN CHANGE
===================================================== */

document.addEventListener(
  "fullscreenchange",
  updateProgress
);

document.addEventListener(
  "webkitfullscreenchange",
  updateProgress
);


/* =====================================================
   INITIAL
===================================================== */

updateProgress();


/*
 * Tunggu rendering selesai,
 * kemudian ambil bookmark.
 */

setTimeout(
  loadBookmark,
  300
);

</script>
