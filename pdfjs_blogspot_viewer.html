<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               viewport-fit=cover">

<title>PDF Reader</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;

  background:#0b0b0b;
  color:#fff;

  font-family:Arial,sans-serif;

  overflow-x:hidden;
  overflow-y:auto;

  -webkit-overflow-scrolling:touch;
}


/* =====================================================
   TOOLBAR
   ===================================================== */

#top{
  position:fixed;

  top:0;
  left:0;
  right:0;

  height:56px;

  background:#111;

  display:flex;
  justify-content:flex-end;
  align-items:center;

  gap:8px;

  padding:8px 12px;

  z-index:10000;
}

.btn{
  width:40px;
  height:40px;

  border:none;
  border-radius:8px;

  background:#2563EB;

  color:#fff;

  font-size:18px;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   PROGRESS
   ===================================================== */

#progress{
  position:fixed;

  top:56px;
  left:0;
  right:0;

  height:3px;

  background:#222;

  z-index:9999;
}

#bar{
  width:0;
  height:100%;

  background:#60A5FA;
}


/* =====================================================
   NORMAL VIEWPORT
   ===================================================== */

#viewport{

  position:relative;

  width:100%;

  margin-top:59px;

  min-height:calc(100vh - 59px);

  overflow:visible;

  background:#0b0b0b;

  /*
   * PENTING:
   * Pada 100% browser boleh scroll.
   */

  touch-action:pan-y;
}


/* =====================================================
   DOCUMENT
   ===================================================== */

#document{

  position:relative;

  width:100%;
  max-width:780px;

  margin:0 auto;

  transform:none;

  transform-origin:top left;

}


/* =====================================================
   CANVAS
   ===================================================== */

#document canvas{

  display:block;

  width:100%;
  height:auto;

  background:#fff;

  margin-bottom:2px;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;
}


/* =====================================================
   ZOOM MODE
   ===================================================== */

body.zoom-mode{
  overflow:hidden;
}


body.zoom-mode #viewport{

  position:fixed;

  top:59px;
  left:0;
  right:0;
  bottom:0;

  width:auto;
  height:auto;

  margin:0;

  min-height:0;

  overflow:hidden;

  /*
   * Gesture kita yang tangani.
   */

  touch-action:none;

}


body.zoom-mode #document{

  position:absolute;

  top:0;
  left:0;

  width:780px;
  max-width:none;

  margin:0;

  transform-origin:top left;

  will-change:transform;

}


/* =====================================================
   DARK MODE
   ===================================================== */

.dark #document canvas{
  filter:invert(1) hue-rotate(180deg);
}


/* =====================================================
   THUMBNAILS
   ===================================================== */

#thumbs{

  position:fixed;

  top:70px;
  right:-140px;

  width:130px;

  height:calc(100vh - 90px);

  padding:6px;

  background:#111;

  border-left:1px solid #333;

  overflow-y:auto;

  transition:.25s;

  z-index:10001;

  -webkit-overflow-scrolling:touch;
}

#thumbs.show{
  right:0;
}

.thumb{

  display:block;

  width:100%;

  height:auto;

  margin-bottom:6px;

  border:1px solid #333;

  border-radius:4px;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;
}


/* =====================================================
   THUMB BUTTON
   ===================================================== */

#thumbBtn{

  position:fixed;

  right:14px;
  bottom:18px;

  width:52px;
  height:52px;

  border:none;
  border-radius:50%;

  background:#2563EB;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  z-index:10002;

  touch-action:manipulation;

}


/* =====================================================
   TOAST
   ===================================================== */

#toast{

  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  padding:10px 16px;

  background:#111;

  color:#fff;

  border-radius:20px;

  display:none;

  z-index:10003;

  white-space:nowrap;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

  #top{

    height:52px;

    padding:6px 8px;

    gap:6px;

  }

  .btn{

    width:38px;
    height:38px;

    font-size:17px;

  }

  #progress{
    top:52px;
  }

  #viewport{

    margin-top:55px;

    min-height:calc(100vh - 55px);

  }

  body.zoom-mode #viewport{

    top:55px;

  }

}


/* =====================================================
   SMALL PHONE
   ===================================================== */

@media(max-width:380px){

  #top{

    gap:4px;

    padding-left:5px;
    padding-right:5px;

  }

  .btn{

    width:36px;
    height:36px;

    font-size:16px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     TOOLBAR
     ===================================================== -->

<div id="top">

  <button class="btn"
          onclick="zoomOut()">
    −
  </button>

  <button class="btn"
          onclick="zoomIn()">
    +
  </button>

  <button class="btn"
          onclick="toggleDark()">
    🌙
  </button>

  <button class="btn"
          onclick="saveBookmark()">
    🔖
  </button>

  <button class="btn"
          onclick="goFull()">
    ⛶
  </button>

</div>


<!-- =====================================================
     PROGRESS
     ===================================================== -->

<div id="progress">
  <div id="bar"></div>
</div>


<!-- =====================================================
     VIEWPORT
     ===================================================== -->

<div id="viewport">

  <div id="document"></div>

</div>


<!-- =====================================================
     THUMBNAILS
     ===================================================== -->

<div id="thumbs"></div>


<button id="thumbBtn"
        onclick="toggleThumbs()">
  ☰
</button>


<div id="toast"></div>



<!-- =====================================================
     PDF.JS
     ===================================================== -->

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";


/* =====================================================
   PDF NAME
   ===================================================== */

const comic =
new URLSearchParams(location.search).get("comic")
|| "Dwikora.pdf";


/* =====================================================
   ELEMENT
   ===================================================== */

const documentLayer =
document.getElementById("document");

const thumbs =
document.getElementById("thumbs");


/* =====================================================
   LOAD PDF
   ===================================================== */

const pdf =
await pdfjsLib.getDocument(comic).promise;


/* =====================================================
   RENDER PDF
   ===================================================== */

for(
  let i=1;
  i<=pdf.numPages;
  i++
){

  const page =
  await pdf.getPage(i);


  /* =================================================
     MAIN PAGE
     ================================================= */

  const viewport =
  page.getViewport({
    scale:1.6
  });


  const canvas =
  document.createElement("canvas");


  canvas.width =
  viewport.width;


  canvas.height =
  viewport.height;


  await page.render({

    canvasContext:
      canvas.getContext("2d"),

    viewport:
      viewport

  }).promise;


  /*
   * Simpan nomor halaman.
   */

  canvas.dataset.page=i;


  documentLayer.appendChild(
    canvas
  );


  /* =================================================
     THUMBNAIL
     ================================================= */

  const thumbViewport =
  page.getViewport({
    scale:.22
  });


  const thumb =
  document.createElement("canvas");


  thumb.width =
  thumbViewport.width;


  thumb.height =
  thumbViewport.height;


  await page.render({

    canvasContext:
      thumb.getContext("2d"),

    viewport:
      thumbViewport

  }).promise;


  thumb.className="thumb";


  thumb.dataset.page=i;


  thumb.onclick=()=>{

    goToPage(i);

    thumbs.classList.remove(
      "show"
    );

  };


  thumbs.appendChild(
    thumb
  );

}


/* =====================================================
   BOOKMARK LAMA
   ===================================================== */

const saved =
localStorage.getItem(
  "bm_"+comic
);


if(saved){

  try{

    const data =
    JSON.parse(saved);


    if(
      data &&
      typeof data.scrollY==="number"
    ){

      setTimeout(()=>{

        window.scrollTo(
          0,
          data.scrollY
        );

      },200);

    }else if(
      typeof data==="number"
    ){

      setTimeout(()=>{

        window.scrollTo(
          0,
          data
        );

      },200);

    }

  }catch(e){

    setTimeout(()=>{

      window.scrollTo(
        0,
        Number(saved)
      );

    },200);

  }

}

</script>



<!-- =====================================================
     READER ENGINE
     ===================================================== -->

<script>

/* =====================================================
   STATE
   ===================================================== */

let zoom=1;


/*
 * Posisi document saat zoom.
 */

let panX=0;
let panY=0;


/*
 * Posisi browser sebelum masuk zoom.
 */

let savedScrollX=0;
let savedScrollY=0;


/*
 * Posisi halaman yang sedang dibaca.
 */

let savedPage=1;

let savedPageOffset=0;


/*
 * Touch state.
 */

let isPinching=false;

let isPanning=false;


/*
 * Pinch.
 */

let pinchStartDistance=0;

let pinchStartZoom=1;


/*
 * Pan.
 */

let panStartX=0;

let panStartY=0;

let panOriginX=0;

let panOriginY=0;


/*
 * Double tap.
 */

let lastTap=0;


/*
 * Mouse.
 */

let mouseDown=false;

let mouseStartX=0;

let mouseStartY=0;

let mouseOriginX=0;

let mouseOriginY=0;


/* =====================================================
   ELEMENT
   ===================================================== */

const viewport =
document.getElementById(
  "viewport"
);

const documentLayer =
document.getElementById(
  "document"
);

const toast =
document.getElementById(
  "toast"
);


/* =====================================================
   TOAST
   ===================================================== */

function show(text){

  toast.innerText=text;

  toast.style.display="block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer=
  setTimeout(()=>{

    toast.style.display="none";

  },900);

}


/* =====================================================
   GET CURRENT PAGE
   ===================================================== */

function getCurrentPage(){

  const canvases =
    documentLayer.querySelectorAll(
      "canvas"
    );


  if(!canvases.length){

    return {
      page:1,
      offset:0
    };

  }


  const currentScroll =
    window.scrollY;


  let currentPage=1;

  let bestDistance=Infinity;

  let bestOffset=0;


  canvases.forEach(
    (canvas,index)=>{

      const top =
        canvas.offsetTop;


      const distance =
        Math.abs(
          top-currentScroll
        );


      if(distance<bestDistance){

        bestDistance=distance;

        currentPage=index+1;

        bestOffset=
          currentScroll-top;

      }

    }
  );


  return {

    page:currentPage,

    offset:bestOffset

  };

}


/* =====================================================
   SAVE CURRENT READING POSITION
   ===================================================== */

function rememberReadingPosition(){

  const current =
    getCurrentPage();


  savedPage=
    current.page;


  savedPageOffset=
    current.offset;


  savedScrollY=
    window.scrollY ||
    document.documentElement.scrollTop ||
    0;


  savedScrollX=
    window.scrollX ||
    document.documentElement.scrollLeft ||
    0;

}


/* =====================================================
   ENTER ZOOM
   ===================================================== */

function enterZoom(){

  if(zoom<=1){

    return;

  }


  /*
   * Sudah zoom?
   */

  if(
    !document.body.classList.contains(
      "zoom-mode"
    )
  ){

    /*
     * Simpan posisi browser.
     */

    rememberReadingPosition();

  }


  document.body.classList.add(
    "zoom-mode"
  );


  apply();

}


/* =====================================================
   EXIT ZOOM
   ===================================================== */

function exitZoom(){

  /*
   * Simpan halaman yang sedang
   * dilihat sebelum keluar.
   */

  const currentPage =
    savedPage;


  const currentOffset =
    savedPageOffset;


  /*
   * Matikan mode zoom.
   */

  document.body.classList.remove(
    "zoom-mode"
  );


  /*
   * Hapus transform.
   */

  documentLayer.style.transform=
    "none";


  /*
   * Reset posisi custom.
   */

  panX=0;

  panY=0;


  /*
   * Kembali 100%.
   */

  zoom=1;


  /*
   * Tunggu browser mengembalikan
   * layout normal.
   */

  requestAnimationFrame(()=>{

    requestAnimationFrame(()=>{

      const canvases =
        documentLayer.querySelectorAll(
          "canvas"
        );


      const page =
        canvases[currentPage-1];


      if(page){

        const pageTop =
          page.offsetTop;


        window.scrollTo(

          savedScrollX,

          pageTop+
          currentOffset

        );

      }else{

        window.scrollTo(
          savedScrollX,
          savedScrollY
        );

      }


      updateProgress();

    });

  });

}


/* =====================================================
   GET DOCUMENT SIZE
   ===================================================== */

function getDocumentSize(){

  return {

    width:
      documentLayer.offsetWidth*
      zoom,

    height:
      documentLayer.offsetHeight*
      zoom

  };

}


/* =====================================================
   LIMIT PAN
   ===================================================== */

function limitPan(){

  const vw =
    viewport.clientWidth;


  const vh =
    viewport.clientHeight;


  const size =
    getDocumentSize();


  /*
   * HORIZONTAL
   */

  if(
    size.width<=vw
  ){

    panX=
      (vw-size.width)/2;

  }else{

    const minX=
      vw-size.width;


    panX=
      Math.min(
        0,
        Math.max(
          minX,
          panX
        )
      );

  }


  /*
   * VERTICAL
   */

  if(
    size.height<=vh
  ){

    panY=
      (vh-size.height)/2;

  }else{

    const minY=
      vh-size.height;


    panY=
      Math.min(
        0,
        Math.max(
          minY,
          panY
        )
      );

  }

}


/* =====================================================
   APPLY
   ===================================================== */

function apply(){

  if(zoom<=1){

    document.body.classList.remove(
      "zoom-mode"
    );


    documentLayer.style.transform=
      "none";


    return;

  }


  document.body.classList.add(
    "zoom-mode"
  );


  limitPan();


  documentLayer.style.transform=
    "translate3d("+
    panX+"px,"+
    panY+"px,0) "+
    "scale("+zoom+")";


  updateProgress();

}


/* =====================================================
   ZOOM AROUND POINT
   ===================================================== */

function zoomAround(
  newZoom,
  x,
  y
){

  const oldZoom=
    zoom;


  newZoom=
    Math.max(
      1,
      Math.min(
        3,
        newZoom
      )
    );


  /*
   * Kalau baru mulai zoom,
   * simpan posisi browser.
   */

  if(oldZoom<=1){

    rememberReadingPosition();


    panX=0;

    panY=0;

  }


  /*
   * Titik dokumen yang berada
   * di bawah jari/mouse.
   */

  const contentX=
    (x-panX)/
    oldZoom;


  const contentY=
    (y-panY)/
    oldZoom;


  zoom=newZoom;


  /*
   * Pertahankan titik tersebut.
   */

  panX=
    x-
    contentX*zoom;


  panY=
    y-
    contentY*zoom;


  apply();

}


/* =====================================================
   ZOOM IN
   ===================================================== */

function zoomIn(){

  const x=
    viewport.clientWidth/2;


  const y=
    viewport.clientHeight/2;


  zoomAround(
    zoom+0.2,
    x,
    y
  );


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* =====================================================
   ZOOM OUT
   ===================================================== */

function zoomOut(){

  if(zoom<=1){

    return;

  }


  const x=
    viewport.clientWidth/2;


  const y=
    viewport.clientHeight/2;


  const newZoom=
    Math.max(
      1,
      zoom-0.2
    );


  if(newZoom<=1){

    exitZoom();

    show("100%");

    return;

  }


  zoomAround(
    newZoom,
    x,
    y
  );


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* =====================================================
   DARK MODE
   ===================================================== */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );

}


/* =====================================================
   THUMBNAILS
   ===================================================== */

function toggleThumbs(){

  document
    .getElementById("thumbs")
    .classList.toggle(
      "show"
    );

}


/* =====================================================
   GO TO PAGE
   ===================================================== */

function goToPage(pageNumber){

  const canvases =
    documentLayer.querySelectorAll(
      "canvas"
    );


  const page =
    canvases[pageNumber-1];


  if(!page){

    return;

  }


  /*
   * Kalau normal,
   * pakai scroll browser.
   */

  if(zoom<=1){

    page.scrollIntoView({

      behavior:"smooth",

      block:"start"

    });


    return;

  }


  /*
   * Kalau zoom,
   * pindahkan pan vertikal.
   */

  panY=
    -page.offsetTop*zoom;


  apply();

}


/* =====================================================
   BOOKMARK
   ===================================================== */

function saveBookmark(){

  if(zoom<=1){

    localStorage.setItem(

      "bm_"+comic,

      JSON.stringify({

        scrollY:
          window.scrollY,

        page:
          getCurrentPage().page,

        offset:
          getCurrentPage().offset

      })

    );


  }else{

    localStorage.setItem(

      "bm_"+comic,

      JSON.stringify({

        zoom:zoom,

        panX:panX,

        panY:panY,

        page:savedPage,

        offset:savedPageOffset,

        scrollY:savedScrollY

      })

    );

  }


  show(
    "Bookmark tersimpan"
  );

}


/* =====================================================
   FULLSCREEN
   ===================================================== */

function goFull(){

  if(
    !document.fullscreenElement
  ){

    document.documentElement
      .requestFullscreen()
      .catch(()=>{});

  }else{

    document.exitFullscreen();

  }

}


/* =====================================================
   PROGRESS
   ===================================================== */

function updateProgress(){

  /*
   * NORMAL
   */

  if(zoom<=1){

    const doc=
      document.documentElement;


    const max=
      doc.scrollHeight-
      doc.clientHeight;


    const percent=
      max>0
      ? doc.scrollTop/max*100
      : 0;


    document
      .getElementById("bar")
      .style.width=
      percent+"%";


    return;

  }


  /*
   * ZOOM
   */

  const size=
    getDocumentSize();


  const maxY=
    Math.max(
      0,
      size.height-
      viewport.clientHeight
    );


  const current=
    Math.max(
      0,
      Math.min(
        maxY,
        -panY
      )
    );


  const percent=
    maxY>0
    ? current/maxY*100
    : 0;


  document
    .getElementById("bar")
    .style.width=
    percent+"%";

}


/* =====================================================
   NORMAL SCROLL
   ===================================================== */

window.addEventListener(
  "scroll",
  function(){

    if(zoom<=1){

      updateProgress();

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   TOUCH DISTANCE
   ===================================================== */

function getDistance(a,b){

  return Math.hypot(

    a.clientX-
    b.clientX,

    a.clientY-
    b.clientY

  );

}


/* =====================================================
   TOUCH CENTER
   ===================================================== */

function getCenter(a,b){

  return {

    x:
      (
        a.clientX+
        b.clientX
      )/2,

    y:
      (
        a.clientY+
        b.clientY
      )/2

  };

}


/* =====================================================
   TOUCH START
   ===================================================== */

viewport.addEventListener(
  "touchstart",
  function(e){

    /*
     * ----------------------------------------------
     * DUA JARI = PINCH
     * ----------------------------------------------
     */

    if(
      e.touches.length===2
    ){

      /*
       * Kalau mulai pinch dari 100%,
       * simpan posisi halaman dulu.
       */

      if(zoom<=1){

        rememberReadingPosition();

      }


      isPinching=true;

      isPanning=false;


      pinchStartDistance=
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      pinchStartZoom=
        zoom;


      lastTap=0;


      return;

    }


    /*
     * ----------------------------------------------
     * SATU JARI SAAT ZOOM
     * ----------------------------------------------
     */

    if(
      e.touches.length===1 &&
      zoom>1
    ){

      isPanning=true;


      panStartX=
        e.touches[0].clientX;


      panStartY=
        e.touches[0].clientY;


      panOriginX=
        panX;


      panOriginY=
        panY;


      lastTap=0;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH MOVE
   ===================================================== */

viewport.addEventListener(
  "touchmove",
  function(e){

    /*
     * ==============================================
     * PINCH
     * ==============================================
     */

    if(
      isPinching &&
      e.touches.length===2
    ){

      e.preventDefault();


      const currentDistance=
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      if(
        pinchStartDistance<=0
      ){

        return;

      }


      const center=
        getCenter(
          e.touches[0],
          e.touches[1]
        );


      const factor=
        currentDistance/
        pinchStartDistance;


      let newZoom=
        pinchStartZoom*
        factor;


      newZoom=
        Math.max(
          1,
          Math.min(
            3,
            newZoom
          )
        );


      /*
       * Kalau mulai dari 100%,
       * gunakan titik tengah jari.
       */

      zoomAround(
        newZoom,
        center.x,
        center.y
      );


      return;

    }


    /*
     * ==============================================
     * PAN
     * ==============================================
     */

    if(
      isPanning &&
      e.touches.length===1 &&
      zoom>1
    ){

      e.preventDefault();


      const dx=
        e.touches[0].clientX-
        panStartX;


      const dy=
        e.touches[0].clientY-
        panStartY;


      panX=
        panOriginX+
        dx;


      panY=
        panOriginY+
        dy;


      apply();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH END
   ===================================================== */

viewport.addEventListener(
  "touchend",
  function(e){

    /*
     * ==============================================
     * PINCH
     * ==============================================
     */

    if(isPinching){

      if(
        e.touches.length<2
      ){

        isPinching=false;

        pinchStartDistance=0;


        /*
         * Jangan reset zoom.
         */

        if(zoom>1){

          enterZoom();

          show(
            Math.round(
              zoom*100
            )+"%"
          );

        }

      }


      return;

    }


    /*
     * ==============================================
     * PAN
     * ==============================================
     */

    if(isPanning){

      isPanning=false;

      return;

    }


    /*
     * ==============================================
     * DOUBLE TAP
     * ==============================================
     */

    if(
      e.changedTouches.length!==1
    ){

      lastTap=0;

      return;

    }


    const now=
      Date.now();


    if(
      now-lastTap<300
    ){

      const touch=
        e.changedTouches[0];


      const rect=
        viewport.getBoundingClientRect();


      const x=
        touch.clientX-
        rect.left;


      const y=
        touch.clientY-
        rect.top;


      if(zoom<=1){

        zoomAround(
          2,
          x,
          y
        );


      }else{

        exitZoom();

      }


      lastTap=0;


    }else{

      lastTap=now;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   MOUSE DRAG DESKTOP
   ===================================================== */

viewport.addEventListener(
  "mousedown",
  function(e){

    if(zoom<=1){

      return;

    }


    if(e.button!==0){

      return;

    }


    mouseDown=true;


    mouseStartX=
      e.clientX;


    mouseStartY=
      e.clientY;


    mouseOriginX=
      panX;


    mouseOriginY=
      panY;


    viewport.style.cursor=
      "grabbing";

  }
);


window.addEventListener(
  "mousemove",
  function(e){

    if(
      !mouseDown ||
      zoom<=1
    ){

      return;

    }


    panX=
      mouseOriginX+
      (
        e.clientX-
        mouseStartX
      );


    panY=
      mouseOriginY+
      (
        e.clientY-
        mouseStartY
      );


    apply();

  }
);


window.addEventListener(
  "mouseup",
  function(){

    if(mouseDown){

      mouseDown=false;

      viewport.style.cursor=
        "default";

    }

  }
);


/* =====================================================
   CTRL + MOUSE WHEEL ZOOM
   ===================================================== */

viewport.addEventListener(
  "wheel",
  function(e){

    if(!e.ctrlKey){

      return;

    }


    e.preventDefault();


    const rect=
      viewport.getBoundingClientRect();


    const x=
      e.clientX-
      rect.left;


    const y=
      e.clientY-
      rect.top;


    const amount=
      e.deltaY<0
      ? 0.1
      : -0.1;


    const newZoom=
      zoom+amount;


    if(newZoom<=1){

      exitZoom();

      return;

    }


    zoomAround(
      newZoom,
      x,
      y
    );


    show(
      Math.round(
        zoom*100
      )+"%"

    );

  },
  {
    passive:false
  }
);


/* =====================================================
   KEYBOARD PAN
   ===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(zoom>1){

      const amount=50;


      if(
        e.key==="ArrowLeft"
      ){

        panX+=amount;

        apply();

        e.preventDefault();

      }


      if(
        e.key==="ArrowRight"
      ){

        panX-=amount;

        apply();

        e.preventDefault();

      }


      if(
        e.key==="ArrowUp"
      ){

        panY+=amount;

        apply();

        e.preventDefault();

      }


      if(
        e.key==="ArrowDown"
      ){

        panY-=amount;

        apply();

        e.preventDefault();

      }

    }


    /*
     * Disable Ctrl+P / Ctrl+S.
     */

    if(
      (e.ctrlKey||e.metaKey) &&
      ["p","s"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }
);


/* =====================================================
   CONTEXT MENU
   ===================================================== */

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);


/* =====================================================
   DRAG
   ===================================================== */

document.addEventListener(
  "dragstart",
  function(e){

    e.preventDefault();

  }
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(zoom>1){

      limitPan();

      apply();

    }

  }
);


/* =====================================================
   INITIAL
   ===================================================== */

updateProgress();

</script>

</html>
