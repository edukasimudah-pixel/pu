<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>PDF Reader</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

/* ===== TOOLBAR ===== */
#top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:56px;
  background:#111;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  z-index:1000;
}

.btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:8px;
  background:#2563EB;
  color:#fff;
  font-size:18px;
  cursor:pointer;
  touch-action:manipulation;
}

/* ===== PROGRESS ===== */
#progress{
  position:fixed;
  top:56px;
  left:0;
  right:0;
  height:3px;
  background:#222;
  z-index:999;
}

#bar{
  width:0%;
  height:100%;
  background:#60A5FA;
}

/* ===== PDF ===== */
#viewer{
  max-width:780px;
  margin:59px auto 0;
  transform-origin:top center;
  touch-action:pan-y;
  will-change:transform;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:#fff;
  margin-bottom:2px;
  touch-action:none;
}

.dark canvas{
  filter:invert(1) hue-rotate(180deg);
}

/* ===== THUMB ===== */
#thumbs{
  position:fixed;
  right:-140px;
  top:70px;
  width:130px;
  height:calc(100vh - 90px);
  background:#111;
  overflow-y:auto;
  border-left:1px solid #333;
  transition:.25s;
  padding:6px;
  z-index:1001;
}

#thumbs.show{
  right:0;
}

.thumb{
  width:100%;
  display:block;
  margin-bottom:6px;
  border-radius:4px;
  border:1px solid #333;
  cursor:pointer;
  touch-action:manipulation;
}

#thumbBtn{
  position:fixed;
  right:14px;
  bottom:18px;
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#2563EB;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  z-index:1002;
  touch-action:manipulation;
}

/* ===== TOAST ===== */
#toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:10px 16px;
  border-radius:20px;
  display:none;
  z-index:1003;
  white-space:nowrap;
}

/* ===== HP ===== */
@media(max-width:600px){

  #top{
    height:52px;
    padding:6px 8px;
    gap:6px;
  }

  .btn{
    width:38px;
    height:38px;
    font-size:17px;
  }

  #progress{
    top:52px;
  }

  #viewer{
    margin-top:55px;
    max-width:none;
    width:100%;
  }
}
</style>
</head>

<body>

<div id="top">
  <button class="btn" onclick="zoomOut()">−</button>
  <button class="btn" onclick="zoomIn()">+</button>
  <button class="btn" onclick="toggleDark()">🌙</button>
  <button class="btn" onclick="saveBookmark()">🔖</button>
  <button class="btn" onclick="goFull()">⛶</button>
</div>

<div id="progress">
  <div id="bar"></div>
</div>

<div id="viewer"></div>

<div id="thumbs"></div>

<button id="thumbBtn" onclick="toggleThumbs()">☰</button>

<div id="toast"></div>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";


const comic =
new URLSearchParams(location.search).get("comic")
|| "Dwikora.pdf";


const pdf =
await pdfjsLib.getDocument(comic).promise;


const viewer =
document.getElementById("viewer");

const thumbs =
document.getElementById("thumbs");


for(let i=1;i<=pdf.numPages;i++){

  const page =
  await pdf.getPage(i);


  const vp =
  page.getViewport({scale:1.6});


  const canvas =
  document.createElement("canvas");

  canvas.width =
  vp.width;

  canvas.height =
  vp.height;


  await page.render({

    canvasContext:
    canvas.getContext("2d"),

    viewport:vp

  }).promise;


  viewer.appendChild(canvas);


  /* THUMBNAIL */

  const tv =
  page.getViewport({scale:.22});


  const thumb =
  document.createElement("canvas");

  thumb.width =
  tv.width;

  thumb.height =
  tv.height;


  await page.render({

    canvasContext:
    thumb.getContext("2d"),

    viewport:tv

  }).promise;


  thumb.className="thumb";


  thumb.onclick=()=>{

    canvas.scrollIntoView({
      behavior:"smooth"
    });

    thumbs.classList.remove("show");

  };


  thumbs.appendChild(thumb);

}


/* BOOKMARK */

const pos =
localStorage.getItem("bm_"+comic);

if(pos){

  window.scrollTo(
    0,
    Number(pos)
  );

}

</script>


<script>

/* ==========================================
   ZOOM
   ========================================== */

let zoom=1;

const viewer =
document.getElementById("viewer");

const toast =
document.getElementById("toast");


function show(text){

  toast.innerText=text;

  toast.style.display="block";

  clearTimeout(window.toastTimer);

  window.toastTimer=
  setTimeout(()=>{

    toast.style.display="none";

  },900);

}


/* APPLY ZOOM */

function apply(){

  viewer.style.transform=
  `scale(${zoom})`;

  viewer.style.marginBottom=
  ((zoom-1)*140)+"vh";

}


/* TOMBOL + */

function zoomIn(){

  zoom=
  Math.min(
    3,
    zoom+0.2
  );

  apply();

  show(
    Math.round(zoom*100)+"%"
  );

}


/* TOMBOL − */

function zoomOut(){

  zoom=
  Math.max(
    0.5,
    zoom-0.2
  );

  apply();

  show(
    Math.round(zoom*100)+"%"
  );

}


/* DARK MODE */

function toggleDark(){

  document.body.classList.toggle("dark");

}


/* THUMBNAIL */

function toggleThumbs(){

  document
  .getElementById("thumbs")
  .classList.toggle("show");

}


/* BOOKMARK */

function saveBookmark(){

  const comic=
  new URLSearchParams(location.search)
  .get("comic")
  || "Dwikora.pdf";

  localStorage.setItem(
    "bm_"+comic,
    window.scrollY
  );

  show("Bookmark");

}


/* FULLSCREEN */

function goFull(){

  if(!document.fullscreenElement){

    document.documentElement
    .requestFullscreen()
    .catch(()=>{});

  }else{

    document.exitFullscreen();

  }

}


/* ==========================================
   PROGRESS BAR
   ========================================== */

window.addEventListener(
  "scroll",
  ()=>{

    const h=
    document.documentElement;

    const max=
    h.scrollHeight-h.clientHeight;

    const p=
    max>0
    ? (h.scrollTop/max)*100
    : 0;

    document
    .getElementById("bar")
    .style.width=
    p+"%";

  },
  {passive:true}
);


/* ==========================================
   DOUBLE TAP
   ========================================== */

/*
   Double tap hanya berlaku untuk SATU jari.
   Jadi tidak bentrok dengan pinch zoom.
*/

let lastTap=0;

document.addEventListener(
  "touchend",
  function(e){

    /*
     * Kalau sebelumnya pinch,
     * jangan dianggap double tap.
     */

    if(wasPinching){

      wasPinching=false;

      lastTap=0;

      return;

    }


    /*
     * Hanya proses single-touch.
     */

    if(e.changedTouches.length!==1){

      lastTap=0;

      return;

    }


    const now=
    Date.now();


    if(
      now-lastTap<300
    ){

      zoom=
      zoom>1
      ? 1
      : 2;

      apply();

      show(
        Math.round(zoom*100)+"%"
      );

      lastTap=0;

    }else{

      lastTap=now;

    }

  },
  {passive:true}
);


/* ==========================================
   PINCH ZOOM
   ========================================== */

let pinchStart=0;

let pinchBase=1;

let isPinching=false;

let wasPinching=false;


function getDistance(a,b){

  return Math.hypot(

    a.clientX-b.clientX,

    a.clientY-b.clientY

  );

}


/* MULAI PINCH */

document.addEventListener(
  "touchstart",
  function(e){

    if(e.touches.length===2){

      isPinching=true;

      wasPinching=true;

      pinchStart=
      getDistance(
        e.touches[0],
        e.touches[1]
      );

      pinchBase=zoom;

      /*
       * Matikan double-tap sementara
       */

      lastTap=0;

    }

  },
  {passive:true}
);


/* GERAK PINCH */

document.addEventListener(
  "touchmove",
  function(e){

    if(
      e.touches.length===2 &&
      isPinching &&
      pinchStart>0
    ){

      const current=
      getDistance(
        e.touches[0],
        e.touches[1]
      );


      zoom=
      pinchBase*
      (current/pinchStart);


      zoom=
      Math.max(
        0.5,
        Math.min(3,zoom)
      );


      apply();

    }

  },
  {passive:true}
);


/* SELESAI PINCH */

document.addEventListener(
  "touchend",
  function(e){

    if(
      isPinching &&
      e.touches.length<2
    ){

      isPinching=false;

      pinchStart=0;

      /*
       * PENTING:
       * zoom TIDAK di-reset.
       */

      show(
        Math.round(zoom*100)+"%"
      );

    }

  },
  {passive:true}
);


/* ==========================================
   DISABLE CONTEXT MENU / DRAG
   ========================================== */

document.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

document.addEventListener(
  "dragstart",
  e=>e.preventDefault()
);


/* ==========================================
   DISABLE PRINT / SAVE
   ========================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(
      (e.ctrlKey||e.metaKey) &&
      ["p","s"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }
);

</script>

</body>
</html>
