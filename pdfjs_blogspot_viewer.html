<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               viewport-fit=cover">

<title>PDF Reader</title>

<style>

/* ==================================================
   RESET
================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;

  background:#0b0b0b;
  color:#fff;

  font-family:Arial,sans-serif;

  overflow-x:hidden;
  overflow-y:auto;

  -webkit-overflow-scrolling:touch;
}


/* ==================================================
   TOOLBAR
================================================== */

#top{
  position:fixed;

  top:0;
  left:0;
  right:0;

  height:56px;

  background:#111;

  display:flex;
  justify-content:flex-end;
  align-items:center;

  gap:8px;

  padding:8px 12px;

  z-index:10000;
}

.btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:8px;

  background:#2563EB;

  color:#fff;

  font-size:18px;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* ==================================================
   PROGRESS
================================================== */

#progress{
  position:fixed;

  top:56px;
  left:0;
  right:0;

  height:3px;

  background:#222;

  z-index:9999;
}

#bar{
  width:0;
  height:100%;

  background:#60A5FA;
}


/* ==================================================
   NORMAL MODE
================================================== */

#viewport{
  position:relative;

  width:100%;

  min-height:calc(100vh - 59px);

  margin-top:59px;

  overflow:visible;

  background:#0b0b0b;

  touch-action:pan-y;
}


/* ==================================================
   DOCUMENT NORMAL
================================================== */

#document{
  position:relative;

  width:100%;

  max-width:780px;

  margin:0 auto;

  transform:none;
}


/* ==================================================
   CANVAS
================================================== */

#document canvas{
  display:block;

  width:100%;
  height:auto;

  background:#fff;

  margin-bottom:2px;

  pointer-events:none;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}


/* ==================================================
   ZOOM MODE
================================================== */

body.zoom-mode{
  overflow:hidden;
}

body.zoom-mode #viewport{

  position:fixed;

  top:59px;
  left:0;
  right:0;
  bottom:0;

  width:auto;
  height:auto;

  margin:0;

  overflow:hidden;

  touch-action:none;

  z-index:10;
}

body.zoom-mode #document{

  position:absolute;

  top:0;
  left:0;

  width:780px;

  max-width:none;

  margin:0;

  transform-origin:top left;

  will-change:transform;
}


/* ==================================================
   DARK MODE
================================================== */

.dark #document canvas{
  filter:invert(1) hue-rotate(180deg);
}


/* ==================================================
   THUMBNAILS
================================================== */

#thumbs{

  position:fixed;

  top:70px;
  right:-140px;

  width:130px;

  height:calc(100vh - 90px);

  padding:6px;

  background:#111;

  border-left:1px solid #333;

  overflow-y:auto;

  transition:.25s;

  z-index:10001;

  -webkit-overflow-scrolling:touch;
}

#thumbs.show{
  right:0;
}

.thumb{

  display:block;

  width:100%;

  height:auto;

  margin-bottom:6px;

  border:1px solid #333;

  border-radius:4px;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;
}


/* ==================================================
   THUMB BUTTON
================================================== */

#thumbBtn{

  position:fixed;

  right:14px;
  bottom:18px;

  width:52px;
  height:52px;

  border:0;
  border-radius:50%;

  background:#2563EB;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  z-index:10002;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* ==================================================
   TOAST
================================================== */

#toast{

  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  padding:10px 16px;

  background:#111;

  color:#fff;

  border-radius:20px;

  display:none;

  z-index:10003;

  white-space:nowrap;
}


/* ==================================================
   MOBILE
================================================== */

@media(max-width:600px){

  #top{

    height:52px;

    padding:6px 8px;

    gap:6px;

  }

  .btn{

    width:38px;
    height:38px;

    font-size:17px;

  }

  #progress{
    top:52px;
  }

  #viewport{
    margin-top:55px;
  }

  body.zoom-mode #viewport{
    top:55px;
  }

}


/* ==================================================
   SMALL PHONE
================================================== */

@media(max-width:380px){

  #top{

    gap:4px;

    padding-left:5px;
    padding-right:5px;

  }

  .btn{

    width:36px;
    height:36px;

    font-size:16px;

  }

}

</style>
</head>


<body>


<!-- ==================================================
     TOOLBAR
================================================== -->

<div id="top">

  <button class="btn"
          onclick="zoomOut()">
    −
  </button>

  <button class="btn"
          onclick="zoomIn()">
    +
  </button>

  <button class="btn"
          onclick="toggleDark()">
    🌙
  </button>

  <button class="btn"
          onclick="saveBookmark()">
    🔖
  </button>

  <button class="btn"
          onclick="goFull()">
    ⛶
  </button>

</div>


<!-- ==================================================
     PROGRESS
================================================== -->

<div id="progress">

  <div id="bar"></div>

</div>


<!-- ==================================================
     VIEWPORT
================================================== -->

<div id="viewport">

  <div id="document"></div>

</div>


<!-- ==================================================
     THUMBNAILS
================================================== -->

<div id="thumbs"></div>

<button id="thumbBtn"
        onclick="toggleThumbs()">

  ☰

</button>


<div id="toast"></div>


<!-- ==================================================
     PDF.JS
================================================== -->

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";


/* ==================================================
   PDF NAME
================================================== */

const comic =
new URLSearchParams(location.search).get("comic")
|| "Dwikora.pdf";


/* ==================================================
   ELEMENT
================================================== */

const documentLayer =
document.getElementById("document");

const thumbs =
document.getElementById("thumbs");


/* ==================================================
   LOAD PDF
================================================== */

const pdf =
await pdfjsLib.getDocument(comic).promise;


/* ==================================================
   RENDER PDF
================================================== */

for(
  let i=1;
  i<=pdf.numPages;
  i++
){

  const page =
    await pdf.getPage(i);


  /* ==============================================
     HALAMAN UTAMA
  ============================================== */

  const viewport =
    page.getViewport({
      scale:1.6
    });


  const canvas =
    document.createElement("canvas");


  canvas.width =
    viewport.width;

  canvas.height =
    viewport.height;


  canvas.dataset.page =
    i;


  await page.render({

    canvasContext:
      canvas.getContext("2d"),

    viewport:
      viewport

  }).promise;


  documentLayer.appendChild(
    canvas
  );


  /* ==============================================
     THUMBNAIL
  ============================================== */

  const thumbViewport =
    page.getViewport({
      scale:.22
    });


  const thumb =
    document.createElement("canvas");


  thumb.width =
    thumbViewport.width;

  thumb.height =
    thumbViewport.height;


  thumb.dataset.page =
    i;


  await page.render({

    canvasContext:
      thumb.getContext("2d"),

    viewport:
      thumbViewport

  }).promise;


  thumb.className="thumb";


  thumb.onclick=()=>{

    goToPage(i);

    thumbs.classList.remove(
      "show"
    );

  };


  thumbs.appendChild(
    thumb
  );

}


/* ==================================================
   START READER
================================================== */

startReader();

</script>


<!-- ==================================================
     READER ENGINE
================================================== -->

<script>


/* ==================================================
   STATE
================================================== */

let zoom=1;

let panX=0;
let panY=0;


/*
 * Posisi halaman sebelum masuk zoom.
 */

let savedNormalScroll=0;


/*
 * Touch state.
 */

let isPinching=false;
let isPanning=false;


/*
 * Pinch state.
 */

let pinchStartDistance=0;
let pinchStartZoom=1;

let pinchContentX=0;
let pinchContentY=0;


/*
 * Posisi awal pan.
 */

let panStartX=0;
let panStartY=0;

let panOriginX=0;
let panOriginY=0;


/*
 * Double tap.
 */

let lastTap=0;


/*
 * Mouse.
 */

let mouseDown=false;

let mouseStartX=0;
let mouseStartY=0;

let mouseOriginX=0;
let mouseOriginY=0;


/* ==================================================
   ELEMENT
================================================== */

const viewport =
document.getElementById(
  "viewport"
);

const documentLayer =
document.getElementById(
  "document"
);

const toast =
document.getElementById(
  "toast"
);


/* ==================================================
   TOAST
================================================== */

function show(text){

  toast.innerText=text;

  toast.style.display="block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
  setTimeout(()=>{

    toast.style.display="none";

  },900);

}


/* ==================================================
   GET ALL PAGES
================================================== */

function getPages(){

  return documentLayer.querySelectorAll(
    "canvas"
  );

}


/* ==================================================
   GET CURRENT PAGE
================================================== */

function getCurrentPage(){

  const pages =
    getPages();


  const currentY =
    window.scrollY + 100;


  let pageNumber=1;


  for(
    let i=0;
    i<pages.length;
    i++
  ){

    if(
      pages[i].offsetTop <= currentY
    ){

      pageNumber=i+1;

    }else{

      break;

    }

  }


  return pageNumber;

}


/* ==================================================
   GET PAGE FROM DOCUMENT Y
================================================== */

function getPageAtY(y){

  const pages =
    getPages();


  let pageNumber=1;


  for(
    let i=0;
    i<pages.length;
    i++
  ){

    if(
      pages[i].offsetTop <= y
    ){

      pageNumber=i+1;

    }else{

      break;

    }

  }


  return pageNumber;

}


/* ==================================================
   ENTER ZOOM
================================================== */

function enterZoomMode(){

  if(zoom<=1){

    return;

  }


  document.body.classList.add(
    "zoom-mode"
  );


  apply();

}


/* ==================================================
   EXIT ZOOM
================================================== */

function exitZoomMode(){

  /*
   * Posisi PDF yang sedang terlihat
   * dalam koordinat dokumen.
   */

  const currentDocumentY =
    Math.max(
      0,
      -panY / zoom
    );


  /*
   * Cari halaman yang sedang terlihat.
   */

  const pageNumber =
    getPageAtY(
      currentDocumentY
    );


  const pages =
    getPages();


  const page =
    pages[pageNumber-1];


  /*
   * Posisi relatif terhadap halaman.
   */

  let relativeY=0;


  if(page){

    relativeY =
      currentDocumentY -
      page.offsetTop;

  }


  /*
   * Keluar mode zoom.
   */

  document.body.classList.remove(
    "zoom-mode"
  );


  documentLayer.style.transform=
    "none";


  zoom=1;

  panX=0;
  panY=0;


  /*
   * Kembalikan posisi scroll
   * ke halaman yang sedang dibaca.
   */

  requestAnimationFrame(()=>{

    if(page){

      window.scrollTo(
        0,
        page.offsetTop+
        relativeY
      );

    }else{

      window.scrollTo(
        0,
        savedNormalScroll
      );

    }


    updateProgress();

  });

}


/* ==================================================
   DOCUMENT SIZE
================================================== */

function getSize(){

  return {

    width:
      documentLayer.offsetWidth*
      zoom,

    height:
      documentLayer.offsetHeight*
      zoom

  };

}


/* ==================================================
   LIMIT PAN
================================================== */

function limitPan(){

  const vw =
    viewport.clientWidth;

  const vh =
    viewport.clientHeight;


  const size =
    getSize();


  /*
   * HORIZONTAL
   */

  if(
    size.width<=vw
  ){

    panX=
      (vw-size.width)/2;

  }else{

    const minX =
      vw-size.width;


    panX =
      Math.min(
        0,
        Math.max(
          minX,
          panX
        )
      );

  }


  /*
   * VERTICAL
   */

  if(
    size.height<=vh
  ){

    panY=
      (vh-size.height)/2;

  }else{

    const minY =
      vh-size.height;


    panY =
      Math.min(
        0,
        Math.max(
          minY,
          panY
        )
      );

  }

}


/* ==================================================
   APPLY
================================================== */

function apply(){

  if(zoom<=1){

    document.body.classList.remove(
      "zoom-mode"
    );


    documentLayer.style.transform=
      "none";


    return;

  }


  document.body.classList.add(
    "zoom-mode"
  );


  limitPan();


  documentLayer.style.transform=
    "translate3d("+
    panX+"px,"+
    panY+"px,0) "+
    "scale("+zoom+")";


  updateProgress();

}


/* ==================================================
   ZOOM AROUND POINT
================================================== */

function zoomAround(
  newZoom,
  pointX,
  pointY
){

  const oldZoom =
    zoom;


  newZoom =
    Math.max(
      1,
      Math.min(
        3,
        newZoom
      )
    );


  /*
   * ================================================
   * DARI NORMAL KE ZOOM
   * ================================================
   */

  if(oldZoom<=1){

    /*
     * Ini kunci perbaikannya.
     *
     * window.scrollY adalah posisi
     * halaman yang sedang dibaca.
     */

    savedNormalScroll =
      window.scrollY;


    /*
     * Posisi dokumen sebenarnya.
     */

    const documentY =
      savedNormalScroll+
      pointY;


    const documentX =
      pointX;


    /*
     * Aktifkan zoom.
     */

    zoom =
      newZoom;


    document.body.classList.add(
      "zoom-mode"
    );


    /*
     * Pertahankan titik yang sedang
     * dilihat di bawah titik zoom.
     */

    panX =
      pointX -
      documentX*zoom;


    panY =
      pointY -
      documentY*zoom;


    apply();

    return;

  }


  /*
   * ================================================
   * SUDAH ZOOM
   * ================================================
   */

  const contentX =
    (
      pointX-panX
    )/oldZoom;


  const contentY =
    (
      pointY-panY
    )/oldZoom;


  zoom =
    newZoom;


  panX =
    pointX-
    contentX*zoom;


  panY =
    pointY-
    contentY*zoom;


  if(zoom<=1){

    exitZoomMode();

    return;

  }


  apply();

}


/* ==================================================
   ZOOM IN
================================================== */

async function zoomIn(){

  const x =
    viewport.clientWidth/2;


  const y =
    viewport.clientHeight/2;


  if(zoom<=1){

    zoomAround(
      1.2,
      x,
      y
    );

  }else{

    zoomAround(
      zoom+0.2,
      x,
      y
    );

  }


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* ==================================================
   ZOOM OUT
================================================== */

function zoomOut(){

  if(zoom<=1){

    return;

  }


  const x =
    viewport.clientWidth/2;


  const y =
    viewport.clientHeight/2;


  const newZoom =
    Math.max(
      1,
      zoom-0.2
    );


  if(newZoom<=1){

    exitZoomMode();

    show("100%");

    return;

  }


  zoomAround(
    newZoom,
    x,
    y
  );


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* ==================================================
   DARK MODE
================================================== */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );


  localStorage.setItem(
    "dark_"+comic,
    document.body.classList.contains(
      "dark"
    ) ? "1" : "0"
  );

}


/* ==================================================
   LOAD DARK MODE
================================================== */

function loadDark(){

  if(
    localStorage.getItem(
      "dark_"+comic
    )==="1"
  ){

    document.body.classList.add(
      "dark"
    );

  }

}


/* ==================================================
   THUMBNAILS
================================================== */

function toggleThumbs(){

  document
    .getElementById("thumbs")
    .classList.toggle(
      "show"
    );

}


/* ==================================================
   GO TO PAGE
================================================== */

function goToPage(pageNumber){

  const pages =
    getPages();


  const page =
    pages[pageNumber-1];


  if(!page){

    return;

  }


  /*
   * MODE NORMAL
   */

  if(zoom<=1){

    window.scrollTo({

      top:
        page.offsetTop,

      behavior:"smooth"

    });


    return;

  }


  /*
   * MODE ZOOM
   *
   * Jangan menggunakan page.offsetTop
   * sebagai posisi layar secara langsung.
   *
   * Kalikan dengan zoom.
   */

  panY =
    -page.offsetTop*
    zoom;


  /*
   * Pastikan halaman tetap berada
   * di dalam area viewport.
   */

  apply();

}


/* ==================================================
   BOOKMARK SAVE
================================================== */

function saveBookmark(){

  /*
   * ================================================
   * NORMAL
   * ================================================
   */

  if(zoom<=1){

    const data={

      mode:"normal",

      page:
        getCurrentPage(),

      scrollY:
        window.scrollY

    };


    localStorage.setItem(

      "bm_"+comic,

      JSON.stringify(data)

    );


    show(
      "Bookmark tersimpan"
    );


    return;

  }


  /*
   * ================================================
   * ZOOM
   * ================================================
   */

  const currentDocumentY =
    Math.max(
      0,
      -panY/zoom
    );


  const page =
    getPageAtY(
      currentDocumentY
    );


  const data={

    mode:"zoom",

    page:page,

    zoom:zoom,

    panX:panX,

    panY:panY

  };


  localStorage.setItem(

    "bm_"+comic,

    JSON.stringify(data)

  );


  show(
    "Bookmark tersimpan"
  );

}


/* ==================================================
   BOOKMARK LOAD
================================================== */

async function loadBookmark(){

  const saved =
    localStorage.getItem(
      "bm_"+comic
    );


  if(!saved){

    return;

  }


  let data;


  /*
   * Coba bookmark baru JSON.
   */

  try{

    data =
      JSON.parse(saved);

  }catch(e){

    /*
     * Bookmark versi lama:
     * hanya angka scrollY.
     */

    const oldY =
      Number(saved);


    if(
      Number.isFinite(oldY)
    ){

      setTimeout(()=>{

        window.scrollTo(
          0,
          oldY
        );

      },300);

    }


    return;

  }


  /*
   * ================================================
   * NORMAL BOOKMARK
   * ================================================
   */

  if(
    data &&
    data.mode==="normal"
  ){

    setTimeout(()=>{

      window.scrollTo(
        0,
        Number(data.scrollY)||0
      );


      updateProgress();

    },300);


    return;

  }


  /*
   * ================================================
   * ZOOM BOOKMARK
   * ================================================
   */

  if(
    data &&
    data.mode==="zoom"
  ){

    /*
     * Pastikan halaman yang disimpan
     * tersedia.
     */

    const pages =
      getPages();


    const pageIndex =
      Math.max(
        0,
        Number(data.page||1)-1
      );


    const page =
      pages[pageIndex];


    if(page){

      /*
       * Scroll normal dulu ke halaman.
       */

      window.scrollTo(
        0,
        page.offsetTop
      );

    }


    /*
     * Tunggu layout browser.
     */

    await new Promise(
      resolve =>
        requestAnimationFrame(
          ()=>resolve()
        )
    );


    /*
     * Pulihkan zoom.
     */

    zoom =
      Math.max(
        1.01,
        Math.min(
          3,
          Number(data.zoom)||1.2
        )
      );


    panX =
      Number(data.panX)||0;


    panY =
      Number(data.panY)||0;


    /*
     * Aktifkan mode zoom.
     */

    document.body.classList.add(
      "zoom-mode"
    );


    /*
     * Terapkan.
     */

    apply();


    show(
      "Bookmark dipulihkan"
    );

  }

}


/* ==================================================
   FULLSCREEN
================================================== */

function goFull(){

  if(
    document.fullscreenElement
  ){

    document
      .exitFullscreen()
      .catch(()=>{});

    return;

  }


  if(
    document.documentElement
      .requestFullscreen
  ){

    document.documentElement
      .requestFullscreen()
      .catch(()=>{

        show(
          "Fullscreen tidak didukung"
        );

      });

  }else{

    show(
      "Fullscreen tidak didukung"
    );

  }

}


/* ==================================================
   PROGRESS
================================================== */

function updateProgress(){

  const bar =
    document.getElementById(
      "bar"
    );


  /*
   * NORMAL
   */

  if(zoom<=1){

    const doc =
      document.documentElement;


    const max =
      doc.scrollHeight-
      doc.clientHeight;


    const percent =
      max>0
      ? doc.scrollTop/max*100
      : 0;


    bar.style.width =
      percent+"%";


    return;

  }


  /*
   * ZOOM
   */

  const size =
    getSize();


  const vh =
    viewport.clientHeight;


  const maxY =
    Math.max(
      0,
      size.height-vh
    );


  const currentY =
    Math.max(
      0,
      Math.min(
        maxY,
        -panY
      )
    );


  const percent =
    maxY>0
    ? currentY/maxY*100
    : 0;


  bar.style.width =
    percent+"%";

}


/* ==================================================
   NORMAL SCROLL
================================================== */

window.addEventListener(
  "scroll",
  function(){

    if(zoom<=1){

      updateProgress();

    }

  },
  {
    passive:true
  }
);


/* ==================================================
   PINCH DISTANCE
================================================== */

function getDistance(a,b){

  return Math.hypot(

    a.clientX-
    b.clientX,

    a.clientY-
    b.clientY

  );

}


/* ==================================================
   PINCH CENTER
================================================== */

function getCenter(a,b){

  return {

    x:
      (
        a.clientX+
        b.clientX
      )/2,

    y:
      (
        a.clientY+
        b.clientY
      )/2

  };

}


/* ==================================================
   TOUCH START
================================================== */

viewport.addEventListener(

  "touchstart",

  function(e){

    /*
     * ==============================================
     * DUA JARI
     * ==============================================
     */

    if(
      e.touches.length===2
    ){

      /*
       * Kalau masih 100%,
       * simpan posisi scroll sekarang.
       */

      if(zoom<=1){

        savedNormalScroll =
          window.scrollY;

      }


      isPinching=true;

      isPanning=false;


      pinchStartDistance =
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      pinchStartZoom =
        zoom;


      const center =
        getCenter(
          e.touches[0],
          e.touches[1]
        );


      /*
       * Jika mulai dari normal,
       * hitung titik dokumen dengan
       * scrollY.
       */

      if(zoom<=1){

        const documentX =
          center.x;


        const documentY =
          savedNormalScroll+
          center.y;


        pinchContentX =
          documentX;

        pinchContentY =
          documentY;

      }else{

        pinchContentX =
          (
            center.x-panX
          )/zoom;


        pinchContentY =
          (
            center.y-panY
          )/zoom;

      }


      lastTap=0;


      e.preventDefault();

      return;

    }


    /*
     * ==============================================
     * SATU JARI SAAT ZOOM
     * ==============================================
     */

    if(
      e.touches.length===1 &&
      zoom>1
    ){

      isPanning=true;


      panStartX =
        e.touches[0].clientX;


      panStartY =
        e.touches[0].clientY;


      panOriginX =
        panX;


      panOriginY =
        panY;


      lastTap=0;

    }

  },

  {
    passive:false
  }

);


/* ==================================================
   TOUCH MOVE
================================================== */

viewport.addEventListener(

  "touchmove",

  function(e){

    /*
     * ==============================================
     * PINCH
     * ==============================================
     */

    if(
      isPinching &&
      e.touches.length===2
    ){

      e.preventDefault();


      const currentDistance =
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      if(
        pinchStartDistance<=0
      ){

        return;

      }


      const center =
        getCenter(
          e.touches[0],
          e.touches[1]
        );


      const factor =
        currentDistance/
        pinchStartDistance;


      const newZoom =
        Math.max(
          1.01,
          Math.min(
            3,
            pinchStartZoom*
            factor
          )
        );


      zoom =
        newZoom;


      /*
       * Pertahankan titik yang berada
       * di bawah jari.
       */

      panX =
        center.x-
        pinchContentX*zoom;


      panY =
        center.y-
        pinchContentY*zoom;


      document.body.classList.add(
        "zoom-mode"
      );


      apply();


      return;

    }


    /*
     * ==============================================
     * PAN SATU JARI
     * ==============================================
     */

    if(
      isPanning &&
      e.touches.length===1 &&
      zoom>1
    ){

      e.preventDefault();


      const dx =
        e.touches[0].clientX-
        panStartX;


      const dy =
        e.touches[0].clientY-
        panStartY;


      panX =
        panOriginX+
        dx;


      panY =
        panOriginY+
        dy;


      apply();

    }

  },

  {
    passive:false
  }

);


/* ==================================================
   TOUCH END
================================================== */

viewport.addEventListener(

  "touchend",

  function(e){

    /*
     * ==============================================
     * PINCH SELESAI
     * ==============================================
     */

    if(isPinching){

      if(
        e.touches.length<2
      ){

        isPinching=false;

        pinchStartDistance=0;


        if(zoom>1){

          document.body.classList.add(
            "zoom-mode"
          );


          apply();


          show(
            Math.round(
              zoom*100
            )+"%"
          );

        }

      }


      return;

    }


    /*
     * ==============================================
     * PAN SELESAI
     * ==============================================
     */

    if(isPanning){

      isPanning=false;

      return;

    }


    /*
     * ==============================================
     * DOUBLE TAP
     * ==============================================
     */

    if(
      e.changedTouches.length!==1
    ){

      lastTap=0;

      return;

    }


    const now =
      Date.now();


    if(
      now-lastTap<300
    ){

      const touch =
        e.changedTouches[0];


      const rect =
        viewport.getBoundingClientRect();


      const x =
        touch.clientX-
        rect.left;


      const y =
        touch.clientY-
        rect.top;


      if(zoom<=1){

        /*
         * Simpan posisi normal.
         */

        savedNormalScroll =
          window.scrollY;


        /*
         * Zoom dari posisi yang sedang
         * dilihat.
         */

        zoomAround(
          2,
          x,
          y
        );


        show("200%");

      }else{

        exitZoomMode();

        show("100%");

      }


      lastTap=0;

    }else{

      lastTap=now;

    }

  },

  {
    passive:false
  }

);


/* ==================================================
   MOUSE PAN DESKTOP
================================================== */

viewport.addEventListener(

  "mousedown",

  function(e){

    if(zoom<=1){

      return;

    }


    if(e.button!==0){

      return;

    }


    mouseDown=true;


    mouseStartX =
      e.clientX;

    mouseStartY =
      e.clientY;


    mouseOriginX =
      panX;

    mouseOriginY =
      panY;


    viewport.style.cursor=
      "grabbing";

  }

);


window.addEventListener(

  "mousemove",

  function(e){

    if(
      !mouseDown ||
      zoom<=1
    ){

      return;

    }


    panX =
      mouseOriginX+
      (
        e.clientX-
        mouseStartX
      );


    panY =
      mouseOriginY+
      (
        e.clientY-
        mouseStartY
      );


    apply();

  }

);


window.addEventListener(

  "mouseup",

  function(){

    if(mouseDown){

      mouseDown=false;


      viewport.style.cursor=
        "default";

    }

  }

);


/* ==================================================
   MOUSE WHEEL + CTRL ZOOM
================================================== */

viewport.addEventListener(

  "wheel",

  function(e){

    if(!e.ctrlKey){

      return;

    }


    e.preventDefault();


    const rect =
      viewport.getBoundingClientRect();


    const x =
      e.clientX-
      rect.left;


    const y =
      e.clientY-
      rect.top;


    const amount =
      e.deltaY<0
      ? .1
      : -.1;


    const newZoom =
      zoom+amount;


    if(newZoom<=1){

      exitZoomMode();

      return;

    }


    zoomAround(
      newZoom,
      x,
      y
    );


    show(
      Math.round(
        zoom*100
      )+"%"
    );

  },

  {
    passive:false
  }

);


/* ==================================================
   KEYBOARD PAN
================================================== */

document.addEventListener(

  "keydown",

  function(e){

    if(zoom>1){

      const amount=50;


      if(e.key==="ArrowLeft"){

        panX+=amount;

        apply();

        e.preventDefault();

      }


      if(e.key==="ArrowRight"){

        panX-=amount;

        apply();

        e.preventDefault();

      }


      if(e.key==="ArrowUp"){

        panY+=amount;

        apply();

        e.preventDefault();

      }


      if(e.key==="ArrowDown"){

        panY-=amount;

        apply();

        e.preventDefault();

      }

    }


    /*
     * Disable Ctrl+S / Ctrl+P.
     */

    if(
      (e.ctrlKey||e.metaKey) &&
      ["p","s"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }

);


/* ==================================================
   DISABLE CONTEXT MENU
================================================== */

document.addEventListener(

  "contextmenu",

  function(e){

    e.preventDefault();

  }

);


/* ==================================================
   DISABLE DRAG
================================================== */

document.addEventListener(

  "dragstart",

  function(e){

    e.preventDefault();

  }

);


/* ==================================================
   RESIZE
================================================== */

window.addEventListener(

  "resize",

  function(){

    if(zoom>1){

      limitPan();

      apply();

    }else{

      updateProgress();

    }

  }

);


/* ==================================================
   START READER
================================================== */

async function startReader(){

  loadDark();


  /*
   * Tunggu layout PDF benar-benar selesai.
   */

  await new Promise(
    resolve =>
      requestAnimationFrame(
        ()=>resolve()
      )
  );


  /*
   * Pulihkan bookmark.
   */

  await loadBookmark();


  updateProgress();

}

</script>
