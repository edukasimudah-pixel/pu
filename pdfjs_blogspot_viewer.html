<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SehatiCenter Webtoon Reader V4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;height:56px;background:#111;border-bottom:1px solid #222;
display:flex;align-items:center;padding:8px;gap:8px;z-index:10}
.logo{font-weight:700;color:#60a5fa;margin-right:auto}
.btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px 10px;cursor:pointer}
#progress{position:fixed;top:56px;left:0;right:0;height:3px;background:#222;z-index:9}
#bar{height:100%;width:0;background:#60a5fa}
#reader{position:fixed;top:59px;bottom:0;left:0;right:0;overflow:auto;touch-action:none}
#viewer{max-width:780px;margin:auto;transform-origin:top center}
canvas{display:block;width:100%;background:#fff;margin-bottom:2px}
.dark canvas{filter:invert(1) hue-rotate(180deg)}
#thumbs{position:fixed;right:-130px;top:90px;width:120px;height:70vh;background:#111;
overflow:auto;transition:.3s;padding:6px;border-left:1px solid #333}
#thumbs.show{right:0}
.thumb{width:100%;border:1px solid #333;margin-bottom:6px;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;
padding:10px 16px;border-radius:20px;display:none}
</style>
</head>
<body>
<div id="top">
  <div class="logo">SEHATICENTER</div>
  <button class="btn" onclick="zoomOut()">−</button>
  <button class="btn" onclick="zoomIn()">+</button>
  <button class="btn" onclick="toggleDark()">🌙</button>
  <button class="btn" onclick="saveBookmark()">🔖</button>
  <button class="btn" onclick="toggleThumbs()">📑</button>
  <button class="btn" onclick="goFull()">⛶</button>
</div>
<div id="progress"><div id="bar"></div></div>
<div id="reader"><div id="viewer"></div></div>
<div id="thumbs"></div>
<div id="toast"></div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

// ===== GANTI DEFAULT PDF DI SINI =====
const comic=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";
// ====================================

const pdf=await pdfjsLib.getDocument(comic).promise;
const viewer=document.getElementById("viewer");
const thumbs=document.getElementById("thumbs");

for(let i=1;i<=pdf.numPages;i++){
  const page=await pdf.getPage(i);
  const vp=page.getViewport({scale:1.6});

  const c=document.createElement("canvas");
  c.width=vp.width;c.height=vp.height;
  await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  viewer.appendChild(c);

  const t=document.createElement("canvas");
  const tv=page.getViewport({scale:.25});
  t.width=tv.width;t.height=tv.height;
  await page.render({canvasContext:t.getContext("2d"),viewport:tv}).promise;
  t.className="thumb";
  t.onclick=()=>c.scrollIntoView({behavior:"smooth"});
  thumbs.appendChild(t);
}

const pos=localStorage.getItem("bm_"+comic);
if(pos) document.getElementById("reader").scrollTop=+pos;
</script>

<script>
let zoom=1;
const reader=document.getElementById("reader");
const viewer=document.getElementById("viewer");
const toast=document.getElementById("toast");

function show(msg){
 toast.textContent=msg;
 toast.style.display="block";
 setTimeout(()=>toast.style.display="none",1200);
}
function apply(){
 viewer.style.transform=`scale(${zoom})`;
 viewer.style.paddingBottom=((zoom-1)*120)+"vh";
}
window.zoomIn=()=>{zoom=Math.min(3,zoom+.2);apply();show(Math.round(zoom*100)+"%")};
window.zoomOut=()=>{zoom=Math.max(.5,zoom-.2);apply();show(Math.round(zoom*100)+"%")};
window.toggleDark=()=>document.body.classList.toggle("dark");
window.goFull=()=>!document.fullscreenElement?document.documentElement.requestFullscreen():document.exitFullscreen();
window.saveBookmark=()=>{
 const comic=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";
 localStorage.setItem("bm_"+comic,reader.scrollTop);
 show("Bookmark tersimpan");
};
window.toggleThumbs=()=>document.getElementById("thumbs").classList.toggle("show");

reader.addEventListener("scroll",()=>{
 const p=reader.scrollTop/(reader.scrollHeight-reader.clientHeight)*100;
 document.getElementById("bar").style.width=p+"%";
});

// Mouse wheel zoom
reader.addEventListener("wheel",e=>{
 if(e.ctrlKey){e.preventDefault(); zoom=Math.max(.5,Math.min(3,zoom+(e.deltaY<0?.1:-.1))); apply();}
},{passive:false});

// Pinch
let sd=0;
reader.addEventListener("touchstart",e=>{
 if(e.touches.length==2)
  sd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:false});
reader.addEventListener("touchmove",e=>{
 if(e.touches.length==2){
   e.preventDefault();
   const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
   zoom=Math.max(.5,Math.min(3,zoom*(d/sd)));
   sd=d;apply();
 }
},{passive:false});

// Double tap
let last=0;
reader.addEventListener("touchend",()=>{
 const now=Date.now();
 if(now-last<250){ zoom=zoom>1?1:2; apply(); }
 last=now;
});

document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&["p","s"].includes(e.key.toLowerCase())){e.preventDefault();show("Dinonaktifkan")}
});
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
</script>
</body>
</html>
