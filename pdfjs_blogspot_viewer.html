<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>SehatiCenter Webtoon Reader V6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
#topbar{
  position:sticky;
  top:0;
  z-index:999;
  background:#111;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px;
}
.logo{font-weight:bold;color:#60A5FA;margin-right:auto}
.btn{
  background:#2563EB;
  color:#fff;
  border:none;
  border-radius:8px;
  width:38px;
  height:38px;
  font-size:18px;
}
#progress{height:3px;background:#222}
#bar{height:100%;width:0;background:#60A5FA}
#viewer{
  max-width:820px;
  margin:10px auto 40px;
  transform-origin:top center;
}
canvas{
  display:block;
  width:100%;
  height:auto;
  background:#fff;
  margin-bottom:2px;
}
.dark canvas{filter:invert(1) hue-rotate(180deg)}
#toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:10px 16px;
  border-radius:20px;
  display:none;
}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo">SEHATICENTER</div>
  <button class="btn" onclick="changeZoom(-0.2)">−</button>
  <button class="btn" onclick="changeZoom(0.2)">+</button>
  <button class="btn" onclick="toggleDark()">🌙</button>
  <button class="btn" onclick="saveBookmark()">🔖</button>
  <button class="btn" onclick="goFull()">⛶</button>
</div>

<div id="progress"><div id="bar"></div></div>
<div id="viewer"></div>
<div id="toast"></div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

// ===== GANTI DEFAULT PDF DI SINI =====
const comic = new URLSearchParams(location.search).get("comic") || "Dwikora.pdf";
// ====================================

const pdf = await pdfjsLib.getDocument(comic).promise;
const viewer = document.getElementById("viewer");

for(let i=1;i<=pdf.numPages;i++){
  const page = await pdf.getPage(i);
  const vp = page.getViewport({scale:1.6});
  const canvas = document.createElement("canvas");
  canvas.width = vp.width;
  canvas.height = vp.height;
  await page.render({
    canvasContext:canvas.getContext("2d"),
    viewport:vp
  }).promise;
  viewer.appendChild(canvas);
}

const pos = localStorage.getItem("bm_"+comic);
if(pos) window.scrollTo(0, Number(pos));
</script>

<script>
let zoom = 1;
const viewer = document.getElementById("viewer");
const toast = document.getElementById("toast");

function show(msg){
  toast.innerText = msg;
  toast.style.display = "block";
  setTimeout(()=>toast.style.display="none",900);
}

function applyZoom(){
  viewer.style.transform = `scale(${zoom})`;
  viewer.style.marginBottom = ((zoom-1)*140)+"vh";
}

window.changeZoom=(d)=>{
  zoom=Math.max(.6,Math.min(3,zoom+d));
  applyZoom();
  show(Math.round(zoom*100)+"%");
}

window.toggleDark=()=>document.body.classList.toggle("dark");

window.saveBookmark=()=>{
  const comic=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";
  localStorage.setItem("bm_"+comic, window.scrollY);
  show("Bookmark");
}

window.goFull=()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement){
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }else{
    if(document.exitFullscreen) document.exitFullscreen();
  }
}

window.addEventListener("scroll",()=>{
  const h=document.documentElement;
  const p=(h.scrollTop/(h.scrollHeight-h.clientHeight))*100;
  document.getElementById("bar").style.width=p+"%";
});

let start=0,base=1;
document.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    start=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    base=zoom;
  }
},{passive:true});

document.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    const dist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    zoom=Math.max(.6,Math.min(3,base*dist/start));
    applyZoom();
  }
},{passive:true});

let lastTap=0;
document.addEventListener("touchend",()=>{
  const now=Date.now();
  if(now-lastTap<250){
    zoom=zoom>1?1:2;
    applyZoom();
    show("Zoom");
  }
  lastTap=now;
});

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&["p","s"].includes(e.key.toLowerCase()))
    e.preventDefault();
});
</script>

</body>
</html>
