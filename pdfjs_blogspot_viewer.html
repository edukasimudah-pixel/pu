<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SehatiCenter Webtoon Reader V7</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}
#top{position:sticky;top:0;z-index:1000;height:56px;background:#111;display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #222}
.logo{font-weight:700;color:#60A5FA;margin-right:auto}
.btn{width:38px;height:38px;border:0;border-radius:10px;background:#2563EB;color:#fff;font-size:18px}
#progress{position:sticky;top:56px;height:3px;background:#222;z-index:999}#bar{height:100%;width:0;background:#60A5FA}
#viewer{max-width:820px;margin:10px auto 40px;transform-origin:top center}
canvas{display:block;width:100%;height:auto;background:#fff;margin-bottom:2px}
.dark canvas{filter:invert(1) hue-rotate(180deg)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;padding:10px 16px;border-radius:18px;display:none}
#thumbBtn{position:fixed;right:14px;bottom:16px;width:52px;height:52px;border-radius:50%;background:#2563EB;color:#fff;border:0;font-size:22px;z-index:1001}
#thumbs{position:fixed;top:60px;right:-140px;width:130px;height:70vh;background:#111;border-left:1px solid #333;overflow:auto;transition:.25s;z-index:1000;padding:6px}
#thumbs.show{right:0}.thumb{width:100%;margin-bottom:6px;border:1px solid #333;display:block}
</style>
</head>
<body>
<div id="top">
<div class="logo">SEHATICENTER</div>
<button class="btn" onclick="zoomBy(-0.2)">−</button>
<button class="btn" onclick="zoomBy(0.2)">+</button>
<button class="btn" onclick="toggleDark()">🌙</button>
<button class="btn" onclick="saveMark()">🔖</button>
<button class="btn" onclick="goFS()">⛶</button>
</div>
<div id="progress"><div id="bar"></div></div>
<div id="viewer"></div>
<button id="thumbBtn" onclick="toggleThumbs()">☰</button>
<div id="thumbs"></div>
<div id="toast"></div>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";
const comic=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";
const pdf=await pdfjsLib.getDocument(comic).promise;
const viewer=document.getElementById("viewer"), thumbs=document.getElementById("thumbs");
for(let i=1;i<=pdf.numPages;i++){
 const page=await pdf.getPage(i);
 const vp=page.getViewport({scale:1.6});
 const c=document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
 await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
 viewer.appendChild(c);
 const tv=page.getViewport({scale:.22});
 const t=document.createElement("canvas"); t.width=tv.width; t.height=tv.height;
 await page.render({canvasContext:t.getContext("2d"),viewport:tv}).promise;
 t.className="thumb"; t.onclick=()=>c.scrollIntoView({behavior:"smooth"}); thumbs.appendChild(t);
}
const pos=localStorage.getItem("bm_"+comic); if(pos) scrollTo(0,+pos);
</script>
<script>
let scale=1; const viewer=document.getElementById("viewer"), toast=document.getElementById("toast");
const show=m=>{toast.textContent=m;toast.style.display="block";setTimeout(()=>toast.style.display="none",900)};
function apply(){viewer.style.transform=`scale(${scale})`;viewer.style.marginBottom=((scale-1)*140)+"vh"}
window.zoomBy=d=>{scale=Math.max(.6,Math.min(3,scale+d));apply();show(Math.round(scale*100)+"%")}
window.toggleDark=()=>document.body.classList.toggle("dark");
window.saveMark=()=>{const c=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";localStorage.setItem("bm_"+c,scrollY);show("Bookmark")};
window.goFS=()=>{const e=document.documentElement; if(!document.fullscreenElement){(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}else document.exitFullscreen&&document.exitFullscreen()};
window.toggleThumbs=()=>document.getElementById("thumbs").classList.toggle("show");
addEventListener("scroll",()=>{const h=document.documentElement; const p=h.scrollTop/(h.scrollHeight-h.clientHeight)*100; document.getElementById("bar").style.width=p+"%"});
let s=0,b=1; addEventListener("touchstart",e=>{if(e.touches.length===2){s=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);b=scale}},{passive:true});
addEventListener("touchmove",e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=Math.max(.6,Math.min(3,b*d/s));apply()}},{passive:true});
let last=0; addEventListener("touchend",()=>{const n=Date.now(); if(n-last<250){scale=scale>1?1:2;apply();show("Zoom")} last=n});
document.addEventListener("contextmenu",e=>e.preventDefault()); document.addEventListener("dragstart",e=>e.preventDefault());
</script>
</body>
</html>
