<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=5.0,
      viewport-fit=cover">

<title>PDF Reader</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;

  background:#0b0b0b;
  color:#fff;

  font-family:Arial,sans-serif;

  overflow-x:hidden;
  overflow-y:auto;

  -webkit-overflow-scrolling:touch;
}


/* =====================================================
   TOOLBAR
   ===================================================== */

#top{
  position:fixed;

  top:0;
  left:0;
  right:0;

  height:56px;

  background:#111;

  display:flex;
  justify-content:flex-end;
  align-items:center;

  gap:8px;

  padding:8px 12px;

  z-index:10000;
}

.btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:8px;

  background:#2563EB;

  color:#fff;

  font-size:18px;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   PROGRESS
   ===================================================== */

#progress{
  position:fixed;

  top:56px;
  left:0;
  right:0;

  height:3px;

  background:#222;

  z-index:9999;
}

#bar{
  width:0;
  height:100%;

  background:#60A5FA;
}


/* =====================================================
   NORMAL READER
   ===================================================== */

#reader{
  width:100%;

  margin-top:59px;

  position:relative;

  overflow:visible;
}


/* =====================================================
   PDF DOCUMENT
   ===================================================== */

#document{

  width:100%;

  max-width:780px;

  margin:0 auto;

  position:relative;

  transform:none;

  transform-origin:0 0;
}


/* =====================================================
   PDF CANVAS
   ===================================================== */

#document canvas{

  display:block;

  width:100%;
  height:auto;

  background:#fff;

  margin-bottom:2px;

  pointer-events:none;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;
}


/* =====================================================
   ZOOM VIEWPORT
   ===================================================== */

#zoomViewport{

  display:none;
}


/*
   Saat zoom, halaman PDF dipindahkan
   ke viewport khusus.
*/

body.zooming{

  overflow:hidden;
}

body.zooming #reader{

  display:none;
}

body.zooming #zoomViewport{

  display:block;

  position:fixed;

  top:59px;
  left:0;
  right:0;
  bottom:0;

  overflow:hidden;

  background:#0b0b0b;

  z-index:20;

  touch-action:none;
}


/* =====================================================
   ZOOM DOCUMENT
   ===================================================== */

#zoomDocument{

  position:absolute;

  left:0;
  top:0;

  width:780px;

  transform-origin:0 0;

  will-change:transform;

}


/*
   Kita akan memasukkan canvas yang sama
   ke dalam zoomDocument.
*/

#zoomDocument canvas{

  display:block;

  width:780px;
  height:auto;

  background:#fff;

  margin-bottom:2px;

  pointer-events:none;

}


/* =====================================================
   DARK
   ===================================================== */

.dark #document canvas,
.dark #zoomDocument canvas{

  filter:invert(1) hue-rotate(180deg);

}


/* =====================================================
   THUMBNAILS
   ===================================================== */

#thumbs{

  position:fixed;

  top:70px;
  right:-140px;

  width:130px;

  height:calc(100vh - 90px);

  padding:6px;

  background:#111;

  border-left:1px solid #333;

  overflow-y:auto;

  transition:.25s;

  z-index:10001;

  -webkit-overflow-scrolling:touch;
}

#thumbs.show{
  right:0;
}

.thumb{

  display:block;

  width:100%;
  height:auto;

  margin-bottom:6px;

  border:1px solid #333;

  border-radius:4px;

  cursor:pointer;

  touch-action:manipulation;

  pointer-events:auto;
}


/* =====================================================
   THUMB BUTTON
   ===================================================== */

#thumbBtn{

  position:fixed;

  right:14px;
  bottom:18px;

  width:52px;
  height:52px;

  border:0;

  border-radius:50%;

  background:#2563EB;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  z-index:10002;

  touch-action:manipulation;
}


/* =====================================================
   TOAST
   ===================================================== */

#toast{

  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  background:#111;

  color:#fff;

  padding:10px 16px;

  border-radius:20px;

  display:none;

  z-index:10003;

  white-space:nowrap;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

  #top{

    height:52px;

    padding:6px 8px;

    gap:6px;
  }

  .btn{

    width:38px;
    height:38px;

    font-size:17px;
  }

  #progress{
    top:52px;
  }

  #reader{
    margin-top:55px;
  }

  body.zooming #zoomViewport{
    top:55px;
  }

}


/* =====================================================
   SMALL PHONE
   ===================================================== */

@media(max-width:380px){

  #top{

    gap:4px;

    padding-left:5px;
    padding-right:5px;
  }

  .btn{

    width:36px;
    height:36px;

    font-size:16px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     TOOLBAR
     ===================================================== -->

<div id="top">

  <button class="btn"
          onclick="zoomOut()">−</button>

  <button class="btn"
          onclick="zoomIn()">+</button>

  <button class="btn"
          onclick="toggleDark()">🌙</button>

  <button class="btn"
          onclick="saveBookmark()">🔖</button>

  <button class="btn"
          onclick="goFull()">⛶</button>

</div>


<!-- =====================================================
     PROGRESS
     ===================================================== -->

<div id="progress">
  <div id="bar"></div>
</div>


<!-- =====================================================
     NORMAL READER
     ===================================================== -->

<div id="reader">

  <div id="document"></div>

</div>


<!-- =====================================================
     ZOOM VIEWPORT
     ===================================================== -->

<div id="zoomViewport">

  <div id="zoomDocument"></div>

</div>


<!-- =====================================================
     THUMBNAILS
     ===================================================== -->

<div id="thumbs"></div>

<button id="thumbBtn"
        onclick="toggleThumbs()">☰</button>

<div id="toast"></div>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc=
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";


/* =====================================================
   PDF
   ===================================================== */

const comic=
new URLSearchParams(location.search).get("comic")
||"Dwikora.pdf";


/* =====================================================
   ELEMENT
   ===================================================== */

const normalDocument=
document.getElementById("document");

const zoomDocument=
document.getElementById("zoomDocument");

const thumbs=
document.getElementById("thumbs");


/* =====================================================
   LOAD PDF
   ===================================================== */

const pdf=
await pdfjsLib.getDocument(comic).promise;


/* =====================================================
   RENDER
   ===================================================== */

for(
  let i=1;
  i<=pdf.numPages;
  i++
){

  const page=
  await pdf.getPage(i);


  /*
   * -----------------------------------------------
   * NORMAL CANVAS
   * -----------------------------------------------
   */

  const vp=
  page.getViewport({
    scale:1.6
  });


  const canvas=
  document.createElement("canvas");


  canvas.width=
  vp.width;

  canvas.height=
  vp.height;


  canvas.dataset.page=i;


  await page.render({

    canvasContext:
      canvas.getContext("2d"),

    viewport:vp

  }).promise;


  normalDocument.appendChild(canvas);


  /*
   * -----------------------------------------------
   * ZOOM CANVAS
   *
   * Canvas terpisah agar ukuran normal
   * dan ukuran zoom tidak saling mengganggu.
   * -----------------------------------------------
   */

  const zoomCanvas=
  document.createElement("canvas");


  zoomCanvas.width=
  vp.width;

  zoomCanvas.height=
  vp.height;


  zoomCanvas.dataset.page=i;


  await page.render({

    canvasContext:
      zoomCanvas.getContext("2d"),

    viewport:vp

  }).promise;


  zoomDocument.appendChild(
    zoomCanvas
  );


  /*
   * -----------------------------------------------
   * THUMBNAIL
   * -----------------------------------------------
   */

  const tv=
  page.getViewport({
    scale:.22
  });


  const thumb=
  document.createElement("canvas");


  thumb.width=
  tv.width;

  thumb.height=
  tv.height;


  await page.render({

    canvasContext:
      thumb.getContext("2d"),

    viewport:tv

  }).promise;


  thumb.className="thumb";


  thumb.dataset.page=i;


  thumb.onclick=()=>{

    goToPage(i);

    thumbs.classList.remove(
      "show"
    );

  };


  thumbs.appendChild(
    thumb
  );

}


/* =====================================================
   BOOKMARK LAMA
   ===================================================== */

const saved=
localStorage.getItem(
  "bm_"+comic
);


if(saved){

  try{

    const data=
    JSON.parse(saved);


    if(
      data &&
      typeof data.scrollY==="number"
    ){

      setTimeout(()=>{

        window.scrollTo(
          0,
          data.scrollY
        );

      },200);

    }

  }catch(e){

    const y=
      Number(saved);


    if(!isNaN(y)){

      setTimeout(()=>{

        window.scrollTo(
          0,
          y
        );

      },200);

    }

  }

}

</script>


<script>

/* =====================================================
   STATE
   ===================================================== */

let zoom=1;


/*
 * Koordinat viewport zoom.
 */

let offsetX=0;

let offsetY=0;


/*
 * Posisi PDF yang sedang dilihat
 * sebelum masuk zoom.
 */

let anchorX=0;

let anchorY=0;


/*
 * Browser scroll sebelum zoom.
 */

let savedScrollX=0;

let savedScrollY=0;


/*
 * Touch.
 */

let pinch=false;

let pan=false;


/*
 * Pinch.
 */

let pinchDistance=0;

let pinchZoom=1;

let pinchPdfX=0;

let pinchPdfY=0;


/*
 * Pan.
 */

let panStartX=0;

let panStartY=0;

let panStartOffsetX=0;

let panStartOffsetY=0;


/*
 * Double tap.
 */

let lastTap=0;


/*
 * Mouse.
 */

let mouseDown=false;

let mouseStartX=0;

let mouseStartY=0;

let mouseStartOffsetX=0;

let mouseStartOffsetY=0;


/* =====================================================
   ELEMENT
   ===================================================== */

const reader=
document.getElementById(
  "reader"
);

const viewport=
document.getElementById(
  "zoomViewport"
);

const normalDocument=
document.getElementById(
  "document"
);

const zoomDocument=
document.getElementById(
  "zoomDocument"
);

const toast=
document.getElementById(
  "toast"
);


/* =====================================================
   TOAST
   ===================================================== */

function show(text){

  toast.innerText=text;

  toast.style.display="block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer=
  setTimeout(()=>{

    toast.style.display="none";

  },900);

}


/* =====================================================
   CURRENT READING POSITION
   ===================================================== */

function getReadingPosition(){

  const scrollY=
    window.scrollY||
    document.documentElement.scrollTop||
    0;


  const pages=
    normalDocument.querySelectorAll(
      "canvas"
    );


  let pageNumber=1;

  let pageTop=0;


  for(
    let i=0;
    i<pages.length;
    i++
  ){

    const top=
      pages[i].offsetTop;


    if(
      top<=scrollY
    ){

      pageNumber=i+1;

      pageTop=top;

    }else{

      break;

    }

  }


  return {

    page:pageNumber,

    offset:
      scrollY-pageTop,

    scrollY:scrollY,

    scrollX:
      window.scrollX||
      document.documentElement.scrollLeft||
      0

  };

}


/* =====================================================
   ENTER ZOOM
   ===================================================== */

function enterZoom(){

  if(zoom<=1){

    return;

  }


  /*
   * Simpan posisi browser hanya
   * ketika pertama masuk zoom.
   */

  if(
    !document.body.classList.contains(
      "zooming"
    )
  ){

    const pos=
      getReadingPosition();


    savedScrollY=
      pos.scrollY;


    savedScrollX=
      pos.scrollX;


    /*
     * Posisi PDF berdasarkan posisi
     * scroll yang sedang dibaca.
     */

    anchorY=
      pos.scrollY;


    anchorX=0;

  }


  document.body.classList.add(
    "zooming"
  );


  applyZoom();

}


/* =====================================================
   EXIT ZOOM
   ===================================================== */

function exitZoom(){

  /*
   * -----------------------------------------------
   * Cari posisi PDF yang sedang terlihat
   * berdasarkan koordinat zoom.
   * -----------------------------------------------
   */

  const currentPdfY=
    Math.max(
      0,
      -offsetY/zoom
    );


  /*
   * Halaman PDF yang berada di sekitar
   * posisi tersebut.
   */

  const zoomPages=
    zoomDocument.querySelectorAll(
      "canvas"
    );


  let pageNumber=1;

  let pageTop=0;


  for(
    let i=0;
    i<zoomPages.length;
    i++
  ){

    const top=
      zoomPages[i].offsetTop;


    if(
      top<=currentPdfY
    ){

      pageNumber=i+1;

      pageTop=top;

    }else{

      break;

    }

  }


  /*
   * Posisi relatif di halaman.
   */

  const pageOffset=
    currentPdfY-pageTop;


  /*
   * Kembali ke mode normal.
   */

  document.body.classList.remove(
    "zooming"
  );


  zoom=1;

  offsetX=0;

  offsetY=0;


  zoomDocument.style.transform=
    "none";


  /*
   * Tunggu layout normal.
   */

  requestAnimationFrame(()=>{

    requestAnimationFrame(()=>{

      const normalPages=
        normalDocument.querySelectorAll(
          "canvas"
        );


      const page=
        normalPages[pageNumber-1];


      if(page){

        const target=
          page.offsetTop+
          pageOffset;


        window.scrollTo(

          savedScrollX,

          target

        );

      }else{

        window.scrollTo(

          savedScrollX,

          savedScrollY

        );

      }


      updateProgress();

    });

  });

}


/* =====================================================
   DOCUMENT SIZE
   ===================================================== */

function getDocumentSize(){

  return {

    width:
      zoomDocument.offsetWidth*
      zoom,

    height:
      zoomDocument.offsetHeight*
      zoom

  };

}


/* =====================================================
   LIMIT PAN
   ===================================================== */

function limitPan(){

  const vw=
    viewport.clientWidth;

  const vh=
    viewport.clientHeight;


  const size=
    getDocumentSize();


  /*
   * X
   */

  if(size.width<=vw){

    offsetX=
      (vw-size.width)/2;

  }else{

    const minX=
      vw-size.width;


    offsetX=
      Math.min(
        0,
        Math.max(
          minX,
          offsetX
        )
      );

  }


  /*
   * Y
   */

  if(size.height<=vh){

    offsetY=
      (vh-size.height)/2;

  }else{

    const minY=
      vh-size.height;


    offsetY=
      Math.min(
        0,
        Math.max(
          minY,
          offsetY
        )
      );

  }

}


/* =====================================================
   APPLY ZOOM
   ===================================================== */

function applyZoom(){

  if(zoom<=1){

    return;

  }


  limitPan();


  zoomDocument.style.transform=
    "translate3d("+
    offsetX+"px,"+
    offsetY+"px,0) "+
    "scale("+zoom+")";


  updateProgress();

}


/* =====================================================
   ZOOM AROUND POINT
   ===================================================== */

function zoomAt(
  newZoom,
  x,
  y
){

  const oldZoom=
    zoom;


  /*
   * Saat pertama masuk zoom,
   * posisi PDF harus mengikuti posisi
   * scroll halaman sekarang.
   */

  if(oldZoom<=1){

    const pos=
      getReadingPosition();


    savedScrollY=
      pos.scrollY;


    savedScrollX=
      pos.scrollX;


    /*
     * Koordinat PDF absolut.
     */

    const pdfY=
      pos.scrollY;


    const pdfX=0;


    zoom=
      Math.max(
        1,
        Math.min(
          3,
          newZoom
        )
      );


    /*
     * Tempatkan PDF sehingga
     * posisi yang sedang dibaca
     * tetap terlihat.
     */

    offsetX=
      x-pdfX*zoom;


    offsetY=
      y-pdfY*zoom;


    document.body.classList.add(
      "zooming"
    );


    applyZoom();


    return;

  }


  /*
   * Titik PDF di bawah jari.
   */

  const pdfX=
    (x-offsetX)/
    oldZoom;


  const pdfY=
    (y-offsetY)/
    oldZoom;


  zoom=
    Math.max(
      1,
      Math.min(
        3,
        newZoom
      )
    );


  /*
   * Pertahankan titik tersebut.
   */

  offsetX=
    x-pdfX*zoom;


  offsetY=
    y-pdfY*zoom;


  applyZoom();

}


/* =====================================================
   ZOOM IN
   ===================================================== */

function zoomIn(){

  const x=
    viewport.clientWidth/2;


  const y=
    viewport.clientHeight/2;


  zoomAt(
    zoom<=1
      ? 1.2
      : zoom+0.2,
    x,
    y
  );


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* =====================================================
   ZOOM OUT
   ===================================================== */

function zoomOut(){

  if(zoom<=1){

    return;

  }


  const x=
    viewport.clientWidth/2;


  const y=
    viewport.clientHeight/2;


  const newZoom=
    Math.max(
      1,
      zoom-0.2
    );


  if(newZoom<=1){

    exitZoom();

    show("100%");

    return;

  }


  zoomAt(
    newZoom,
    x,
    y
  );


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* =====================================================
   DARK
   ===================================================== */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );

}


/* =====================================================
   THUMBNAILS
   ===================================================== */

function toggleThumbs(){

  document
    .getElementById("thumbs")
    .classList.toggle(
      "show"
    );

}


/* =====================================================
   GO PAGE
   ===================================================== */

function goToPage(pageNumber){

  const pages=
    normalDocument.querySelectorAll(
      "canvas"
    );


  const page=
    pages[pageNumber-1];


  if(!page){

    return;

  }


  if(zoom<=1){

    page.scrollIntoView({

      behavior:"smooth",

      block:"start"

    });


    return;

  }


  /*
   * Saat zoom, pindahkan PDF
   * ke halaman tersebut.
   */

  offsetY=
    -page.offsetTop*zoom;


  applyZoom();

}


/* =====================================================
   BOOKMARK
   ===================================================== */

function saveBookmark(){

  const pos=
    getReadingPosition();


  localStorage.setItem(

    "bm_"+comic,

    JSON.stringify({

      scrollY:
        pos.scrollY,

      page:
        pos.page,

      offset:
        pos.offset

    })

  );


  show(
    "Bookmark tersimpan"
  );

}


/* =====================================================
   FULLSCREEN
   ===================================================== */

function goFull(){

  if(
    !document.fullscreenElement
  ){

    document.documentElement
      .requestFullscreen()
      .catch(()=>{});

  }else{

    document.exitFullscreen();

  }

}


/* =====================================================
   PROGRESS
   ===================================================== */

function updateProgress(){

  if(zoom<=1){

    const doc=
      document.documentElement;


    const max=
      doc.scrollHeight-
      doc.clientHeight;


    const percent=
      max>0
      ? doc.scrollTop/max*100
      : 0;


    document
      .getElementById("bar")
      .style.width=
      percent+"%";


    return;

  }


  const size=
    getDocumentSize();


  const max=
    Math.max(
      0,
      size.height-
      viewport.clientHeight
    );


  const current=
    Math.max(
      0,
      Math.min(
        max,
        -offsetY
      )
    );


  const percent=
    max>0
      ? current/max*100
      : 0;


  document
    .getElementById("bar")
    .style.width=
    percent+"%";

}


/* =====================================================
   NORMAL SCROLL
   ===================================================== */

window.addEventListener(
  "scroll",
  function(){

    if(zoom<=1){

      updateProgress();

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   TOUCH DISTANCE
   ===================================================== */

function distance(a,b){

  return Math.hypot(

    a.clientX-b.clientX,

    a.clientY-b.clientY

  );

}


/* =====================================================
   TOUCH CENTER
   ===================================================== */

function center(a,b){

  return {

    x:
      (
        a.clientX+
        b.clientX
      )/2,

    y:
      (
        a.clientY+
        b.clientY
      )/2

  };

}


/* =====================================================
   TOUCH START
   ===================================================== */

viewport.addEventListener(
  "touchstart",
  function(e){

    /*
     * TWO FINGER
     */

    if(
      e.touches.length===2
    ){

      /*
       * Kalau dari 100%,
       * langsung masuk zoom mode.
       */

      if(zoom<=1){

        const pos=
          getReadingPosition();


        savedScrollY=
          pos.scrollY;


        savedScrollX=
          pos.scrollX;


        /*
         * Mulai dari zoom 1.
         */

        zoom=1;

        offsetX=0;

        offsetY=0;

        document.body.classList.add(
          "zooming"
        );

      }


      pinch=true;

      pan=false;


      pinchDistance=
        distance(
          e.touches[0],
          e.touches[1]
        );


      pinchZoom=
        zoom;


      const c=
        center(
          e.touches[0],
          e.touches[1]
        );


      /*
       * Simpan titik PDF di bawah
       * titik tengah dua jari.
       */

      pinchPdfX=
        (c.x-offsetX)/
        Math.max(
          zoom,
          0.0001
        );


      pinchPdfY=
        (c.y-offsetY)/
        Math.max(
          zoom,
          0.0001
        );


      lastTap=0;


      return;

    }


    /*
     * ONE FINGER AT ZOOM
     */

    if(
      e.touches.length===1 &&
      zoom>1
    ){

      pan=true;

      panStartX=
        e.touches[0].clientX;


      panStartY=
        e.touches[0].clientY;


      panStartOffsetX=
        offsetX;


      panStartOffsetY=
        offsetY;


      lastTap=0;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH MOVE
   ===================================================== */

viewport.addEventListener(
  "touchmove",
  function(e){

    /*
     * PINCH
     */

    if(
      pinch &&
      e.touches.length===2
    ){

      e.preventDefault();


      const d=
        distance(
          e.touches[0],
          e.touches[1]
        );


      if(
        pinchDistance<=0
      ){

        return;

      }


      const c=
        center(
          e.touches[0],
          e.touches[1]
        );


      let newZoom=
        pinchZoom*
        (
          d/
          pinchDistance
        );


      newZoom=
        Math.max(
          1,
          Math.min(
            3,
            newZoom
          )
        );


      zoom=
        newZoom;


      /*
       * Titik PDF tetap di bawah
       * titik tengah jari.
       */

      offsetX=
        c.x-
        pinchPdfX*zoom;


      offsetY=
        c.y-
        pinchPdfY*zoom;


      applyZoom();


      return;

    }


    /*
     * PAN
     */

    if(
      pan &&
      e.touches.length===1 &&
      zoom>1
    ){

      e.preventDefault();


      const dx=
        e.touches[0].clientX-
        panStartX;


      const dy=
        e.touches[0].clientY-
        panStartY;


      offsetX=
        panStartOffsetX+
        dx;


      offsetY=
        panStartOffsetY+
        dy;


      applyZoom();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH END
   ===================================================== */

viewport.addEventListener(
  "touchend",
  function(e){

    /*
     * PINCH
     */

    if(pinch){

      if(
        e.touches.length<2
      ){

        pinch=false;

        pinchDistance=0;


        if(zoom<=1){

          exitZoom();

        }else{

          show(
            Math.round(
              zoom*100
            )+"%"
          );

        }

      }


      return;

    }


    /*
     * PAN
     */

    if(pan){

      pan=false;

      return;

    }


    /*
     * DOUBLE TAP
     */

    if(
      e.changedTouches.length!==1
    ){

      lastTap=0;

      return;

    }


    const now=
      Date.now();


    if(
      now-lastTap<300
    ){

      const t=
        e.changedTouches[0];


      const rect=
        viewport.getBoundingClientRect();


      const x=
        t.clientX-
        rect.left;


      const y=
        t.clientY-
        rect.top;


      if(zoom<=1){

        zoomAt(
          2,
          x,
          y
        );


      }else{

        exitZoom();

      }


      lastTap=0;

    }else{

      lastTap=now;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   MOUSE DRAG
   ===================================================== */

viewport.addEventListener(
  "mousedown",
  function(e){

    if(
      zoom<=1 ||
      e.button!==0
    ){

      return;

    }


    mouseDown=true;


    mouseStartX=
      e.clientX;


    mouseStartY=
      e.clientY;


    mouseStartOffsetX=
      offsetX;


    mouseStartOffsetY=
      offsetY;


    viewport.style.cursor=
      "grabbing";

  }
);


window.addEventListener(
  "mousemove",
  function(e){

    if(
      !mouseDown ||
      zoom<=1
    ){

      return;

    }


    offsetX=
      mouseStartOffsetX+
      (
        e.clientX-
        mouseStartX
      );


    offsetY=
      mouseStartOffsetY+
      (
        e.clientY-
        mouseStartY
      );


    applyZoom();

  }
);


window.addEventListener(
  "mouseup",
  function(){

    if(mouseDown){

      mouseDown=false;

      viewport.style.cursor=
        "default";

    }

  }
);


/* =====================================================
   CTRL + WHEEL ZOOM
   ===================================================== */

viewport.addEventListener(
  "wheel",
  function(e){

    if(!e.ctrlKey){

      return;

    }


    e.preventDefault();


    const rect=
      viewport.getBoundingClientRect();


    const x=
      e.clientX-
      rect.left;


    const y=
      e.clientY-
      rect.top;


    const amount=
      e.deltaY<0
      ? .1
      : -.1;


    const newZoom=
      zoom+amount;


    if(newZoom<=1){

      exitZoom();

      return;

    }


    zoomAt(
      newZoom,
      x,
      y
    );


    show(
      Math.round(
        zoom*100
      )+"%"
    );

  },
  {
    passive:false
  }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(zoom>1){

      const amount=50;


      if(
        e.key==="ArrowLeft"
      ){

        offsetX+=amount;

        applyZoom();

        e.preventDefault();

      }


      if(
        e.key==="ArrowRight"
      ){

        offsetX-=amount;

        applyZoom();

        e.preventDefault();

      }


      if(
        e.key==="ArrowUp"
      ){

        offsetY+=amount;

        applyZoom();

        e.preventDefault();

      }


      if(
        e.key==="ArrowDown"
      ){

        offsetY-=amount;

        applyZoom();

        e.preventDefault();

      }

    }


    if(
      (e.ctrlKey||e.metaKey) &&
      ["p","s"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(zoom>1){

      limitPan();

      applyZoom();

    }else{

      updateProgress();

    }

  }
);


/* =====================================================
   DISABLE CONTEXT MENU
   ===================================================== */

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);


/* =====================================================
   DISABLE DRAG
   ===================================================== */

document.addEventListener(
  "dragstart",
  function(e){

    e.preventDefault();

  }
);


/* =====================================================
   INITIAL
   ===================================================== */

updateProgress();

</script>

</body>
</html>
