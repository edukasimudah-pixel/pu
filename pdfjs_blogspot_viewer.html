<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               viewport-fit=cover">

<title>PDF Reader</title>


<style>

/* ==========================================
   RESET
   ========================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


/* ==========================================
   BODY
   ========================================== */

html,
body{
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}


/* ==========================================
   TOOLBAR
   ========================================== */

#top{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:56px;

  background:#111;

  display:flex;
  justify-content:flex-end;
  align-items:center;

  gap:8px;
  padding:8px 12px;

  z-index:1000;
}


.btn{
  width:40px;
  height:40px;

  border:none;
  border-radius:8px;

  background:#2563EB;

  color:#fff;

  font-size:18px;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* ==========================================
   PROGRESS BAR
   ========================================== */

#progress{
  position:fixed;

  top:56px;
  left:0;
  right:0;

  height:3px;

  background:#222;

  z-index:999;
}


#bar{
  width:0%;
  height:100%;

  background:#60A5FA;
}


/* ==========================================
   PDF VIEWER
   ========================================== */

#viewer{

  width:100%;
  max-width:780px;

  margin:59px auto 0;

  transform-origin:top center;

  /*
   * PENTING:
   * Satu jari tetap bisa scroll vertikal.
   */
  touch-action:pan-y;

  will-change:transform;
}


/* ==========================================
   PDF CANVAS
   ========================================== */

canvas{

  display:block;

  width:100%;
  height:auto;

  background:#fff;

  margin-bottom:2px;

  /*
   * Jangan gunakan touch-action:none.
   * Ini yang membuat HP tidak bisa scroll.
   */
  touch-action:pan-y;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}


/* ==========================================
   DARK MODE
   ========================================== */

.dark canvas{
  filter:invert(1) hue-rotate(180deg);
}


/* ==========================================
   THUMBNAILS
   ========================================== */

#thumbs{

  position:fixed;

  right:-140px;

  top:70px;

  width:130px;

  height:calc(100vh - 90px);

  background:#111;

  overflow-y:auto;

  border-left:1px solid #333;

  transition:.25s;

  padding:6px;

  z-index:1001;

  -webkit-overflow-scrolling:touch;
}


#thumbs.show{
  right:0;
}


.thumb{

  width:100%;

  display:block;

  margin-bottom:6px;

  border-radius:4px;

  border:1px solid #333;

  cursor:pointer;

  touch-action:manipulation;
}


/* ==========================================
   THUMBNAIL BUTTON
   ========================================== */

#thumbBtn{

  position:fixed;

  right:14px;
  bottom:18px;

  width:52px;
  height:52px;

  border:none;
  border-radius:50%;

  background:#2563EB;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  z-index:1002;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* ==========================================
   TOAST
   ========================================== */

#toast{

  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  background:#111;

  color:#fff;

  padding:10px 16px;

  border-radius:20px;

  display:none;

  z-index:1003;

  white-space:nowrap;
}


/* ==========================================
   MOBILE
   ========================================== */

@media(max-width:600px){

  #top{

    height:52px;

    padding:6px 8px;

    gap:6px;

  }


  .btn{

    width:38px;
    height:38px;

    font-size:17px;

  }


  #progress{

    top:52px;

  }


  #viewer{

    margin-top:55px;

    max-width:none;

    width:100%;

  }

}


/* ==========================================
   SMALL PHONE
   ========================================== */

@media(max-width:380px){

  #top{
    gap:4px;
    padding-left:5px;
    padding-right:5px;
  }

  .btn{
    width:36px;
    height:36px;
    font-size:16px;
  }

}

</style>

</head>


<body>


<!-- ========================================
     TOOLBAR
     ======================================== -->

<div id="top">

  <button class="btn"
          onclick="zoomOut()"
          aria-label="Zoom out">
    −
  </button>

  <button class="btn"
          onclick="zoomIn()"
          aria-label="Zoom in">
    +
  </button>

  <button class="btn"
          onclick="toggleDark()"
          aria-label="Dark mode">
    🌙
  </button>

  <button class="btn"
          onclick="saveBookmark()"
          aria-label="Bookmark">
    🔖
  </button>

  <button class="btn"
          onclick="goFull()"
          aria-label="Fullscreen">
    ⛶
  </button>

</div>


<!-- ========================================
     PROGRESS
     ======================================== -->

<div id="progress">
  <div id="bar"></div>
</div>


<!-- ========================================
     PDF VIEWER
     ======================================== -->

<div id="viewer"></div>


<!-- ========================================
     THUMBNAILS
     ======================================== -->

<div id="thumbs"></div>


<button id="thumbBtn"
        onclick="toggleThumbs()"
        aria-label="Thumbnails">
  ☰
</button>


<!-- ========================================
     TOAST
     ======================================== -->

<div id="toast"></div>



<!-- ========================================
     PDF.JS
     ======================================== -->

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";


/* Worker */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";


/* PDF yang dibuka */

const comic =
new URLSearchParams(location.search).get("comic")
|| "Dwikora.pdf";


/* Load PDF */

const pdf =
await pdfjsLib.getDocument(comic).promise;


/* Element */

const viewer =
document.getElementById("viewer");

const thumbs =
document.getElementById("thumbs");


/* ==========================================
   RENDER SEMUA HALAMAN
   ========================================== */

for(let i=1;i<=pdf.numPages;i++){

  const page =
  await pdf.getPage(i);


  /* Ukuran halaman utama */

  const viewport =
  page.getViewport({
    scale:1.6
  });


  /* Canvas utama */

  const canvas =
  document.createElement("canvas");


  canvas.width =
  viewport.width;

  canvas.height =
  viewport.height;


  const context =
  canvas.getContext("2d");


  await page.render({

    canvasContext:context,

    viewport:viewport

  }).promise;


  viewer.appendChild(canvas);


  /* ========================================
     THUMBNAIL
     ======================================== */

  const thumbViewport =
  page.getViewport({
    scale:.22
  });


  const thumb =
  document.createElement("canvas");


  thumb.width =
  thumbViewport.width;

  thumb.height =
  thumbViewport.height;


  const thumbContext =
  thumb.getContext("2d");


  await page.render({

    canvasContext:thumbContext,

    viewport:thumbViewport

  }).promise;


  thumb.className="thumb";


  /* Klik thumbnail */

  thumb.onclick=()=>{

    canvas.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

    thumbs.classList.remove("show");

  };


  thumbs.appendChild(thumb);

}


/* ==========================================
   LOAD BOOKMARK
   ========================================== */

const savedPosition =
localStorage.getItem(
  "bm_"+comic
);


if(savedPosition){

  setTimeout(()=>{

    window.scrollTo(
      0,
      Number(savedPosition)
    );

  },100);

}

</script>



<!-- ========================================
     CONTROLS
     ======================================== -->

<script>

let zoom=1;


/* Elements */

const viewer =
document.getElementById("viewer");

const toast =
document.getElementById("toast");


/* ==========================================
   TOAST
   ========================================== */

function show(text){

  toast.innerText=text;

  toast.style.display="block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
  setTimeout(()=>{

    toast.style.display="none";

  },900);

}


/* ==========================================
   APPLY ZOOM
   ========================================== */

function apply(){

  viewer.style.transform =
    `scale(${zoom})`;


  /*
   * Tambahkan ruang bawah ketika zoom.
   * Supaya halaman terakhir tetap bisa dicapai.
   */

  viewer.style.marginBottom =
    ((zoom-1)*140)+"vh";

}


/* ==========================================
   ZOOM IN
   ========================================== */

function zoomIn(){

  zoom =
    Math.min(
      3,
      zoom+0.2
    );


  apply();


  show(
    Math.round(zoom*100)+"%"
  );

}


/* ==========================================
   ZOOM OUT
   ========================================== */

function zoomOut(){

  zoom =
    Math.max(
      0.5,
      zoom-0.2
    );


  apply();


  show(
    Math.round(zoom*100)+"%"
  );

}


/* ==========================================
   DARK MODE
   ========================================== */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );

}


/* ==========================================
   THUMBNAILS
   ========================================== */

function toggleThumbs(){

  document
    .getElementById("thumbs")
    .classList.toggle("show");

}


/* ==========================================
   BOOKMARK
   ========================================== */

function saveBookmark(){

  const comic =
    new URLSearchParams(location.search)
      .get("comic")
    || "Dwikora.pdf";


  localStorage.setItem(
    "bm_"+comic,
    window.scrollY
  );


  show("Bookmark tersimpan");

}


/* ==========================================
   FULLSCREEN
   ========================================== */

function goFull(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen()
      .catch(()=>{});

  }else{

    document.exitFullscreen();

  }

}


/* ==========================================
   PROGRESS BAR
   ========================================== */

window.addEventListener(
  "scroll",
  function(){

    const doc =
      document.documentElement;


    const max =
      doc.scrollHeight -
      doc.clientHeight;


    const percent =
      max>0
      ? (doc.scrollTop/max)*100
      : 0;


    document
      .getElementById("bar")
      .style.width =
      percent+"%";

  },
  {
    passive:true
  }
);



/* ==========================================
   PINCH ZOOM
   ========================================== */

let pinchStart=0;

let pinchBase=1;

let isPinching=false;


/*
 * Menandai bahwa touch terakhir
 * adalah pinch.
 */

let wasPinching=false;


/* Hitung jarak dua jari */

function getDistance(a,b){

  return Math.hypot(

    a.clientX-b.clientX,

    a.clientY-b.clientY

  );

}


/* ==========================================
   TOUCH START
   ========================================== */

document.addEventListener(
  "touchstart",
  function(e){

    /*
     * Dua jari = PINCH
     */

    if(e.touches.length===2){

      isPinching=true;

      wasPinching=true;


      pinchStart =
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      pinchBase=zoom;


      /*
       * Batalkan double-tap
       */

      lastTap=0;

    }

  },
  {
    passive:true
  }
);



/* ==========================================
   TOUCH MOVE
   ========================================== */

document.addEventListener(
  "touchmove",
  function(e){

    /*
     * Pinch hanya kalau ada dua jari
     */

    if(
      e.touches.length===2 &&
      isPinching &&
      pinchStart>0
    ){

      const current =
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      let newZoom =
        pinchBase *
        (current/pinchStart);


      /*
       * Batas zoom
       */

      newZoom =
        Math.max(
          0.5,
          Math.min(
            3,
            newZoom
          )
        );


      zoom=newZoom;


      apply();

    }

  },
  {
    passive:true
  }
);



/* ==========================================
   TOUCH END
   ========================================== */

document.addEventListener(
  "touchend",
  function(e){

    /*
     * Kalau sedang pinch,
     * jangan reset zoom.
     */

    if(isPinching){

      if(e.touches.length<2){

        isPinching=false;

        pinchStart=0;

        /*
         * Zoom dibiarkan apa adanya.
         */

        show(
          Math.round(zoom*100)+"%"
        );

      }

      return;

    }


    /*
     * Kalau bukan pinch,
     * proses double tap.
     */

    if(
      e.changedTouches.length!==1
    ){

      lastTap=0;

      return;

    }


    const now =
      Date.now();


    if(
      now-lastTap<300
    ){

      /*
       * Double tap:
       * 100% <-> 200%
       */

      zoom =
        zoom>1
        ? 1
        : 2;


      apply();


      show(
        Math.round(zoom*100)+"%"
      );


      lastTap=0;

    }else{

      lastTap=now;

    }

  },
  {
    passive:true
  }
);


/* ==========================================
   DOUBLE TAP TIMER
   ========================================== */

let lastTap=0;


/* ==========================================
   DISABLE CONTEXT MENU
   ========================================== */

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);


/* ==========================================
   DISABLE IMAGE DRAG
   ========================================== */

document.addEventListener(
  "dragstart",
  function(e){

    e.preventDefault();

  }
);


/* ==========================================
   DISABLE PRINT / SAVE
   ========================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      (e.ctrlKey || e.metaKey) &&
      ["p","s"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }
);

</script>


</body>
</html>
