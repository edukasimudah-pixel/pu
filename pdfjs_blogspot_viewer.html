<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SehatiCenter V3</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial}#top{position:fixed;top:0;left:0;right:0;height:56px;background:#111;display:flex;align-items:center;gap:8px;padding:8px;z-index:9}.logo{font-weight:700;color:#60a5fa;margin-right:auto}.b{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:8px 10px}#prog{position:fixed;top:56px;left:0;right:0;height:3px;background:#222}.bar{height:100%;width:0;background:#60a5fa}#wrap{padding-top:60px;overflow:auto;height:100vh;touch-action:none}canvas{display:block;width:100%;max-width:760px;margin:0 auto 2px;background:#fff}.dark canvas{filter:invert(1) hue-rotate(180deg)}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;padding:10px 14px;border-radius:18px;display:none}</style></head><body><div id=top><div class=logo>SEHATICENTER</div><button class=b onclick=zin()>+</button><button class=b onclick=zout()>-</button><button class=b onclick=dark()>🌙</button><button class=b onclick=mark()>🔖</button><button class=b onclick=fs()>⛶</button></div><div id=prog><div class=bar id=bar></div></div><div id=wrap><div id=view></div></div><div id=toast></div><script type=module>import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs';const c=new URLSearchParams(location.search).get('comic')||'Dwikora.pdf';const pdf=await pdfjsLib.getDocument(c).promise;const v=document.getElementById('view');for(let i=1;i<=pdf.numPages;i++){let p=await pdf.getPage(i);let vp=p.getViewport({scale:1.6});let cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;v.appendChild(cv)}let m=localStorage.getItem('bm_'+c);if(m)document.getElementById('wrap').scrollTop=+m;</script><script>let z=1;const w=document.getElementById('wrap');const v=document.getElementById('view');const t=document.getElementById('toast');const show=s=>{t.innerText=s;t.style.display='block';setTimeout(()=>t.style.display='none',1200)};const apply=()=>{v.style.transform='scale('+z+')';v.style.transformOrigin='top center';v.style.paddingBottom=((z-1)*120)+'vh'};window.zin=()=>{z=Math.min(3,z+.2);apply();show(Math.round(z*100)+'%')};window.zout=()=>{z=Math.max(.5,z-.2);apply();show(Math.round(z*100)+'%')};window.dark=()=>{document.body.classList.toggle('dark');show(document.body.classList.contains('dark')?'Gelap':'Terang')};window.mark=()=>{const c=new URLSearchParams(location.search).get('comic')||'Dwikora.pdf';localStorage.setItem('bm_'+c,w.scrollTop);show('Bookmark')};window.fs=()=>!document.fullscreenElement?document.documentElement.requestFullscreen():document.exitFullscreen();w.addEventListener('scroll',()=>{const p=(w.scrollTop/(w.scrollHeight-w.clientHeight))*100;bar.style.width=p+'%'});let sd=0;w.addEventListener('touchstart',e=>{if(e.touches.length==2)sd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:false});w.addEventListener('touchmove',e=>{if(e.touches.length==2){e.preventDefault();let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);z=Math.max(.5,Math.min(3,z*(d/sd)));sd=d;apply()}},{passive:false});let last=0;w.addEventListener('touchend',e=>{let n=Date.now();if(n-last<280){z=z>1?1:2;apply();show('Zoom '+Math.round(z*100)+'%')}last=n});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase())){e.preventDefault();show('Blok')}});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());</script></body></html>
