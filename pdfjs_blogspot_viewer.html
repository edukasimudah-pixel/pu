<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>PDF Reader</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

iframe{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    display:block;
}
</style>
</head>

<body>

<iframe
    id="pdfViewer"
    allow="fullscreen"
    allowfullscreen>
</iframe>

<script>

/*
========================================================
PDF FILE
========================================================

Contoh URL:

reader.html?comic=Dwikora.pdf

reader.html?comic=Hoegeng.pdf

reader.html?comic=AhmadDahlan.pdf
========================================================
*/

const params =
new URLSearchParams(
    window.location.search
);

const pdfFile =
params.get("comic") || "Dwikora.pdf";


/*
========================================================
BUAT URL PDF ABSOLUT
========================================================
*/

const pdfURL =
new URL(
    pdfFile,
    window.location.href
).href;


/*
========================================================
PDF.JS VIEWER
========================================================
*/

const viewerURL =
"https://mozilla.github.io/pdf.js/web/viewer.html";


/*
========================================================
BUKA PDF.JS
========================================================
*/

document.getElementById("pdfViewer").src =
viewerURL +
"?file=" +
encodeURIComponent(pdfURL);

</script>

</body>
</html>
