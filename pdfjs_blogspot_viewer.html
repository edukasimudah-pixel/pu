<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pertarungan Udara Operasi Dwikora 1964</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

/* JUDUL */
#judul{
  background:#fff;
  color:#1F3B5B;
  padding:16px;
  font-size:28px;
  font-weight:700;
  line-height:1.2;
}

/* TOOLBAR */
#top{
  position:sticky;
  top:0;
  background:#111;
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:10px;
  z-index:1000;
}
.btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:8px;
  background:#2563EB;
  color:#fff;
  font-size:18px;
}

/* PROGRESS */
#progress{height:3px;background:#222;position:sticky;top:60px;z-index:999}
#bar{height:100%;width:0;background:#60A5FA}

/* PDF */
#viewer{
  max-width:780px;
  margin:auto;
  transform-origin:top center;
}
canvas{
  display:block;
  width:100%;
  height:auto;
  background:#fff;
  margin-bottom:2px;
}
.dark canvas{filter:invert(1) hue-rotate(180deg)}

/* THUMBNAIL */
#thumbs{
  position:fixed;
  right:-140px;
  top:120px;
  width:130px;
  height:70vh;
  background:#111;
  overflow-y:auto;
  transition:.25s;
  padding:6px;
  border-left:1px solid #333;
}
#thumbs.show{right:0}
.thumb{width:100%;display:block;margin-bottom:6px;border-radius:4px;border:1px solid #333}

#thumbBtn{
  position:fixed;
  right:14px;
  bottom:18px;
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#2563EB;
  color:#fff;
  font-size:22px;
}

#toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111;
  padding:10px 16px;
  border-radius:20px;
  display:none;
}
</style>
</head>
<body>

<h1 id="judul">Pertarungan Udara Operasi Dwikora 1964</h1>

<div id="top">
  <button class="btn" onclick="zoomOut()">−</button>
  <button class="btn" onclick="zoomIn()">+</button>
  <button class="btn" onclick="toggleDark()">🌙</button>
  <button class="btn" onclick="saveBookmark()">🔖</button>
  <button class="btn" onclick="goFull()">⛶</button>
</div>

<div id="progress"><div id="bar"></div></div>

<div id="viewer"></div>

<div id="thumbs"></div>
<button id="thumbBtn" onclick="toggleThumbs()">☰</button>
<div id="toast"></div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

const comic=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";
const pdf=await pdfjsLib.getDocument(comic).promise;
const viewer=document.getElementById("viewer");
const thumbs=document.getElementById("thumbs");

for(let i=1;i<=pdf.numPages;i++){
  const page=await pdf.getPage(i);

  const vp=page.getViewport({scale:1.6});
  const c=document.createElement("canvas");
  c.width=vp.width;
  c.height=vp.height;

  await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  viewer.appendChild(c);

  const tv=page.getViewport({scale:.22});
  const t=document.createElement("canvas");
  t.width=tv.width;
  t.height=tv.height;

  await page.render({canvasContext:t.getContext("2d"),viewport:tv}).promise;
  t.className="thumb";
  t.onclick=()=>{
    c.scrollIntoView({behavior:"smooth"});
    thumbs.classList.remove("show");
  };
  thumbs.appendChild(t);
}

const pos=localStorage.getItem("bm_"+comic);
if(pos) window.scrollTo(0,Number(pos));
</script>

<script>
let zoom=1;
const viewer=document.getElementById("viewer");
const toast=document.getElementById("toast");

function show(t){toast.innerText=t;toast.style.display="block";setTimeout(()=>toast.style.display="none",900)}

function apply(){
  viewer.style.transform=`scale(${zoom})`;
  viewer.style.marginBottom=((zoom-1)*140)+"vh";
}

function zoomIn(){zoom=Math.min(3,zoom+.2);apply();show(Math.round(zoom*100)+"%")}
function zoomOut(){zoom=Math.max(.5,zoom-.2);apply();show(Math.round(zoom*100)+"%")}
function toggleDark(){document.body.classList.toggle("dark")}
function toggleThumbs(){document.getElementById("thumbs").classList.toggle("show")}

function saveBookmark(){
 const comic=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";
 localStorage.setItem("bm_"+comic,window.scrollY);
 show("Bookmark");
}

function goFull(){
 if(!document.fullscreenElement){
   document.documentElement.requestFullscreen();
 }else document.exitFullscreen();
}

window.addEventListener("scroll",()=>{
 const h=document.documentElement;
 const p=(h.scrollTop/(h.scrollHeight-h.clientHeight))*100;
 document.getElementById("bar").style.width=p+"%";
});

let last=0;
document.addEventListener("touchend",()=>{
 const now=Date.now();
 if(now-last<250){zoom=zoom>1?1:2;apply();}
 last=now;
},{passive:true});

let start=0,base=1;
document.addEventListener("touchstart",e=>{
 if(e.touches.length===2){
  start=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  base=zoom;
 }
},{passive:true});

document.addEventListener("touchmove",e=>{
 if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  zoom=Math.max(.5,Math.min(3,base*(d/start)));
  apply();
 }
},{passive:true});

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&["p","s"].includes(e.key.toLowerCase())) e.preventDefault();
});
</script>

</body>
</html>
