<div style="max-width:820px;margin:auto;">

  <h1 style="
    font-size:36px;
    font-weight:700;
    line-height:1.2;
    color:#1F3B5B;
    margin:12px 0 18px;
    text-align:left;">
    Pertarungan Udara Operasi Dwikora 1964
  </h1>

  <iframe
    src="https://edukasimudah-pixel.github.io/pu/pdfjs_blogspot_viewer.html?comic=Dwikora.pdf&v=5"
    width="100%"
    height="1000"
    style="border:0;border-radius:10px;"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SehatiCenter Reader</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  background:#0b0b0b;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

/* HEADER */
#top{
  position:fixed;
  top:0;left:0;right:0;
  height:56px;
  background:#111;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  z-index:999;
}
.spacer{flex:1}
.btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:8px;
  background:#2563EB;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* PROGRESS */
#progress{
  position:fixed;
  top:56px;
  left:0;right:0;
  height:3px;
  background:#222;
  z-index:998;
}
#bar{
  width:0;
  height:100%;
  background:#60A5FA;
}

/* READER */
#reader{
  position:fixed;
  top:59px;
  bottom:0;
  left:0;
  right:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}

#viewer{
  max-width:780px;
  margin:auto;
  transform-origin:top center;
}

canvas{
  display:block;
  width:100%;
  background:#fff;
  margin-bottom:2px;
}

.dark canvas{
  filter:invert(1) hue-rotate(180deg);
}

/* THUMB */
#thumbs{
  position:fixed;
  right:-140px;
  top:60px;
  width:130px;
  height:calc(100vh - 70px);
  background:#111;
  overflow-y:auto;
  border-left:1px solid #333;
  transition:.25s;
  z-index:1000;
  padding:6px;
}
#thumbs.show{right:0}
.thumb{
  width:100%;
  display:block;
  margin-bottom:6px;
  border-radius:4px;
  cursor:pointer;
}

/* FLOAT */
#thumbBtn{
  position:fixed;
  right:14px;
  bottom:18px;
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#2563EB;
  color:#fff;
  font-size:22px;
  z-index:1001;
}

/* TOAST */
#toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:10px 16px;
  border-radius:20px;
  display:none;
  z-index:1002;
}
</style>
</head>

<body>

<div id="top">
  <div class="spacer"></div>

  <button class="btn" onclick="zoomOut()">−</button>
  <button class="btn" onclick="zoomIn()">+</button>
  <button class="btn" onclick="toggleDark()">🌙</button>
  <button class="btn" onclick="saveBookmark()">🔖</button>
  <button class="btn" onclick="goFull()">⛶</button>
</div>

<div id="progress"><div id="bar"></div></div>

<div id="reader">
  <div id="viewer"></div>
</div>

<div id="thumbs"></div>
<button id="thumbBtn" onclick="toggleThumbs()">☰</button>
<div id="toast"></div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

const comic =
new URLSearchParams(location.search).get("comic") || "Dwikora.pdf";

const pdf = await pdfjsLib.getDocument(comic).promise;

const viewer = document.getElementById("viewer");
const thumbs = document.getElementById("thumbs");

for(let i=1;i<=pdf.numPages;i++){

 const page=await pdf.getPage(i);

 const vp=page.getViewport({scale:1.6});

 const c=document.createElement("canvas");
 c.width=vp.width;
 c.height=vp.height;

 await page.render({
   canvasContext:c.getContext("2d"),
   viewport:vp
 }).promise;

 viewer.appendChild(c);

 const tv=page.getViewport({scale:.22});

 const t=document.createElement("canvas");
 t.width=tv.width;
 t.height=tv.height;

 await page.render({
   canvasContext:t.getContext("2d"),
   viewport:tv
 }).promise;

 t.className="thumb";

 t.onclick=()=>{
   c.scrollIntoView({
     behavior:"smooth",
     block:"start"
   });

   thumbs.classList.remove("show");
 };

 thumbs.appendChild(t);
}

const pos=localStorage.getItem("bm_"+comic);

if(pos){
 document.getElementById("reader").scrollTop=Number(pos);
}
</script>

<script>
let zoom=1;

const reader=document.getElementById("reader");
const viewer=document.getElementById("viewer");
const toast=document.getElementById("toast");

function show(t){
 toast.innerText=t;
 toast.style.display="block";
 setTimeout(()=>toast.style.display="none",1000);
}

function apply(){
 viewer.style.transform=`scale(${zoom})`;
 viewer.style.paddingBottom=((zoom-1)*120)+"vh";
}

function zoomIn(){
 zoom=Math.min(3,zoom+.2);
 apply();
 show(Math.round(zoom*100)+"%");
}

function zoomOut(){
 zoom=Math.max(.5,zoom-.2);
 apply();
 show(Math.round(zoom*100)+"%");
}

function toggleDark(){
 document.body.classList.toggle("dark");
}

function goFull(){
 if(!document.fullscreenElement){
   document.documentElement.requestFullscreen();
 }else{
   document.exitFullscreen();
 }
}

function saveBookmark(){
 const comic=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";

 localStorage.setItem(
   "bm_"+comic,
   reader.scrollTop
 );

 show("Bookmark");
}

function toggleThumbs(){
 document.getElementById("thumbs")
 .classList.toggle("show");
}

reader.addEventListener("scroll",()=>{

 const p=
 reader.scrollTop/
 (reader.scrollHeight-reader.clientHeight)*100;

 document.getElementById("bar").style.width=p+"%";

});

/* DOUBLE TAP */
let lastTap=0;

reader.addEventListener("touchend",()=>{

 const now=Date.now();

 if(now-lastTap<250){

   zoom=zoom>1?1:2;

   apply();

 }

 lastTap=now;

});

/* PINCH */
let startDist=0;
let baseZoom=1;

reader.addEventListener("touchstart",e=>{

 if(e.touches.length===2){

   startDist=Math.hypot(

     e.touches[0].clientX-e.touches[1].clientX,

     e.touches[0].clientY-e.touches[1].clientY

   );

   baseZoom=zoom;

 }

},{passive:true});

reader.addEventListener("touchmove",e=>{

 if(e.touches.length===2){

   const dist=Math.hypot(

     e.touches[0].clientX-e.touches[1].clientX,

     e.touches[0].clientY-e.touches[1].clientY

   );

   zoom=Math.max(.5,Math.min(3,baseZoom*(dist/startDist)));

   apply();

 }

},{passive:true});

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());

document.addEventListener("keydown",e=>{

 if((e.ctrlKey||e.metaKey)&&["p","s"].includes(e.key.toLowerCase())){

   e.preventDefault();

 }

});
</script>

</body>
</html>
