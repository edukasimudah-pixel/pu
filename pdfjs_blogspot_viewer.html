<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SehatiCenter V5</title>
<style>
*{margin:0;box-sizing:border-box}html,body{height:100%;background:#000;color:#fff;font-family:Arial}
#top{position:fixed;top:0;left:0;right:0;height:54px;background:#111;display:flex;align-items:center;padding:8px;gap:6px;z-index:5}
.logo{color:#60a5fa;font-weight:700;margin-right:auto}.btn{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:8px 10px}
#barWrap{position:fixed;top:54px;left:0;right:0;height:3px;background:#222;z-index:5}#bar{height:100%;width:0;background:#60a5fa}
#reader{position:fixed;top:57px;bottom:0;left:0;right:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y pinch-zoom}
#viewer{max-width:820px;margin:auto;transform-origin:top center}
canvas{display:block;width:100%;height:auto;background:#fff;margin-bottom:2px}.dark canvas{filter:invert(1) hue-rotate(180deg)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;padding:10px 14px;border-radius:18px;display:none;z-index:9}
</style></head>
<body>
<div id="top"><div class="logo">SEHATICENTER</div><button class="btn" onclick="zoom(-.2)">−</button><button class="btn" onclick="zoom(.2)">+</button><button class="btn" onclick="toggleDark()">🌙</button><button class="btn" onclick="bookmark()">🔖</button><button class="btn" onclick="fs()">⛶</button></div>
<div id="barWrap"><div id="bar"></div></div><div id="reader"><div id="viewer"></div></div><div id="toast"></div>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";
const comic=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";
const pdf=await pdfjsLib.getDocument(comic).promise;const v=document.getElementById("viewer");
for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i);const vp=p.getViewport({scale:1.6});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;v.appendChild(c)}
const pos=localStorage.getItem("bm_"+comic);if(pos)document.getElementById("reader").scrollTop=+pos;
</script>
<script>
let scale=1;const reader=document.getElementById("reader"),viewer=document.getElementById("viewer"),toast=document.getElementById("toast");
const show=t=>{toast.textContent=t;toast.style.display="block";setTimeout(()=>toast.style.display="none",900)};
function apply(){viewer.style.transform=`scale(${scale})`;viewer.style.paddingBottom=((scale-1)*120)+"vh"}
window.zoom=d=>{scale=Math.max(.6,Math.min(3,scale+d));apply();show(Math.round(scale*100)+"%")};
window.toggleDark=()=>document.body.classList.toggle("dark");
window.bookmark=()=>{const c=new URLSearchParams(location.search).get("comic")||"Dwikora.pdf";localStorage.setItem("bm_"+c,reader.scrollTop);show("Bookmark")};
window.fs=()=>!document.fullscreenElement?document.documentElement.requestFullscreen():document.exitFullscreen();
reader.addEventListener("scroll",()=>{const p=reader.scrollTop/(reader.scrollHeight-reader.clientHeight)*100;bar.style.width=p+"%"});
let start=0,base=1;
reader.addEventListener("touchstart",e=>{if(e.touches.length===2){start=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);base=scale}},{passive:true});
reader.addEventListener("touchmove",e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);scale=Math.max(.6,Math.min(3,base*d/start));apply()}},{passive:true});
let last=0;reader.addEventListener("touchend",()=>{const n=Date.now();if(n-last<250){scale=scale>1?1:2;apply();show("Zoom")}last=n});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["p","s"].includes(e.key.toLowerCase()))e.preventDefault()});
document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("dragstart",e=>e.preventDefault());
</script></body></html>
