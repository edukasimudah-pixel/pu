<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               viewport-fit=cover">

<title>PDF Reader</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;

  background:#0b0b0b;
  color:#fff;

  font-family:Arial,sans-serif;

  overflow-x:hidden;
}


/* =====================================================
   TOOLBAR
   ===================================================== */

#top{
  position:fixed;

  top:0;
  left:0;
  right:0;

  height:56px;

  background:#111;

  display:flex;
  justify-content:flex-end;
  align-items:center;

  gap:8px;

  padding:8px 12px;

  z-index:10000;
}

.btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:8px;

  background:#2563EB;

  color:#fff;

  font-size:18px;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   PROGRESS
   ===================================================== */

#progress{
  position:fixed;

  top:56px;
  left:0;
  right:0;

  height:3px;

  background:#222;

  z-index:9999;
}

#bar{
  width:0;
  height:100%;

  background:#60A5FA;
}


/* =====================================================
   NORMAL READER
   ===================================================== */

#normalReader{

  margin-top:59px;

  width:100%;

  background:#0b0b0b;
}

#normalPages{

  width:100%;

  max-width:780px;

  margin:auto;
}


/* =====================================================
   NORMAL PAGE
   ===================================================== */

.normalPage{

  display:block;

  width:100%;

  height:auto;

  background:#fff;

  margin-bottom:2px;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  pointer-events:none;
}


/* =====================================================
   ZOOM VIEWPORT
   ===================================================== */

#zoomViewport{

  display:none;

  position:fixed;

  top:59px;
  left:0;
  right:0;
  bottom:0;

  overflow:hidden;

  background:#0b0b0b;

  z-index:20;

  touch-action:none;

  overscroll-behavior:none;
}


/* =====================================================
   ZOOM CANVAS AREA
   ===================================================== */

#zoomPages{

  position:absolute;

  left:0;
  top:0;

  transform-origin:0 0;

  will-change:transform;
}


/* =====================================================
   ZOOM PAGE
   ===================================================== */

.zoomPage{

  display:block;

  background:#fff;

  margin-bottom:2px;

  user-select:none;
  -webkit-user-select:none;

  -webkit-touch-callout:none;

  pointer-events:none;
}


/* =====================================================
   DARK MODE
   ===================================================== */

.dark .normalPage,
.dark .zoomPage{

  filter:invert(1) hue-rotate(180deg);

}


/* =====================================================
   THUMBNAILS
   ===================================================== */

#thumbs{

  position:fixed;

  top:70px;

  right:-140px;

  width:130px;

  height:calc(100vh - 90px);

  padding:6px;

  background:#111;

  border-left:1px solid #333;

  overflow-y:auto;

  transition:.25s;

  z-index:10001;

  -webkit-overflow-scrolling:touch;
}

#thumbs.show{
  right:0;
}

.thumb{

  width:100%;

  height:auto;

  display:block;

  margin-bottom:6px;

  border:1px solid #333;

  border-radius:4px;

  cursor:pointer;

  touch-action:manipulation;

}


/* =====================================================
   THUMB BUTTON
   ===================================================== */

#thumbBtn{

  position:fixed;

  right:14px;
  bottom:18px;

  width:52px;
  height:52px;

  border:0;

  border-radius:50%;

  background:#2563EB;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  z-index:10002;

  touch-action:manipulation;
}


/* =====================================================
   TOAST
   ===================================================== */

#toast{

  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  padding:10px 16px;

  background:#111;

  color:#fff;

  border-radius:20px;

  display:none;

  z-index:10003;

  white-space:nowrap;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

  #top{

    height:52px;

    padding:6px 8px;

    gap:6px;
  }

  .btn{

    width:38px;
    height:38px;

    font-size:17px;
  }

  #progress{
    top:52px;
  }

  #normalReader{
    margin-top:55px;
  }

  #zoomViewport{
    top:55px;
  }

}


/* =====================================================
   SMALL MOBILE
   ===================================================== */

@media(max-width:380px){

  #top{
    gap:4px;
    padding-left:5px;
    padding-right:5px;
  }

  .btn{
    width:36px;
    height:36px;
    font-size:16px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     TOOLBAR
     ===================================================== -->

<div id="top">

  <button class="btn"
          onclick="zoomOut()">
    −
  </button>

  <button class="btn"
          onclick="zoomIn()">
    +
  </button>

  <button class="btn"
          onclick="toggleDark()">
    🌙
  </button>

  <button class="btn"
          onclick="saveBookmark()">
    🔖
  </button>

  <button class="btn"
          onclick="goFull()">
    ⛶
  </button>

</div>


<!-- =====================================================
     PROGRESS
     ===================================================== -->

<div id="progress">
  <div id="bar"></div>
</div>


<!-- =====================================================
     NORMAL MODE
     ===================================================== -->

<div id="normalReader">

  <div id="normalPages"></div>

</div>


<!-- =====================================================
     ZOOM MODE
     ===================================================== -->

<div id="zoomViewport">

  <div id="zoomPages"></div>

</div>


<!-- =====================================================
     THUMBNAILS
     ===================================================== -->

<div id="thumbs"></div>

<button id="thumbBtn"
        onclick="toggleThumbs()">
  ☰
</button>


<div id="toast"></div>


<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";


/* =====================================================
   PDF.JS WORKER
   ===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";


/* =====================================================
   PDF NAME
   ===================================================== */

const comic =
new URLSearchParams(location.search).get("comic")
|| "Dwikora.pdf";


/* =====================================================
   ELEMENT
   ===================================================== */

const normalPages =
document.getElementById("normalPages");

const zoomPages =
document.getElementById("zoomPages");

const thumbs =
document.getElementById("thumbs");


/* =====================================================
   LOAD PDF
   ===================================================== */

const pdf =
await pdfjsLib.getDocument(comic).promise;


/* =====================================================
   PAGE DATA
   ===================================================== */

const pageData=[];


/* =====================================================
   RENDER
   ===================================================== */

for(
  let i=1;
  i<=pdf.numPages;
  i++
){

  const page =
  await pdf.getPage(i);


  /*
   * Ukuran dasar PDF.
   */

  const baseViewport =
  page.getViewport({
    scale:1
  });


  pageData.push({

    page:page,

    width:baseViewport.width,

    height:baseViewport.height

  });


  /* =================================================
     NORMAL CANVAS
     ================================================= */

  const normalScale =
    1.6;


  const normalViewport =
  page.getViewport({
    scale:normalScale
  });


  const normalCanvas =
  document.createElement("canvas");


  normalCanvas.width =
  normalViewport.width;


  normalCanvas.height =
  normalViewport.height;


  normalCanvas.className=
    "normalPage";


  normalCanvas.dataset.page=i;


  await page.render({

    canvasContext:
      normalCanvas.getContext("2d"),

    viewport:
      normalViewport

  }).promise;


  normalPages.appendChild(
    normalCanvas
  );


  /* =================================================
     THUMBNAIL
     ================================================= */

  const thumbViewport =
  page.getViewport({
    scale:.22
  });


  const thumb =
  document.createElement("canvas");


  thumb.width =
  thumbViewport.width;


  thumb.height =
  thumbViewport.height;


  thumb.className="thumb";


  thumb.dataset.page=i;


  await page.render({

    canvasContext:
      thumb.getContext("2d"),

    viewport:
      thumbViewport

  }).promise;


  thumb.onclick=()=>{

    goToPage(i);

    thumbs.classList.remove(
      "show"
    );

  };


  thumbs.appendChild(
    thumb
  );

}


/* =====================================================
   INITIAL BOOKMARK
   ===================================================== */

const saved =
localStorage.getItem(
  "bm_"+comic
);


if(saved){

  try{

    const data =
    JSON.parse(saved);


    if(
      data &&
      typeof data.scrollY==="number"
    ){

      setTimeout(()=>{

        window.scrollTo(
          0,
          data.scrollY
        );

      },200);

    }

  }catch(e){}

}

</script>


<script>

/* =====================================================
   STATE
   ===================================================== */

let zoom=1;


/*
 * Posisi viewport terhadap dokumen zoom.
 */

let offsetX=0;
let offsetY=0;


/*
 * Posisi normal sebelum zoom.
 */

let normalScrollY=0;


/*
 * Ukuran dasar zoom.
 */

const BASE_WIDTH=780;


/*
 * Touch state.
 */

let pinching=false;
let panning=false;


/*
 * Pinch.
 */

let pinchStartDistance=0;
let pinchStartZoom=1;


/*
 * Titik PDF di bawah pinch.
 */

let pinchPdfX=0;
let pinchPdfY=0;


/*
 * Pan.
 */

let panStartX=0;
let panStartY=0;

let panStartOffsetX=0;
let panStartOffsetY=0;


/*
 * Double tap.
 */

let lastTap=0;


/*
 * Mouse.
 */

let mouseDown=false;

let mouseStartX=0;
let mouseStartY=0;

let mouseStartOffsetX=0;
let mouseStartOffsetY=0;


/* =====================================================
   ELEMENT
   ===================================================== */

const zoomViewport =
document.getElementById(
  "zoomViewport"
);

const zoomPages =
document.getElementById(
  "zoomPages"
);

const normalReader =
document.getElementById(
  "normalReader"
);

const toast =
document.getElementById(
  "toast"
);


/* =====================================================
   TOAST
   ===================================================== */

function show(text){

  toast.innerText=text;

  toast.style.display="block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer=
  setTimeout(()=>{

    toast.style.display="none";

  },900);

}


/* =====================================================
   GET NORMAL PAGE
   ===================================================== */

function getNormalPage(){

  const pages =
  normalReader.querySelectorAll(
    ".normalPage"
  );


  const scroll =
    window.scrollY;


  let current=1;


  for(
    let i=0;
    i<pages.length;
    i++
  ){

    if(
      pages[i].offsetTop<=scroll
    ){

      current=i+1;

    }else{

      break;

    }

  }


  return current;

}


/* =====================================================
   BUILD ZOOM DOCUMENT
   ===================================================== */

async function buildZoom(){

  /*
   * Bersihkan zoom document.
   */

  zoomPages.innerHTML="";


  /*
   * Gunakan canvas baru dengan
   * resolusi tinggi.
   */

  for(
    let i=0;
    i<pageData.length;
    i++
  ){

    const data=
      pageData[i];


    const scale=
      1.6;


    const vp=
      data.page.getViewport({
        scale:scale
      });


    const canvas=
      document.createElement(
        "canvas"
      );


    canvas.width=
      vp.width;

    canvas.height=
      vp.height;


    canvas.className=
      "zoomPage";


    canvas.dataset.page=
      i+1;


    await data.page.render({

      canvasContext:
        canvas.getContext("2d"),

      viewport:vp

    }).promise;


    zoomPages.appendChild(
      canvas
    );

  }

}


/* =====================================================
   GET PDF DOCUMENT SIZE
   ===================================================== */

function documentSize(){

  return {

    width:
      zoomPages.scrollWidth,

    height:
      zoomPages.scrollHeight

  };

}


/* =====================================================
   LIMIT OFFSET
   ===================================================== */

function limitOffset(){

  /*
   * Zoom document sebenarnya diperbesar
   * melalui transform.
   */

  const rect=
    zoomPages.getBoundingClientRect();


  const rawWidth=
    zoomPages.offsetWidth;


  const rawHeight=
    zoomPages.offsetHeight;


  const width=
    rawWidth*zoom;


  const height=
    rawHeight*zoom;


  const vw=
    zoomViewport.clientWidth;


  const vh=
    zoomViewport.clientHeight;


  /*
   * Horizontal.
   */

  if(width<=vw){

    offsetX=
      (vw-width)/2;

  }else{

    offsetX=
      Math.min(
        0,
        Math.max(
          vw-width,
          offsetX
        )
      );

  }


  /*
   * Vertical.
   */

  if(height<=vh){

    offsetY=
      (vh-height)/2;

  }else{

    offsetY=
      Math.min(
        0,
        Math.max(
          vh-height,
          offsetY
        )
      );

  }

}


/* =====================================================
   APPLY ZOOM
   ===================================================== */

function applyZoom(){

  limitOffset();


  zoomPages.style.transform=
    "translate3d("+
    offsetX+"px,"+
    offsetY+"px,0) "+
    "scale("+zoom+")";


  updateProgress();

}


/* =====================================================
   ENTER ZOOM
   ===================================================== */

async function enterZoom(){

  if(
    document.body.classList.contains(
      "zooming"
    )
  ){

    return;

  }


  /*
   * Simpan posisi browser.
   */

  normalScrollY=
    window.scrollY;


  /*
   * Render zoom document.
   */

  await buildZoom();


  /*
   * Aktifkan viewport.
   */

  document.body.classList.add(
    "zooming"
  );


  /*
   * Cari halaman yang sedang dibaca.
   */

  const pageNumber=
    getNormalPage();


  const normalPages=
    normalReader.querySelectorAll(
      ".normalPage"
    );


  const page=
    normalPages[pageNumber-1];


  /*
   * Posisi PDF yang sedang terlihat.
   */

  const pageTop=
    page
      ? page.offsetTop
      : normalScrollY;


  /*
   * Pindahkan PDF agar halaman
   * yang sedang dibaca tetap terlihat.
   */

  offsetX=
    (
      zoomViewport.clientWidth-
      zoomPages.offsetWidth*zoom
    )/2;


  offsetY=
    -pageTop*zoom;


  /*
   * Jangan langsung batasi terlalu agresif.
   */

  applyZoom();

}


/* =====================================================
   EXIT ZOOM
   ===================================================== */

function exitZoom(){

  /*
   * -----------------------------------------------
   * Tentukan posisi PDF yang sedang terlihat.
   * -----------------------------------------------
   */

  const pdfY=
    Math.max(
      0,
      -offsetY/zoom
    );


  /*
   * Cari halaman zoom.
   */

  const pages=
    zoomPages.querySelectorAll(
      ".zoomPage"
    );


  let pageNumber=1;

  let pageTop=0;


  for(
    let i=0;
    i<pages.length;
    i++
  ){

    const top=
      pages[i].offsetTop;


    if(
      top<=pdfY
    ){

      pageNumber=i+1;

      pageTop=top;

    }else{

      break;

    }

  }


  /*
   * Posisi relatif halaman.
   */

  const pageOffset=
    pdfY-pageTop;


  /*
   * Matikan zoom.
   */

  document.body.classList.remove(
    "zooming"
  );


  zoomPages.style.transform=
    "none";


  /*
   * Kembali 100%.
   */

  zoom=1;

  offsetX=0;
  offsetY=0;


  /*
   * Tunggu browser menyusun layout.
   */

  requestAnimationFrame(()=>{

    requestAnimationFrame(()=>{

      const normalPages=
        normalReader.querySelectorAll(
          ".normalPage"
        );


      const page=
        normalPages[pageNumber-1];


      if(page){

        window.scrollTo(

          0,

          page.offsetTop+
          pageOffset

        );

      }else{

        window.scrollTo(
          0,
          normalScrollY
        );

      }


      updateProgress();

    });

  });

}


/* =====================================================
   ZOOM AT POINT
   ===================================================== */

async function zoomAt(
  newZoom,
  x,
  y
){

  /*
   * Mulai dari normal.
   */

  if(zoom<=1){

    /*
     * Simpan browser scroll.
     */

    normalScrollY=
      window.scrollY;


    /*
     * Bangun zoom.
     */

    await buildZoom();


    /*
     * Aktifkan.
     */

    document.body.classList.add(
      "zooming"
    );


    /*
     * Posisi PDF berdasarkan posisi
     * halaman yang sedang dibaca.
     */

    const pageNumber=
      getPageAtScroll(
        normalScrollY
      );


    const normalPages=
      normalReader.querySelectorAll(
        ".normalPage"
      );


    const page=
      normalPages[pageNumber-1];


    const pageTop=
      page
      ? page.offsetTop
      : normalScrollY;


    /*
     * Titik PDF relatif terhadap halaman.
     */

    const relative=
      normalScrollY-pageTop;


    /*
     * Cari page zoom yang sama.
     */

    const zoomPage=
      zoomPages.querySelectorAll(
        ".zoomPage"
      )[pageNumber-1];


    const zoomPageTop=
      zoomPage
      ? zoomPage.offsetTop
      : pageTop;


    /*
     * PDF coordinate.
     */

    const pdfX=
      zoomPages.offsetWidth/2;


    const pdfY=
      zoomPageTop+
      relative;


    zoom=
      Math.max(
        1.01,
        Math.min(
          3,
          newZoom
        )
      );


    /*
     * Pertahankan titik PDF.
     */

    offsetX=
      x-
      pdfX*zoom;


    offsetY=
      y-
      pdfY*zoom;


    applyZoom();


    return;

  }


  /*
   * Sudah zoom.
   */

  const pdfX=
    (x-offsetX)/
    zoom;


  const pdfY=
    (y-offsetY)/
    zoom;


  zoom=
    Math.max(
      1,
      Math.min(
        3,
        newZoom
      )
    );


  if(zoom<=1){

    exitZoom();

    return;

  }


  offsetX=
    x-
    pdfX*zoom;


  offsetY=
    y-
    pdfY*zoom;


  applyZoom();

}


/* =====================================================
   GET PAGE FROM NORMAL SCROLL
   ===================================================== */

function getPageAtScroll(scrollY){

  const pages=
    normalReader.querySelectorAll(
      ".normalPage"
    );


  let page=1;


  for(
    let i=0;
    i<pages.length;
    i++
  ){

    if(
      pages[i].offsetTop<=scrollY
    ){

      page=i+1;

    }else{

      break;

    }

  }


  return page;

}


/* =====================================================
   ZOOM IN
   ===================================================== */

async function zoomIn(){

  const x=
    zoomViewport.clientWidth/2;


  const y=
    zoomViewport.clientHeight/2;


  await zoomAt(
    zoom<=1
      ? 1.2
      : zoom+0.2,
    x,
    y
  );


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* =====================================================
   ZOOM OUT
   ===================================================== */

function zoomOut(){

  if(zoom<=1){

    return;

  }


  const x=
    zoomViewport.clientWidth/2;


  const y=
    zoomViewport.clientHeight/2;


  const newZoom=
    zoom-0.2;


  if(newZoom<=1){

    exitZoom();

    show("100%");

    return;

  }


  zoomAt(
    newZoom,
    x,
    y
  );


  show(
    Math.round(
      newZoom*100
    )+"%"
  );

}


/* =====================================================
   DARK MODE
   ===================================================== */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );

}


/* =====================================================
   THUMBNAILS
   ===================================================== */

function toggleThumbs(){

  document
    .getElementById("thumbs")
    .classList.toggle(
      "show"
    );

}


/* =====================================================
   PAGE NAVIGATION
   ===================================================== */

function goToPage(pageNumber){

  if(zoom<=1){

    const pages=
      normalReader.querySelectorAll(
        ".normalPage"
      );


    const page=
      pages[pageNumber-1];


    if(page){

      window.scrollTo({

        top:page.offsetTop,

        behavior:"smooth"

      });

    }


    return;

  }


  const pages=
    zoomPages.querySelectorAll(
      ".zoomPage"
    );


  const page=
    pages[pageNumber-1];


  if(page){

    offsetY=
      -page.offsetTop*zoom;


    applyZoom();

  }

}


/* =====================================================
   BOOKMARK
   ===================================================== */

function saveBookmark(){

  const data={};


  if(zoom<=1){

    data.scrollY=
      window.scrollY;

  }else{

    data.zoom=
      zoom;

    data.offsetX=
      offsetX;

    data.offsetY=
      offsetY;

  }


  localStorage.setItem(

    "bm_"+comic,

    JSON.stringify(data)

  );


  show(
    "Bookmark tersimpan"
  );

}


/* =====================================================
   FULLSCREEN
   ===================================================== */

function goFull(){

  if(
    !document.fullscreenElement
  ){

    document.documentElement
      .requestFullscreen()
      .catch(()=>{});

  }else{

    document.exitFullscreen();

  }

}


/* =====================================================
   PROGRESS
   ===================================================== */

function updateProgress(){

  const bar=
    document.getElementById(
      "bar"
    );


  if(zoom<=1){

    const doc=
      document.documentElement;


    const max=
      doc.scrollHeight-
      doc.clientHeight;


    const value=
      max>0
      ? doc.scrollTop/max*100
      : 0;


    bar.style.width=
      value+"%";


    return;

  }


  const height=
    zoomPages.offsetHeight*
    zoom;


  const visible=
    zoomViewport.clientHeight;


  const max=
    Math.max(
      0,
      height-visible
    );


  const current=
    Math.max(
      0,
      Math.min(
        max,
        -offsetY
      )
    );


  const value=
    max>0
      ? current/max*100
      : 0;


  bar.style.width=
    value+"%";

}


/* =====================================================
   NORMAL SCROLL
   ===================================================== */

window.addEventListener(
  "scroll",
  function(){

    if(zoom<=1){

      updateProgress();

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   TOUCH DISTANCE
   ===================================================== */

function touchDistance(a,b){

  return Math.hypot(

    a.clientX-
    b.clientX,

    a.clientY-
    b.clientY

  );

}


/* =====================================================
   TOUCH CENTER
   ===================================================== */

function touchCenter(a,b){

  return {

    x:
      (
        a.clientX+
        b.clientX
      )/2,

    y:
      (
        a.clientY+
        b.clientY
      )/2

  };

}


/* =====================================================
   TOUCH START
   ===================================================== */

zoomViewport.addEventListener(
  "touchstart",
  async function(e){

    /*
     * TWO FINGERS
     */

    if(
      e.touches.length===2
    ){

      /*
       * Kalau masih 100%,
       * langsung siapkan zoom.
       */

      if(zoom<=1){

        await enterZoom();

      }


      pinching=true;

      panning=false;


      pinchStartDistance=
        touchDistance(
          e.touches[0],
          e.touches[1]
        );


      pinchStartZoom=
        zoom;


      const c=
        touchCenter(
          e.touches[0],
          e.touches[1]
        );


      pinchPdfX=
        (
          c.x-offsetX
        )/
        zoom;


      pinchPdfY=
        (
          c.y-offsetY
        )/
        zoom;


      lastTap=0;


      return;

    }


    /*
     * ONE FINGER WHEN ZOOMED
     */

    if(
      e.touches.length===1 &&
      zoom>1
    ){

      panning=true;


      panStartX=
        e.touches[0].clientX;


      panStartY=
        e.touches[0].clientY;


      panStartOffsetX=
        offsetX;


      panStartOffsetY=
        offsetY;


      lastTap=0;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH MOVE
   ===================================================== */

zoomViewport.addEventListener(
  "touchmove",
  function(e){

    /*
     * PINCH
     */

    if(
      pinching &&
      e.touches.length===2
    ){

      e.preventDefault();


      const d=
        touchDistance(
          e.touches[0],
          e.touches[1]
        );


      if(
        pinchStartDistance<=0
      ){

        return;

      }


      const c=
        touchCenter(
          e.touches[0],
          e.touches[1]
        );


      let newZoom=
        pinchStartZoom*
        (
          d/
          pinchStartDistance
        );


      newZoom=
        Math.max(
          1.01,
          Math.min(
            3,
            newZoom
          )
        );


      /*
       * Titik PDF tetap.
       */

      zoom=
        newZoom;


      offsetX=
        c.x-
        pinchPdfX*zoom;


      offsetY=
        c.y-
        pinchPdfY*zoom;


      applyZoom();


      return;

    }


    /*
     * PAN
     */

    if(
      panning &&
      e.touches.length===1 &&
      zoom>1
    ){

      e.preventDefault();


      const dx=
        e.touches[0].clientX-
        panStartX;


      const dy=
        e.touches[0].clientY-
        panStartY;


      offsetX=
        panStartOffsetX+
        dx;


      offsetY=
        panStartOffsetY+
        dy;


      applyZoom();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH END
   ===================================================== */

zoomViewport.addEventListener(
  "touchend",
  function(e){

    /*
     * PINCH SELESAI
     */

    if(pinching){

      if(
        e.touches.length<2
      ){

        pinching=false;

        pinchStartDistance=0;


        show(
          Math.round(
            zoom*100
          )+"%"
        );

      }


      return;

    }


    /*
     * PAN SELESAI
     */

    if(panning){

      panning=false;

      return;

    }


    /*
     * DOUBLE TAP
     */

    if(
      e.changedTouches.length!==1
    ){

      lastTap=0;

      return;

    }


    const now=
      Date.now();


    if(
      now-lastTap<300
    ){

      if(zoom<=1){

        const t=
          e.changedTouches[0];


        const rect=
          zoomViewport
          .getBoundingClientRect();


        await zoomAt(
          2,
          t.clientX-rect.left,
          t.clientY-rect.top
        );


      }else{

        exitZoom();

      }


      lastTap=0;

    }else{

      lastTap=now;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   MOUSE PAN
   ===================================================== */

zoomViewport.addEventListener(
  "mousedown",
  function(e){

    if(
      zoom<=1 ||
      e.button!==0
    ){

      return;

    }


    mouseDown=true;


    mouseStartX=
      e.clientX;


    mouseStartY=
      e.clientY;


    mouseStartOffsetX=
      offsetX;


    mouseStartOffsetY=
      offsetY;


    zoomViewport.style.cursor=
      "grabbing";

  }
);


window.addEventListener(
  "mousemove",
  function(e){

    if(
      !mouseDown ||
      zoom<=1
    ){

      return;

    }


    offsetX=
      mouseStartOffsetX+
      (
        e.clientX-
        mouseStartX
      );


    offsetY=
      mouseStartOffsetY+
      (
        e.clientY-
        mouseStartY
      );


    applyZoom();

  }
);


window.addEventListener(
  "mouseup",
  function(){

    if(mouseDown){

      mouseDown=false;

      zoomViewport.style.cursor=
        "default";

    }

  }
);


/* =====================================================
   CTRL + WHEEL ZOOM
   ===================================================== */

zoomViewport.addEventListener(
  "wheel",
  function(e){

    if(!e.ctrlKey){

      return;

    }


    e.preventDefault();


    const rect=
      zoomViewport.getBoundingClientRect();


    const x=
      e.clientX-
      rect.left;


    const y=
      e.clientY-
      rect.top;


    const amount=
      e.deltaY<0
      ? .1
      : -.1;


    zoomAt(
      zoom+amount,
      x,
      y
    );


  },
  {
    passive:false
  }
);


/* =====================================================
   KEYBOARD PAN
   ===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    if(zoom>1){

      const amount=50;


      if(e.key==="ArrowLeft"){

        offsetX+=amount;

        applyZoom();

        e.preventDefault();

      }


      if(e.key==="ArrowRight"){

        offsetX-=amount;

        applyZoom();

        e.preventDefault();

      }


      if(e.key==="ArrowUp"){

        offsetY+=amount;

        applyZoom();

        e.preventDefault();

      }


      if(e.key==="ArrowDown"){

        offsetY-=amount;

        applyZoom();

        e.preventDefault();

      }

    }


    /*
     * Jangan tampilkan print/save
     * lewat shortcut browser.
     */

    if(
      (e.ctrlKey||e.metaKey) &&
      ["p","s"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(zoom>1){

      limitOffset();

      applyZoom();

    }else{

      updateProgress();

    }

  }
);


/* =====================================================
   BLOCK CONTEXT MENU
   ===================================================== */

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);


/* =====================================================
   BLOCK DRAG
   ===================================================== */

document.addEventListener(
  "dragstart",
  function(e){

    e.preventDefault();

  }
);


/* =====================================================
   INITIAL
   ===================================================== */

updateProgress();

</script>

</body>
</html>
