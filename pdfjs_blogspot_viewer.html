<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SehatiCenter Webtoon Reader V4.1</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0b0b0b;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ===== HEADER ===== */
#top{
  position:fixed;
  top:0;left:0;right:0;
  height:56px;
  background:#111;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  z-index:1000;
}
.logo{
  font-weight:700;
  color:#60a5fa;
  margin-right:auto;
}
.btn{
  background:#2563eb;
  color:#fff;
  border:none;
  border-radius:8px;
  padding:8px 10px;
  cursor:pointer;
}

/* ===== PROGRESS ===== */
#progress{
  position:fixed;
  top:56px;
  left:0;right:0;
  height:3px;
  background:#222;
  z-index:999;
}
#bar{
  height:100%;
  width:0;
  background:#60a5fa;
}

/* ===== READER ===== */
#reader{
  position:fixed;
  top:59px;
  bottom:0;
  left:0;
  right:0;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:none;
}

#viewer{
  max-width:780px;
  margin:auto;
  transform-origin:top center;
}

canvas{
  display:block;
  width:100%;
  background:#fff;
  margin-bottom:2px;
}

.dark canvas{
  filter:invert(1) hue-rotate(180deg);
}

/* ===== THUMBNAIL ===== */
#thumbs{
  position:fixed;
  top:60px;
  right:-140px;
  width:130px;
  height:calc(100vh - 70px);
  background:#111;
  border-left:1px solid #333;
  overflow-y:auto;
  transition:right .25s ease;
  padding:6px;
  z-index:1001;
}

#thumbs.show{
  right:0;
}

.thumb{
  width:100%;
  display:block;
  border:1px solid #333;
  border-radius:4px;
  margin-bottom:6px;
  cursor:pointer;
}

/* ===== FLOAT BUTTON ===== */
#thumbBtn{
  position:fixed;
  right:14px;
  bottom:18px;
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#2563EB;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  z-index:1002;
  box-shadow:0 4px 12px rgba(0,0,0,.45);
}

/* ===== TOAST ===== */
#toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:10px 16px;
  border-radius:20px;
  display:none;
  z-index:1003;
}
</style>
</head>

<body>

<div id="top">
  <div class="logo">SEHATICENTER</div>

  <button class="btn" onclick="zoomOut()">−</button>
  <button class="btn" onclick="zoomIn()">+</button>
  <button class="btn" onclick="toggleDark()">🌙</button>
  <button class="btn" onclick="saveBookmark()">🔖</button>
  <button class="btn" onclick="goFull()">⛶</button>
</div>

<div id="progress">
  <div id="bar"></div>
</div>

<div id="reader">
  <div id="viewer"></div>
</div>

<!-- THUMBNAIL PANEL -->
<div id="thumbs"></div>

<!-- FLOAT BUTTON -->
<button id="thumbBtn" onclick="toggleThumbs()">☰</button>

<div id="toast"></div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

// ==========================
const comic =
new URLSearchParams(location.search).get("comic") || "Dwikora.pdf";
// ==========================

const pdf = await pdfjsLib.getDocument(comic).promise;

const viewer = document.getElementById("viewer");
const thumbs = document.getElementById("thumbs");

for(let i=1;i<=pdf.numPages;i++){

  const page = await pdf.getPage(i);

  const vp = page.getViewport({scale:1.6});

  const canvas = document.createElement("canvas");
  canvas.width = vp.width;
  canvas.height = vp.height;

  await page.render({
    canvasContext:canvas.getContext("2d"),
    viewport:vp
  }).promise;

  viewer.appendChild(canvas);

  // THUMBNAIL
  const tv = page.getViewport({scale:0.22});

  const thumb = document.createElement("canvas");
  thumb.width = tv.width;
  thumb.height = tv.height;

  await page.render({
    canvasContext:thumb.getContext("2d"),
    viewport:tv
  }).promise;

  thumb.className = "thumb";

  thumb.onclick = ()=>{
    canvas.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
    thumbs.classList.remove("show");
  };

  thumbs.appendChild(thumb);
}

const pos = localStorage.getItem("bm_"+comic);

if(pos){
  document.getElementById("reader").scrollTop = Number(pos);
}
</script>

<script>
let zoom = 1;

const reader = document.getElementById("reader");
const viewer = document.getElementById("viewer");
const toast = document.getElementById("toast");

function show(msg){
  toast.innerText = msg;
  toast.style.display = "block";
  setTimeout(()=>{
    toast.style.display="none";
  },1000);
}

function applyZoom(){
  viewer.style.transform=`scale(${zoom})`;
  viewer.style.paddingBottom=((zoom-1)*120)+"vh";
}

window.zoomIn=()=>{
  zoom=Math.min(3,zoom+.2);
  applyZoom();
  show(Math.round(zoom*100)+"%");
}

window.zoomOut=()=>{
  zoom=Math.max(.5,zoom-.2);
  applyZoom();
  show(Math.round(zoom*100)+"%");
}

window.toggleDark=()=>{
  document.body.classList.toggle("dark");
}

window.goFull=()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
}

window.saveBookmark=()=>{
  const comic =
  new URLSearchParams(location.search).get("comic") || "Dwikora.pdf";

  localStorage.setItem(
    "bm_"+comic,
    reader.scrollTop
  );

  show("Bookmark");
}

window.toggleThumbs=()=>{
  document.getElementById("thumbs")
  .classList.toggle("show");
}

reader.addEventListener("scroll",()=>{
  const p =
  reader.scrollTop /
  (reader.scrollHeight-reader.clientHeight) *100;

  document.getElementById("bar").style.width=p+"%";
});

// Mouse Wheel Zoom
reader.addEventListener("wheel",e=>{
  if(e.ctrlKey){
    e.preventDefault();

    zoom=Math.max(
      .5,
      Math.min(
        3,
        zoom+(e.deltaY<0?.1:-.1)
      )
    );

    applyZoom();
  }
},{passive:false});

// Pinch Zoom HP
let start=0;

reader.addEventListener("touchstart",e=>{
  if(e.touches.length==2){
    start=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
  }
},{passive:false});

reader.addEventListener("touchmove",e=>{
  if(e.touches.length==2){
    e.preventDefault();

    const dist=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );

    zoom=Math.max(
      .5,
      Math.min(3,zoom*(dist/start))
    );

    start=dist;

    applyZoom();
  }
},{passive:false});

// Double Tap
let last=0;

reader.addEventListener("touchend",()=>{
  const now=Date.now();

  if(now-last<250){
    zoom=zoom>1?1:2;
    applyZoom();
  }

  last=now;
});

document.addEventListener("keydown",e=>{
  if(
    (e.ctrlKey||e.metaKey)
    &&
    ["p","s"].includes(e.key.toLowerCase())
  ){
    e.preventDefault();
  }
});

document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
</script>

</body>
</html>
