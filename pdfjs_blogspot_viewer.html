<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SehatiCenter Reader V3</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
#topbar{
  position:fixed;top:0;left:0;right:0;height:56px;
  background:#111;display:flex;align-items:center;
  gap:8px;padding:8px;z-index:999;
}
.logo{font-weight:bold;color:#60A5FA;margin-right:auto}
.btn{
  background:#2563EB;color:#fff;border:none;
  border-radius:8px;padding:8px 10px;cursor:pointer;
}
#progress{position:fixed;top:56px;left:0;right:0;height:3px;background:#222}
#bar{height:100%;width:0;background:#60A5FA}
#wrap{padding-top:60px;height:100vh;overflow:auto;touch-action:none}
#viewer{max-width:760px;margin:auto;transform-origin:top center}
canvas{display:block;width:100%;background:#fff;margin-bottom:2px}
.dark canvas{filter:invert(1) hue-rotate(180deg)}
#toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  background:#111;padding:10px 16px;border-radius:20px;
  display:none;
}
</style>
</head>

<body>

<div id="topbar">
  <div class="logo">SEHATICENTER</div>
  <button class="btn" onclick="zoomOut()">−</button>
  <button class="btn" onclick="zoomIn()">+</button>
  <button class="btn" onclick="toggleDark()">🌙</button>
  <button class="btn" onclick="saveBookmark()">🔖</button>
  <button class="btn" onclick="goFull()">⛶</button>
</div>

<div id="progress"><div id="bar"></div></div>

<div id="wrap">
  <div id="viewer"></div>
</div>

<div id="toast"></div>

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";

// ===== GANTI NAMA KOMIK DI SINI =====
const comic =
  new URLSearchParams(location.search).get("comic") || "Dwikora.pdf";
// ================================

const pdf = await pdfjsLib.getDocument(comic).promise;
const viewer = document.getElementById("viewer");

for (let i = 1; i <= pdf.numPages; i++) {
  const page = await pdf.getPage(i);
  const viewport = page.getViewport({ scale: 1.6 });

  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;

  await page.render({
    canvasContext: canvas.getContext("2d"),
    viewport
  }).promise;

  viewer.appendChild(canvas);
}

const key = "bookmark_" + comic;
const pos = localStorage.getItem(key);
if (pos) document.getElementById("wrap").scrollTop = Number(pos);
</script>

<script>
let zoom = 1;
const wrap = document.getElementById("wrap");
const viewer = document.getElementById("viewer");
const toast = document.getElementById("toast");

function show(msg){
  toast.innerText = msg;
  toast.style.display = "block";
  setTimeout(()=>toast.style.display="none",1200);
}

function applyZoom(){
  viewer.style.transform = `scale(${zoom})`;
  viewer.style.paddingBottom = ((zoom-1)*120) + "vh";
}

window.zoomIn = ()=>{
  zoom = Math.min(3, zoom+0.2);
  applyZoom();
};

window.zoomOut = ()=>{
  zoom = Math.max(0.5, zoom-0.2);
  applyZoom();
};

window.toggleDark = ()=> document.body.classList.toggle("dark");

window.saveBookmark = ()=>{
  const comic = new URLSearchParams(location.search).get("comic") || "Dwikora.pdf";
  localStorage.setItem("bookmark_"+comic, wrap.scrollTop);
  show("Bookmark tersimpan");
};

window.goFull = ()=>{
  if(!document.fullscreenElement)
    document.documentElement.requestFullscreen();
  else
    document.exitFullscreen();
};

wrap.addEventListener("scroll", ()=>{
  const p = wrap.scrollTop / (wrap.scrollHeight-wrap.clientHeight) * 100;
  document.getElementById("bar").style.width = p + "%";
});

document.addEventListener("contextmenu", e=>e.preventDefault());
document.addEventListener("dragstart", e=>e.preventDefault());
</script>

</body>
</html>
