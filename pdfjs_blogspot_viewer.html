<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               viewport-fit=cover">

<title>PDF Reader</title>

<style>

/* =====================================================
   RESET
   ===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;

  background:#0b0b0b;

  font-family:Arial,sans-serif;

  overflow:hidden;

  overscroll-behavior:none;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}


/* =====================================================
   TOOLBAR
   ===================================================== */

#top{
  position:fixed;

  top:0;
  left:0;
  right:0;

  height:56px;

  background:#111;

  display:flex;

  justify-content:flex-end;
  align-items:center;

  gap:8px;

  padding:8px 12px;

  z-index:10000;
}

.btn{
  width:40px;
  height:40px;

  border:0;

  border-radius:8px;

  background:#2563EB;

  color:#fff;

  font-size:18px;

  cursor:pointer;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   PROGRESS
   ===================================================== */

#progress{
  position:fixed;

  top:56px;
  left:0;
  right:0;

  height:3px;

  background:#222;

  z-index:9999;
}

#bar{
  width:0;
  height:100%;

  background:#60A5FA;
}


/* =====================================================
   VIEWPORT
   ===================================================== */

/*
   Ini adalah "jendela" seperti viewport Adobe Reader.

   Ukurannya tetap sebesar layar.

   Isi di dalamnya boleh jauh lebih besar.
*/

#viewport{

  position:fixed;

  top:59px;
  left:0;
  right:0;
  bottom:0;

  overflow:hidden;

  background:#0b0b0b;

  touch-action:none;

  cursor:default;

}


/* =====================================================
   DOCUMENT
   ===================================================== */

/*
   Document adalah lembar PDF.

   Kita tidak memakai CSS transform untuk zoom.

   Ukuran document benar-benar diubah.
*/

#document{

  position:absolute;

  top:0;
  left:0;

  width:780px;

  transform-origin:top left;

  will-change:transform;

}


/* =====================================================
   CANVAS
   ===================================================== */

#document canvas{

  display:block;

  width:780px;

  height:auto;

  background:#fff;

  margin:0 0 2px 0;

  pointer-events:none;

  -webkit-user-select:none;
  user-select:none;
}


/* =====================================================
   DARK MODE
   ===================================================== */

.dark #document canvas{
  filter:invert(1) hue-rotate(180deg);
}


/* =====================================================
   THUMBNAILS
   ===================================================== */

#thumbs{

  position:fixed;

  top:70px;
  right:-140px;

  width:130px;

  height:calc(100vh - 90px);

  padding:6px;

  background:#111;

  border-left:1px solid #333;

  overflow-y:auto;

  transition:.25s;

  z-index:10001;

  -webkit-overflow-scrolling:touch;

}

#thumbs.show{
  right:0;
}

.thumb{

  display:block;

  width:100%;

  height:auto;

  margin-bottom:6px;

  border:1px solid #333;

  border-radius:4px;

  cursor:pointer;

  pointer-events:auto;

  touch-action:manipulation;

}


/* =====================================================
   THUMB BUTTON
   ===================================================== */

#thumbBtn{

  position:fixed;

  right:14px;
  bottom:18px;

  width:52px;
  height:52px;

  border:0;

  border-radius:50%;

  background:#2563EB;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  z-index:10002;

  touch-action:manipulation;

  -webkit-tap-highlight-color:transparent;

}


/* =====================================================
   TOAST
   ===================================================== */

#toast{

  position:fixed;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  padding:10px 16px;

  background:#111;

  color:#fff;

  border-radius:20px;

  display:none;

  z-index:10003;

  white-space:nowrap;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

  #top{

    height:52px;

    padding:6px 8px;

    gap:6px;

  }

  .btn{

    width:38px;
    height:38px;

    font-size:17px;

  }

  #progress{

    top:52px;

  }

  #viewport{

    top:55px;

  }

}


/* =====================================================
   SMALL PHONE
   ===================================================== */

@media(max-width:380px){

  #top{

    gap:4px;

    padding-left:5px;
    padding-right:5px;

  }

  .btn{

    width:36px;
    height:36px;

    font-size:16px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     TOOLBAR
     ===================================================== -->

<div id="top">

  <button class="btn"
          onclick="zoomOut()">
    −
  </button>

  <button class="btn"
          onclick="zoomIn()">
    +
  </button>

  <button class="btn"
          onclick="toggleDark()">
    🌙
  </button>

  <button class="btn"
          onclick="saveBookmark()">
    🔖
  </button>

  <button class="btn"
          onclick="goFull()">
    ⛶
  </button>

</div>


<!-- =====================================================
     PROGRESS
     ===================================================== -->

<div id="progress">
  <div id="bar"></div>
</div>


<!-- =====================================================
     VIEWPORT
     ===================================================== -->

<div id="viewport">

  <div id="document"></div>

</div>


<!-- =====================================================
     THUMBNAILS
     ===================================================== -->

<div id="thumbs"></div>


<button id="thumbBtn"
        onclick="toggleThumbs()">
  ☰
</button>


<div id="toast"></div>



<!-- =====================================================
     PDF.JS
     ===================================================== -->

<script type="module">

import * as pdfjsLib from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.6.82/pdf.worker.min.mjs";


/* =====================================================
   PDF NAME
   ===================================================== */

const comic =
new URLSearchParams(location.search).get("comic")
|| "Dwikora.pdf";


/* =====================================================
   ELEMENT
   ===================================================== */

const documentLayer =
document.getElementById("document");

const thumbs =
document.getElementById("thumbs");


/* =====================================================
   LOAD PDF
   ===================================================== */

const pdf =
await pdfjsLib.getDocument(comic).promise;


/* =====================================================
   RENDER PAGES
   ===================================================== */

for(
  let i=1;
  i<=pdf.numPages;
  i++
){

  const page =
  await pdf.getPage(i);


  /* ---------------------------------------------
     MAIN PAGE
     --------------------------------------------- */

  const viewport =
  page.getViewport({
    scale:1.6
  });


  const canvas =
  document.createElement("canvas");


  canvas.width =
  viewport.width;


  canvas.height =
  viewport.height;


  await page.render({

    canvasContext:
      canvas.getContext("2d"),

    viewport:
      viewport

  }).promise;


  documentLayer.appendChild(
    canvas
  );


  /* ---------------------------------------------
     THUMBNAIL
     --------------------------------------------- */

  const thumbViewport =
  page.getViewport({
    scale:.22
  });


  const thumb =
  document.createElement("canvas");


  thumb.width =
  thumbViewport.width;


  thumb.height =
  thumbViewport.height;


  await page.render({

    canvasContext:
      thumb.getContext("2d"),

    viewport:
      thumbViewport

  }).promise;


  thumb.className="thumb";


  thumb.onclick=()=>{

    goToPage(i);

    thumbs.classList.remove(
      "show"
    );

  };


  thumbs.appendChild(
    thumb
  );

}


/* =====================================================
   INITIAL POSITION
   ===================================================== */

const saved =
localStorage.getItem(
  "bm_"+comic
);


if(saved){

  setTimeout(()=>{

    const data =
    JSON.parse(saved);

    if(
      data &&
      typeof data.x==="number" &&
      typeof data.y==="number"
    ){

      panX=data.x;

      panY=data.y;

    }

    if(
      data &&
      typeof data.zoom==="number"
    ){

      zoom=data.zoom;

    }

    apply();

  },100);

}

</script>



<!-- =====================================================
     READER ENGINE
     ===================================================== -->

<script>


/* =====================================================
   VARIABLES
   ===================================================== */

let zoom=1;


/*
   Posisi dokumen di dalam viewport.
*/

let panX=0;

let panY=0;


/*
   Touch.
*/

let isPinching=false;

let isPanning=false;


/*
   Pinch.
*/

let pinchStartDistance=0;

let pinchStartZoom=1;


/*
   Pan touch.
*/

let panStartX=0;

let panStartY=0;

let panStartOriginX=0;

let panStartOriginY=0;


/*
   Double tap.
*/

let lastTap=0;


/*
   Mouse.
*/

let mouseDown=false;

let mouseStartX=0;

let mouseStartY=0;

let mouseStartPanX=0;

let mouseStartPanY=0;


/* =====================================================
   ELEMENT
   ===================================================== */

const viewport =
document.getElementById(
  "viewport"
);

const documentLayer =
document.getElementById(
  "document"
);

const toast =
document.getElementById(
  "toast"
);


/* =====================================================
   TOAST
   ===================================================== */

function show(text){

  toast.innerText=text;

  toast.style.display="block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
  setTimeout(()=>{

    toast.style.display="none";

  },900);

}


/* =====================================================
   GET DOCUMENT SIZE
   ===================================================== */

function getDocumentSize(){

  return {

    width:
      documentLayer.offsetWidth *
      zoom,

    height:
      documentLayer.offsetHeight *
      zoom

  };

}


/* =====================================================
   LIMIT PAN
   ===================================================== */

function limitPan(){

  const vw =
    viewport.clientWidth;

  const vh =
    viewport.clientHeight;


  const size =
    getDocumentSize();


  /*
   * Kalau dokumen lebih kecil dari
   * viewport, center.
   */

  if(size.width<=vw){

    panX =
      (vw-size.width)/2;

  }else{

    /*
     * Jangan bisa digeser melewati
     * sisi kiri/kanan dokumen.
     */

    const minX =
      vw-size.width;


    panX =
      Math.min(
        0,
        Math.max(
          minX,
          panX
        )
      );

  }


  if(size.height<=vh){

    panY =
      (vh-size.height)/2;

  }else{

    const minY =
      vh-size.height;


    panY =
      Math.min(
        0,
        Math.max(
          minY,
          panY
        )
      );

  }

}


/* =====================================================
   APPLY
   ===================================================== */

function apply(){

  limitPan();


  documentLayer.style.transform =
    "translate3d("+
    panX+"px,"+
    panY+"px,0) "+
    "scale("+zoom+")";


  updateProgress();

}


/* =====================================================
   ZOOM AROUND POINT
   ===================================================== */

function zoomAround(
  newZoom,
  centerX,
  centerY
){

  newZoom =
    Math.max(
      0.5,
      Math.min(
        3,
        newZoom
      )
    );


  /*
   * Posisi dokumen sebelum zoom.
   */

  const oldZoom =
    zoom;


  /*
   * Titik dokumen yang berada
   * di bawah jari.
   */

  const contentX =
    (centerX-panX) /
    oldZoom;


  const contentY =
    (centerY-panY) /
    oldZoom;


  zoom=newZoom;


  /*
   * Pertahankan titik tersebut
   * di bawah jari.
   */

  panX =
    centerX -
    contentX*zoom;


  panY =
    centerY -
    contentY*zoom;


  apply();

}


/* =====================================================
   BUTTON ZOOM IN
   ===================================================== */

function zoomIn(){

  const cx =
    viewport.clientWidth/2;

  const cy =
    viewport.clientHeight/2;


  zoomAround(
    zoom+0.2,
    cx,
    cy
  );


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* =====================================================
   BUTTON ZOOM OUT
   ===================================================== */

function zoomOut(){

  const cx =
    viewport.clientWidth/2;

  const cy =
    viewport.clientHeight/2;


  zoomAround(
    zoom-0.2,
    cx,
    cy
  );


  show(
    Math.round(
      zoom*100
    )+"%"
  );

}


/* =====================================================
   DARK MODE
   ===================================================== */

function toggleDark(){

  document.body.classList.toggle(
    "dark"
  );

}


/* =====================================================
   THUMBNAILS
   ===================================================== */

function toggleThumbs(){

  document
    .getElementById("thumbs")
    .classList.toggle(
      "show"
    );

}


/* =====================================================
   PAGE NAVIGATION
   ===================================================== */

function goToPage(pageNumber){

  const canvases =
    documentLayer.querySelectorAll(
      "canvas"
    );


  const canvas =
    canvases[pageNumber-1];


  if(!canvas){
    return;
  }


  /*
   * Posisi canvas dalam document.
   */

  const targetY =
    canvas.offsetTop;


  /*
   * Pada zoom berapa pun,
   * arahkan bagian atas halaman
   * ke bagian atas viewport.
   */

  panY =
    -targetY*zoom;


  /*
   * Tengah horizontal.
   */

  const size =
    getDocumentSize();


  if(size.width >
     viewport.clientWidth){

    panX =
      (
        viewport.clientWidth -
        size.width
      )/2;

  }


  apply();

}


/* =====================================================
   BOOKMARK
   ===================================================== */

function saveBookmark(){

  localStorage.setItem(

    "bm_"+comic,

    JSON.stringify({

      x:panX,

      y:panY,

      zoom:zoom

    })

  );


  show(
    "Bookmark tersimpan"
  );

}


/* =====================================================
   FULLSCREEN
   ===================================================== */

function goFull(){

  if(
    !document.fullscreenElement
  ){

    document.documentElement
      .requestFullscreen()
      .catch(()=>{});

  }else{

    document.exitFullscreen();

  }

}


/* =====================================================
   PROGRESS
   ===================================================== */

function updateProgress(){

  const size =
    getDocumentSize();


  const vh =
    viewport.clientHeight;


  const maxY =
    Math.max(
      0,
      size.height-vh
    );


  let currentY =
    -panY;


  currentY =
    Math.max(
      0,
      Math.min(
        maxY,
        currentY
      )
    );


  const percent =
    maxY>0
    ? currentY/maxY*100
    : 0;


  document
    .getElementById("bar")
    .style.width =
    percent+"%";

}


/* =====================================================
   DISTANCE TWO FINGERS
   ===================================================== */

function getDistance(a,b){

  return Math.hypot(

    a.clientX-b.clientX,

    a.clientY-b.clientY

  );

}


/* =====================================================
   CENTER TWO FINGERS
   ===================================================== */

function getCenter(a,b){

  return {

    x:
      (
        a.clientX+
        b.clientX
      )/2,

    y:
      (
        a.clientY+
        b.clientY
      )/2

  };

}


/* =====================================================
   TOUCH START
   ===================================================== */

viewport.addEventListener(
  "touchstart",
  function(e){

    /*
     * ==============================================
     * TWO FINGER = PINCH
     * ==============================================
     */

    if(
      e.touches.length===2
    ){

      isPinching=true;

      isPanning=false;


      pinchStartDistance =
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      pinchStartZoom=zoom;


      lastTap=0;


      return;

    }


    /*
     * ==============================================
     * ONE FINGER
     * ==============================================
     */

    if(
      e.touches.length===1
    ){

      /*
       * Saat zoom:
       * satu jari = PAN.
       */

      if(zoom>1){

        isPanning=true;


        panStartX =
          e.touches[0].clientX;


        panStartY =
          e.touches[0].clientY;


        panStartOriginX=panX;

        panStartOriginY=panY;


        lastTap=0;

      }

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH MOVE
   ===================================================== */

viewport.addEventListener(
  "touchmove",
  function(e){

    /*
     * ==============================================
     * PINCH
     * ==============================================
     */

    if(
      isPinching &&
      e.touches.length===2
    ){

      e.preventDefault();


      const currentDistance =
        getDistance(
          e.touches[0],
          e.touches[1]
        );


      if(
        pinchStartDistance<=0
      ){

        return;

      }


      const center =
        getCenter(
          e.touches[0],
          e.touches[1]
        );


      const factor =
        currentDistance /
        pinchStartDistance;


      const newZoom =
        pinchStartZoom *
        factor;


      zoomAround(
        newZoom,
        center.x,
        center.y
      );


      return;

    }


    /*
     * ==============================================
     * PAN
     * ==============================================
     */

    if(
      isPanning &&
      e.touches.length===1 &&
      zoom>1
    ){

      e.preventDefault();


      const dx =
        e.touches[0].clientX -
        panStartX;


      const dy =
        e.touches[0].clientY -
        panStartY;


      panX =
        panStartOriginX +
        dx;


      panY =
        panStartOriginY +
        dy;


      apply();

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   TOUCH END
   ===================================================== */

viewport.addEventListener(
  "touchend",
  function(e){

    /*
     * ==============================================
     * PINCH SELESAI
     * ==============================================
     */

    if(isPinching){

      if(
        e.touches.length<2
      ){

        isPinching=false;

        pinchStartDistance=0;


        /*
         * JANGAN RESET ZOOM.
         */

        show(
          Math.round(
            zoom*100
          )+"%"
        );

      }


      return;

    }


    /*
     * ==============================================
     * PAN SELESAI
     * ==============================================
     */

    if(isPanning){

      isPanning=false;

      return;

    }


    /*
     * ==============================================
     * DOUBLE TAP
     * ==============================================
     */

    if(
      e.changedTouches.length!==1
    ){

      lastTap=0;

      return;

    }


    const now =
      Date.now();


    if(
      now-lastTap<300
    ){

      const touch =
        e.changedTouches[0];


      const rect =
        viewport.getBoundingClientRect();


      const x =
        touch.clientX -
        rect.left;


      const y =
        touch.clientY -
        rect.top;


      if(zoom<=1){

        zoomAround(
          2,
          x,
          y
        );

      }else{

        zoomAround(
          1,
          x,
          y
        );

      }


      show(
        Math.round(
          zoom*100
        )+"%"
      );


      lastTap=0;

    }else{

      lastTap=now;

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   MOUSE PAN DESKTOP
   ===================================================== */

viewport.addEventListener(
  "mousedown",
  function(e){

    if(
      zoom<=1
    ){

      return;

    }


    /*
     * Hanya tombol kiri.
     */

    if(e.button!==0){

      return;

    }


    mouseDown=true;


    mouseStartX=e.clientX;

    mouseStartY=e.clientY;


    mouseStartPanX=panX;

    mouseStartPanY=panY;


    viewport.style.cursor=
      "grabbing";

  }
);


window.addEventListener(
  "mousemove",
  function(e){

    if(
      !mouseDown ||
      zoom<=1
    ){

      return;

    }


    const dx =
      e.clientX -
      mouseStartX;


    const dy =
      e.clientY -
      mouseStartY;


    panX =
      mouseStartPanX +
      dx;


    panY =
      mouseStartPanY +
      dy;


    apply();

  }
);


window.addEventListener(
  "mouseup",
  function(){

    if(mouseDown){

      mouseDown=false;

      viewport.style.cursor=
        "default";

    }

  }
);


/* =====================================================
   MOUSE WHEEL ZOOM
   ===================================================== */

viewport.addEventListener(
  "wheel",
  function(e){

    /*
     * Ctrl + wheel seperti PDF reader.
     */

    if(e.ctrlKey){

      e.preventDefault();


      const rect =
        viewport.getBoundingClientRect();


      const x =
        e.clientX -
        rect.left;


      const y =
        e.clientY -
        rect.top;


      const direction =
        e.deltaY<0
        ? 0.1
        : -0.1;


      zoomAround(
        zoom+direction,
        x,
        y
      );


      show(
        Math.round(
          zoom*100
        )+"%"
      );

    }

  },
  {
    passive:false
  }
);


/* =====================================================
   KEYBOARD
   ===================================================== */

document.addEventListener(
  "keydown",
  function(e){

    /*
     * Arrow keys ketika zoom.
     */

    if(zoom>1){

      const amount=40;


      if(e.key==="ArrowLeft"){

        panX+=amount;

        apply();

        e.preventDefault();

      }


      if(e.key==="ArrowRight"){

        panX-=amount;

        apply();

        e.preventDefault();

      }


      if(e.key==="ArrowUp"){

        panY+=amount;

        apply();

        e.preventDefault();

      }


      if(e.key==="ArrowDown"){

        panY-=amount;

        apply();

        e.preventDefault();

      }

    }


    /*
     * Disable Ctrl+P / Ctrl+S.
     */

    if(
      (e.ctrlKey||e.metaKey) &&
      ["p","s"].includes(
        e.key.toLowerCase()
      )
    ){

      e.preventDefault();

    }

  }
);


/* =====================================================
   PREVENT CONTEXT MENU
   ===================================================== */

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  function(){

    apply();

  }
);


/* =====================================================
   INITIAL
   ===================================================== */

apply();

</script>


</body>
</html>
